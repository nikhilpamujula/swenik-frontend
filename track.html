// ================================================================
// TOP-LEVEL REFRESH / INTERACTION
// ================================================================
function setBanner(msg) {
  document.getElementById('bannerSlot').innerHTML = msg ? `<div class="banner-error">${msg}</div>` : '';
}

let refreshInFlight = false;
let bootRetryT = null; // one-shot quick retry while still on the seed snapshot
let lastVerifiedAt = 0; // last time the server confirmed our list is current

// A countdown made sense when the list refreshed every 10 seconds. It no
// longer polls on a schedule you would want to watch — it checks continuously
// and only redraws when the server actually has something new. So the header
// reports the thing that still matters: how old the numbers on screen are.
function updateRefreshStatus() {
  const el = document.getElementById('nextRefresh');
  if (!el) return;
  if (refreshInFlight && !hasLoadedOnce) { el.textContent = 'Refreshing…'; return; }
  // Age is measured from the last time the server CONFIRMED this list is
  // current — not from the last time a number moved. In a quiet market the
  // prices can be seconds old and still be the newest that exist, and calling
  // them stale would be wrong. If the connection drops this starts climbing,
  // which is exactly when you want to notice.
  const age = lastVerifiedAt ? Math.max(0, Math.round((Date.now() - lastVerifiedAt) / 1000)) : null;
  el.textContent = age === null ? 'Live'
    : age <= 1 ? 'Live · just now'
    : `Live · ${age}s old`;
}

async function fullRefresh() {
  // Don't stack requests: on a slow network a fetch can take longer than the
  // 10s auto-refresh interval. Without this guard the requests pile up and
  // choke each other — the #1 cause of the "everything lags" feeling.
  if (refreshInFlight) return;
  refreshInFlight = true;
  updateRefreshStatus();
  let ok = true, errMsg = null;
  const fetchedVol = withVolume; // remember which volume this fetch is for
  try {
    const data = await fetchOpportunities(fetchedVol);
    usingSeedData = false;
    lastVerifiedAt = Date.now();
    // A 204 means the server checked and our list is still the current one.
    // Nothing to merge and nothing to repaint — leave the DOM completely
    // alone. (refreshInFlight is cleared by the finally block below.)
    if (data.unchanged) {
      setBanner(null); // a reachable server clears any earlier "couldn't reach" notice
      // The DATA hasn't changed — but the VIEW may have (a tab switch whose
      // repaint slipped). If the screen was last painted for a different
      // page/tab/volume than the one we're on, repaint from the data we
      // already hold rather than leaving the wrong tab's cards up.
      if (__lastPaintSig !== viewSig()) renderCards();
      updateRefreshStatus();
      return;
    }
    // If the user flipped volume WHILE this was in flight, don't clobber the
    // (already instant-repainted) new view with the old volume's data — show
    // the current volume's cached snapshot instead.
    if (String(fetchedVol) === String(withVolume)) {
      allOpportunities = data.opportunities;
      lastFetchTs = data.ts;
      saveWarmSnapshot(); // the next fresh open paints THIS, not the seed
    } else if (volSnapCache[String(withVolume)]) {
      allOpportunities = volSnapCache[String(withVolume)].opportunities;
      lastFetchTs = volSnapCache[String(withVolume)].ts;
    }
  } catch (err) {
    ok = false;
    errMsg = err.message;
  } finally {
    refreshInFlight = false;
    hideSpinner(); // if a manual refresh showed the rotating circle, retire it
  }
  hasLoadedOnce = true;

  // If we still have never seen live data (cold/slow backend on first load),
  // don't make the user sit on the stale seed until the next 10s tick — retry
  // quickly. Backs off after the first fast retry so we don't hammer a down
  // backend (the 10s interval takes over from there).
  if (!ok && usingSeedData && !bootRetryT) {
    bootRetryT = setTimeout(() => { bootRetryT = null; fullRefresh(); }, 3500);
  }

  setBanner(ok ? null : (usingSeedData
    ? `Couldn't reach the scanner (${errMsg}). Showing a saved snapshot — prices and profits are NOT live.`
    : `Couldn't reach the scanner (${errMsg}).${allOpportunities.length ? ' Showing the last data we have.' : ''}`));

  // Keep the sidebar highlight and active page in sync so a manual refresh
  // never bounces the user off Loop/Intra Loop back to Direct.
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  const navEl = PAGES[currentPage] && document.getElementById(PAGES[currentPage].navId);
  if (navEl) navEl.classList.add('active');
  // NOTE: we deliberately do NOT rebuild the toolbar here. It was being torn
  // down and recreated every 10s, which made the toggles/sort controls flicker
  // and could swallow a tap that landed right as the refresh fired. The toolbar
  // only depends on user choices (filters/toggles), not on fetched data, so it
  // never needs rebuilding on a data refresh — pages with live counts
  // (Giottus/CoinSwitch) refresh their own toolbars.
  renderCards();
  // WazirX (native venue) shows live sub-tab counts in its toolbar. Update the
  // count TEXT in place — never rebuild the toolbar on a data tick, or a tap
  // landing at that instant dies on a destroyed button.
  if (venueCfg() && venueCfg().native) updateVenueTabCounts();
  document.getElementById('lastRefreshed').innerHTML = lastFetchTs
    ? `Last refreshed: <strong>${fmtTime(new Date(lastFetchTs))}</strong>` : 'Last refreshed: —';
  updateRefreshStatus();
  if (openCard && openCard.type === 'loop') {
    // Keep the open Track Live modal in place — don't full-redraw it here (the
    // modal has its own 5s live poll); just refresh its numbers + book.
    const e = loopLiveEntry || findOpportunity(openCard);
    if (e && document.getElementById('loopObSlot')) updateLoopModalLive(e);
    else renderLoopModal();
  }
  if (openCard && openCard.type === 'intraloop') renderIntraLoopModal();
  // Render the open book from the last-good LIVE entry (which holds the full
  // two-sided book), NOT the list entry — the list entry has no order book, so
  // rendering it here made the open Track Live book collapse to the sparse
  // "Connecting…" fallback every 10s and then repopulate (the "vanishing").
  if (openCard && openCard.type === 'direct') renderDirectModal(directLiveEntry || findOpportunity(openCard));
}

const __loadOverlay = document.createElement('div');
__loadOverlay.id = 'loadOverlay';
__loadOverlay.innerHTML = '<div class="ring"></div>';
document.body.appendChild(__loadOverlay);
let __spinShownAt = 0, __spinHideT = null;
function showSpinner() {
  // Never over live data: if a Track Live modal or an Execute page is open,
  // the user is READING — a loader sheet on top of it reads as "loading",
  // which is exactly what he asked to have removed. The refresh still runs;

  const m = document.getElementById('modalOverlay');

function manualRefresh() {

// ================================================================
// GIOTTUS page — self-contained intra-exchange route scanner.
// Data comes from /api/giottus/* (Vercel serverless proxies living in
// the same frontend repo) — the Swenik backend is NOT involved at all.
// Pipeline: 1 ticker call screens every route (triangles + cross-pair,
// USDT & BTC bridges, fees included) → routes above the threshold get
// real order-book depth (a few per cycle, spaced, cached, auto-backoff)
// → each is walked to its MAX profitable size, force-sized up to
// Giottus's minimum order values when needed → only routes clearing the
// minimum profit survive, best rupee-profit first.
// ================================================================
let gTimer = null, gTab = 'intra', gSettingsOpen = false;
let gBookTimer = null; // 3s refresh for THE open Giottus order book (book only, not the page)
let gOvKey = null;              // 'st:<label>' | 'sw:' | 'c:' | 'w:' — the ONE open book (one at a time)
let gBookSoftBackoffUntil = 0;  // overlay's own gentle 429 backoff (5s), separate from the page cycle's
let gBookLastFetch = new Map(); // market -> ts of last LIVE depth pull (dedupe within 2s)
let gSaveAck = null;            // settings save acknowledgment {ok, cfg, at}
let gSettings = { feeInr: 0.4, feeUsdt: 0.3, thr: 1.0, minP: 100, minInr: 1000, minUsdt: 10, topK: 15 };
let gTicker = null, gLastRoutes = null, gCandidates = [], gMkts = 0, gUiRate = '—';
const gDepth = {}, gChecked = new Map();
let gRlHits = 0, gCalls = 0, gBackoffUntil = 0, gBackoffMs = 15000, gLastTs = '—', gErr = null, gRefreshing = false;
let gServerSnap = null; // /api/giottus/snapshot — what the 24/7 alert engine sees
const G_TTL = 5 * 60 * 1000, G_PER_CYCLE = 8, G_SPACING = 300;
// Cross routes pair only the TOP-K triangles per direction (gSettings.topK,
// default 15): the out-triangle ranking and the out-half ranking are the same
// order (each triangle = its half × the same usdtinr constant), so the best
// cross pairings are guaranteed to come from the top triangles of each side.
const G_SPIKE_PCT = 0.35;    // re-verify immediately if a route's screen % rises this much past its verdict
// A verdict is trusted only while (a) it's within the TTL AND (b) the route's
// live screen % hasn't spiked past what it was when the verdict was recorded —
// a stale "worthless" verdict must not hide a route that just turned juicy.
const gFreshCheck = (e, curPct) => e && (Date.now() - e.ts) < G_TTL
  && !(curPct !== undefined && isFinite(e.scrPct) && curPct - e.scrPct > G_SPIKE_PCT);
const gLv = raw => (raw || []).map(([p, q]) => ({ p: parseFloat(p), q: parseFloat(q) })).filter(l => l.p > 0 && l.q > 0);
const gInrFmt = n => '₹' + Math.round(n).toLocaleString('en-IN');
const gInTab = r => gTab === 'intra' ? r.legsSpec.length === 3 : r.legsSpec.length === 4;

function gWalk(legs, { stopWhenUnprofitable = true, targetIn = Infinity } = {}) {
  const idx = legs.map(() => 0);
  const rem = legs.map(l => (l.levels[0] ? l.levels[0].q : 0));
  const used = legs.map(l => l.levels.map(() => 0));
  const notion = legs.map(() => 0);
  let inrIn = 0, inrOut = 0, guard = 0, bookEnded = false;
  while (guard++ < 4000 && inrIn < targetIn - 1e-9) {
    let ratio = 1;
    const factorTo = [1];
    for (let j = 0; j < legs.length; j++) {
      const L = legs[j], lv = L.levels[idx[j]];
      if (!lv || rem[j] <= 1e-12) { ratio = -1; break; }
      ratio *= L.side === 'buy' ? 1 / (lv.p * (1 + L.fee)) : lv.p * (1 - L.fee);
      factorTo.push(ratio);
    }
    if (ratio === -1) { bookEnded = true; break; }
    if (stopWhenUnprofitable && ratio <= 1) break;
    let slice = targetIn - inrIn;
    for (let j = 0; j < legs.length; j++) {
      const limitFlow = legs[j].side === 'buy' ? factorTo[j + 1] : factorTo[j];
      if (limitFlow > 0) slice = Math.min(slice, rem[j] / limitFlow);
    }
    if (!isFinite(slice) || slice <= 1e-9) break;
    inrIn += slice; inrOut += slice * ratio;
    for (let j = 0; j < legs.length; j++) {
      const L = legs[j];
      const limitFlow = L.side === 'buy' ? factorTo[j + 1] : factorTo[j];
      rem[j] -= slice * limitFlow; used[j][idx[j]] += slice * limitFlow;
      notion[j] += L.side === 'buy' ? slice * factorTo[j] / (1 + L.fee) : slice * factorTo[j + 1] / (1 - L.fee);
      if (rem[j] <= 1e-9) { idx[j]++; rem[j] = L.levels[idx[j]] ? L.levels[idx[j]].q : 0; }
    }
  }
  if (inrIn <= 0) return null;
  const complete = !isFinite(targetIn) || inrIn >= targetIn - 1e-6 || !bookEnded;
  return { inrIn, inrOut, profit: inrOut - inrIn, pct: (inrOut / inrIn - 1) * 100, used, notion, complete };
}

function gVerdict(legs, legsSpec, mins) {
  const minFor = q => q === 'inr' ? mins.inr : q === 'usdt' ? mins.usdt : mins.btc;
  const meets = w => w && w.notion.every((n, j) => n + 1e-6 >= minFor(legsSpec[j].quote));
  const w = gWalk(legs);
  if (meets(w)) return { walk: w, forced: false };
  let ratio = 1; const factorTo = [1];
  for (const L of legs) {
    const lv = L.levels[0];
    if (!lv) return { walk: 'none', forced: false };
    ratio *= L.side === 'buy' ? 1 / (lv.p * (1 + L.fee)) : lv.p * (1 - L.fee);
    factorTo.push(ratio);
  }
  let S = 0;
  for (let j = 0; j < legs.length; j++) {
    const m = minFor(legsSpec[j].quote);
    if (!m) continue;
    const flow = legs[j].side === 'buy' ? factorTo[j] / (1 + legs[j].fee) : factorTo[j + 1] / (1 - legs[j].fee);
    if (flow > 0) S = Math.max(S, m / flow);
  }
  if (!isFinite(S) || S <= 0) return { walk: 'none', forced: false };
  for (let iter = 0; iter < 4; iter++) {
    const f = gWalk(legs, { stopWhenUnprofitable: false, targetIn: S * 1.001 });
    if (!f || !f.complete) return { walk: 'none', forced: true };
    if (meets(f)) return { walk: f, forced: true };
    let bump = 1;
    for (let j = 0; j < legs.length; j++) {
      const m = minFor(legsSpec[j].quote);
      if (m && f.notion[j] < m) bump = Math.max(bump, m / f.notion[j]);
    }
    S *= bump * 1.02;
  }
  return { walk: 'none', forced: true };
}

let gBadMkts = []; // markets with a crossed/glitched ticker (bid ≥ ask) — untrustworthy, skipped
function gMaps() {
  const maps = { inr: new Map(), usdt: new Map(), btc: new Map() };
  gMkts = 0; gBadMkts = [];
  for (const [sym, t] of Object.entries(gTicker || {})) {
    if (!t || !t.base_unit || !t.quote_unit) continue;
    gMkts++;
    const coin = String(t.base_unit).toLowerCase(), quote = String(t.quote_unit).toLowerCase();
    if (!maps[quote]) continue;
    const ask = parseFloat(t.sell), bid = parseFloat(t.buy);
    // Glitch guard: a NEGATIVE spread (bid strictly above ask) is a data
    // error, not free money — routes built on it are fake arbitrage. Zero
    // spread (bid == ask, a briefly locked market) is legitimate and kept.
    // No memory here: this re-evaluates from the live ticker every cycle,
    // so a market returns automatically the moment its glitch clears.
    if (isFinite(ask) && ask > 0 && isFinite(bid) && bid > 0 && bid > ask) { gBadMkts.push(sym.toLowerCase()); continue; }
    maps[quote].set(coin, { sym: sym.toLowerCase(), ask: isFinite(ask) && ask > 0 ? ask : null, bid: isFinite(bid) && bid > 0 ? bid : null });
  }
  const ui = maps.inr.get('usdt');
  gUiRate = ui && ui.bid ? `${ui.bid} / ${ui.ask}` : '—';
  return maps;
}

function gScreen(maps) {
  const IF = gSettings.feeInr / 100, BF = gSettings.feeUsdt / 100;
  const routes = [];
  gExclHalves = [];
  for (const bridge of ['usdt', 'btc']) {
    const bmap = maps[bridge], bInr = maps.inr.get(bridge);
    if (!bmap || !bmap.size) continue;
    const elig = [];
    for (const [coin, ci] of maps.inr) {
      // Only skip the bridge coin itself (that would be a degenerate INR→X→X→INR).
      // BTC and USDT ARE valid traded coins on the OTHER bridge — e.g. via the
      // USDT bridge, INR→BTC→USDT→INR (buy BTC/INR, sell BTC/USDT, sell USDT/INR)
      // is a real triangle. Blanket-excluding btc/usdt here hid those entirely.
      if (coin === bridge) continue;
      const cb = bmap.get(coin);
      if (cb) elig.push({ coin, ci, cb });
    }
    const BU = bridge.toUpperCase();
    if (bInr && bInr.ask && bInr.bid) {
      for (const { coin, ci, cb } of elig) {
        const C = coin.toUpperCase();
        // Triangles get the same viability gate as cross halves: a coin whose
        // books can't hold the exchange minimum (e.g. STO's empty INR bids)
        // is excluded until a 5-min re-probe shows liquidity returned.
        const okOut = gHalfViable({ coin, ci, cb }, true, bridge), okRet = gHalfViable({ coin, ci, cb }, false, bridge);
        if ((ci.ask && cb.bid && !okOut) || (ci.bid && cb.ask && !okRet)) gExclHalves.push({ coin: C, side: 'triangle' });
        if (okOut && ci.ask && cb.bid) routes.push({ label: `INR → ${C} → ${BU} → INR`,
          pct: (1 / (ci.ask * (1 + IF))) * (cb.bid * (1 - BF)) * (bInr.bid * (1 - IF)) * 100 - 100,
          legsSpec: [ { side:'buy', market: ci.sym, fee: IF, quote:'inr', label:`Buy ${C} · ${ci.sym}` },
                      { side:'sell', market: cb.sym, fee: BF, quote:bridge, label:`Sell ${C} · ${cb.sym}` },
                      { side:'sell', market: bInr.sym, fee: IF, quote:'inr', label:`Sell ${BU} · ${bInr.sym}` } ] });
        if (okRet && ci.bid && cb.ask) routes.push({ label: `INR → ${BU} → ${C} → INR`,
          pct: (1 / (bInr.ask * (1 + IF))) * (1 / (cb.ask * (1 + BF))) * (ci.bid * (1 - IF)) * 100 - 100,
          legsSpec: [ { side:'buy', market: bInr.sym, fee: IF, quote:'inr', label:`Buy ${BU} · ${bInr.sym}` },
                      { side:'buy', market: cb.sym, fee: BF, quote:bridge, label:`Buy ${C} · ${cb.sym}` },
                      { side:'sell', market: ci.sym, fee: IF, quote:'inr', label:`Sell ${C} · ${ci.sym}` } ] });
      }
    }
    // Cross-pair routes by HALF-DECOMPOSITION instead of brute force.
    // A cross route's profit = (out-half: INR → coinA → bridge) ×
    // (return-half: bridge → coinB → INR), and the halves are independent
    // (no shared books). So rank every out-half and every return-half from
    // the ticker, then pair only the TOP K of each — that tiny set is
    // mathematically guaranteed to contain the best possible combination,
    // instead of queueing thousands of near-clones of one dislocated leg.
    const outs = [], rets = [];
    for (const A of elig) {
      if (A.ci.ask && A.cb.bid) outs.push({ ...A, rate: (1 / (A.ci.ask * (1 + IF))) * (A.cb.bid * (1 - BF)) });
      if (A.cb.ask && A.ci.bid) rets.push({ ...A, rate: (A.ci.bid * (1 - IF)) / (A.cb.ask * (1 + BF)) });
    }
    outs.sort((a, b) => b.rate - a.rate);
    rets.sort((a, b) => b.rate - a.rate);
    // Take the top-K VIABLE halves per side: walk the ranking and skip any
    // half whose cached books can't hold the exchange minimums (recording it
    // for display) — so a great-rate/empty-book half like STO stops
    // monopolising every pairing and the next real half takes its slot.
    const K = Math.max(2, Math.min(40, Math.round(gSettings.topK) || 15));
    const takeViable = (list, isOut) => {
      const kept = [];
      for (const h of list) {
        if (kept.length >= K) break;
        if (gHalfViable(h, isOut, bridge)) kept.push(h);
        else gExclHalves.push({ coin: h.coin.toUpperCase(), side: (isOut ? 'out via ' : 'return via ') + BU });
      }
      return kept;
    };
    const outsV = takeViable(outs, true), retsV = takeViable(rets, false);
    // Triangle-equivalent numbers for the derivation display: what each half
    // would earn AS its own triangle (paying the usdtinr toll), and how much
    // of that toll clubbing the two halves recovers.
    const sBid = (bInr && bInr.bid) ? bInr.bid * (1 - IF) : null;              // sell USDT → INR (out-triangle's last leg)
    const bBuy = (bInr && bInr.ask) ? 1 / (bInr.ask * (1 + IF)) : null;        // INR → buy USDT (return-triangle's first leg)
    const spreadPct = (sBid && bBuy) ? (1 / (sBid * bBuy) - 1) * 100 : null;   // usdtinr toll recovered by clubbing
    for (const A of outsV) {
      for (const B of retsV) {
        if (A.coin === B.coin) continue;
        const pct = A.rate * B.rate * 100 - 100;
        const CA = A.coin.toUpperCase(), CB = B.coin.toUpperCase();
        routes.push({ label: `INR → ${CA} → ${BU} → ${CB} → INR`, pct,
          deriv: (sBid && bBuy) ? { outCoin: CA, retCoin: CB,
            outTri: (A.rate * sBid - 1) * 100, retTri: (bBuy * B.rate - 1) * 100, spread: spreadPct } : null,
          legsSpec: [ { side:'buy', market: A.ci.sym, fee: IF, quote:'inr', label:`Buy ${CA} · ${A.ci.sym}` },
                      { side:'sell', market: A.cb.sym, fee: BF, quote:bridge, label:`Sell ${CA} · ${A.cb.sym}` },
                      { side:'buy', market: B.cb.sym, fee: BF, quote:bridge, label:`Buy ${CB} · ${B.cb.sym}` },
                      { side:'sell', market: B.ci.sym, fee: IF, quote:'inr', label:`Sell ${CB} · ${B.ci.sym}` } ] });
      }
    }
  }
  routes.sort((a, b) => b.pct - a.pct);
  return routes;
}

// ---- half viability: learn from cached depth ----
// A half whose books can't even hold the exchange minimum order (e.g. STO's
// entire INR bid side being ~₹65 against a ₹1,000 minimum) is DISQUALIFIED
// from the top-K ranking, so it stops monopolising every cross pairing and
// the next viable half rotates in. Only books fresher than the TTL can
// disqualify — after that the half re-enters for one re-probe (self-healing
// if liquidity comes back).
let gExclHalves = [];
const gBookVal = lv => lv.reduce((s, l) => s + l.p * l.q, 0);
// Persistent blacklist: once a half is PROVEN too thin, it stays excluded even
// after its cached books expire — no more "popping back up every 5 minutes as
// checking depth…". Its markets are silently re-probed in the background each
// cycle, and only fresh books proving real liquidity delete the entry.
const gBadHalves = new Map(); // key `${bridge}:${coin}:${out|ret}` -> { ts, mkts }
function gHalfViable(h, isOut, bridge) {
  const key = `${bridge}:${h.coin}:${isOut ? 'out' : 'ret'}`;
  const now = Date.now();
  const dInr = gDepth[h.ci.sym], dBr = gDepth[h.cb.sym];
  const freshInr = dInr && (now - dInr.ts) < G_TTL;
  const freshBr = dBr && (now - dBr.ts) < G_TTL;
  let bad = false;
  if (freshInr && gBookVal(gLv(isOut ? dInr.asks : dInr.bids)) < gSettings.minInr) bad = true;   // INR-market side
  if (!bad && freshBr && gBookVal(gLv(isOut ? dBr.bids : dBr.asks)) < gSettings.minUsdt) bad = true; // bridge side
  if (bad) { gBadHalves.set(key, { ts: now, mkts: [h.ci.sym, h.cb.sym] }); return false; }
  if (freshInr && freshBr) { gBadHalves.delete(key); return true; } // fully re-verified good
  if (gBadHalves.has(key)) return false; // proven bad before; books stale — stay out, re-probe runs in background
  return true; // genuinely unknown — innocent until probed
}

function gCounts() {
  if (gSnapLive()) return { intra: gServerSnap.aboveIntra || 0, cross: gServerSnap.aboveCross || 0 };
  if (!gLastRoutes) return { intra: 0, cross: 0 };
  const t = gSettings.thr;
  return { intra: gLastRoutes.filter(r => r.pct >= t && r.legsSpec.length === 3).length,
           cross: gLastRoutes.filter(r => r.pct >= t && r.legsSpec.length === 4).length };
}
function gSetTab(t) { gTab = t; saveUiState(); renderToolbar(); renderGiottusPage(); }
function gToggleSettings() { gSettingsOpen = !gSettingsOpen; renderGiottusPage(); }
async function gApplySettings() {
  const read = (id, cur) => { const v = parseFloat(document.getElementById(id)?.value); return isFinite(v) ? v : cur; };
  gSettings = { feeInr: read('gFeeInr', gSettings.feeInr), feeUsdt: read('gFeeUsdt', gSettings.feeUsdt),
                thr: read('gThr', gSettings.thr), minP: read('gMinP', gSettings.minP),
                minInr: read('gMinInr', gSettings.minInr), minUsdt: read('gMinUsdt', gSettings.minUsdt),
                topK: read('gTopK', gSettings.topK) };
  gChecked.clear(); saveUiState();
  // Push to the 24/7 engine, then read back what it is ACTUALLY running on —
  // the ack banner in the settings panel is proof the save acted. (The engine
  // now also dumps its verdict cache and re-ticks immediately on a change, so
  // the results reflect the new numbers in seconds, not after the 5-min TTL.)
  const pushed = await gPushEngineSettings();
  const at = new Date().toLocaleTimeString('en-US', { hour12: false });
  if (pushed) {
    try {
      const res = await fetch(`${API_BASE}/api/giottus/settings`);
      gSaveAck = res.ok ? { ok: true, cfg: await res.json(), at } : { ok: false, at };
    } catch (e) { gSaveAck = { ok: false, at }; }
  } else gSaveAck = { ok: false, at };
  gRefresh();
}

// Settings-panel acknowledgment line — visible proof a save reached the
// engine (or explicitly failed), instead of silently hoping.
function gAckLine() {
  if (!gSaveAck) return '';
  if (!gSaveAck.ok) return `<div style="grid-column:1/-1;" class="g-ack bad">✗ Engine did NOT confirm the save (${gSaveAck.at}) — backend unreachable. Values are active in this browser only; change any field to retry.</div>`;
  const c = gSaveAck.cfg || {};
  return `<div style="grid-column:1/-1;" class="g-ack ok">✓ Engine confirmed at ${gSaveAck.at} — running on: fees ${c.feeInr}% / ${c.feeUsdt}% · screen ≥ ${c.thr}% · exchange min ₹${c.minInr} / ${c.minUsdt} USDT · top-K ${c.topK}. Applied immediately (engine re-checks on save).</div>`;
}

// Push the engine-relevant settings to the server so the 24/7 engine uses them
// (fees, screen threshold, exchange minimums, top-K). Min profit ₹ stays a
// page-only display filter. Persisted server-side so it survives a restart.
async function gPushEngineSettings() {
  try {
    const res = await fetch(`${API_BASE}/api/giottus/settings`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        feeInr: gSettings.feeInr, feeUsdt: gSettings.feeUsdt, thr: gSettings.thr,
        minInr: gSettings.minInr, minUsdt: gSettings.minUsdt, topK: gSettings.topK
      })
    });
    return res.ok;
  } catch (e) { return false; }
}
// Pull the engine's current settings so the inputs reflect what the server is
// actually running on (the server is the source of truth for engine settings).
async function gLoadEngineSettings() {
  try {
    const res = await fetch(`${API_BASE}/api/giottus/settings`);
    if (!res.ok) return;
    const c = await res.json();
    gSettings = { ...gSettings, feeInr: c.feeInr, feeUsdt: c.feeUsdt, thr: c.thr,
                  minInr: c.minInr, minUsdt: c.minUsdt, topK: c.topK };
    saveUiState();
    if (currentPage === 'giottus') renderToolbar();
  } catch (e) {}
}
let gWatch = []; // top-5 by screen % for the active tab, shown regardless of threshold/profit

async function gFetchDepth(m) {
  try {
    const res = await fetch(`/api/giottus/depth?market=${m}`);
    gCalls++;
    if (res.status === 429 || res.status >= 500) {
      gRlHits++; gBackoffUntil = Date.now() + gBackoffMs; gBackoffMs = Math.min(gBackoffMs * 2, 240000); return;
    }
    if (!res.ok) return;
    gBackoffMs = 15000;
    const d = await res.json();
    if (d && (d.asks || d.bids)) gDepth[m] = { asks: d.asks || [], bids: d.bids || [], ts: Date.now(),
      srvTs: (d && isFinite(Number(d.timestamp))) ? Number(d.timestamp) * 1000 : null };
  } catch (e) {}
}

// LIVE depth for the open-book overlay: ?live=1 makes the proxy answer
// no-store (the edge's s-maxage=5 + stale-while-revalidate=15 was EXACTLY the
// "book frozen for 15–20s" flaw — the 3s refresher kept hitting the same URL
// and the edge kept answering from cache), and the cache-buster defeats any
// intermediate cache. A 429/5xx here does NOT poison the page cycle's big
// doubling backoff: the overlay takes its own gentle 5s pause and retries.
async function gFetchDepthLive(m) {
  try {
    const res = await fetch(`/api/giottus/depth?market=${m}&live=1&_=${Date.now()}`, { cache: 'no-store' });
    gCalls++;
    if (res.status === 429 || res.status >= 500) { gBookSoftBackoffUntil = Date.now() + 5000; return 'rl'; }
    if (!res.ok) return 'err';
    const d = await res.json();
    if (d && (d.asks || d.bids)) {
      gDepth[m] = { asks: d.asks || [], bids: d.bids || [], ts: Date.now(),
        srvTs: (d && isFinite(Number(d.timestamp))) ? Number(d.timestamp) * 1000 : null };
      gBookLastFetch.set(m, Date.now());
    }
    return 'ok';
  } catch (e) { return 'err'; }
}

// The server alert engine is the source of truth: it runs 24/7 (while any
// Giottus alert is enabled), so it has warm, persistence-checked verdicts the
// moment this page opens — no cold start. Shown at the top so the page can
// never say "0 tradeable" while an alert just fired.
async function gFetchSnapshot() {
  try {
    const res = await fetch(`${API_BASE}/api/giottus/snapshot`);
    if (!res.ok) return;
    gServerSnap = await res.json();
    if (currentPage === 'giottus') { renderToolbar(); renderGiottusPage(); }
  } catch (e) {}
}

async function gRefresh() {
  if (currentPage !== 'giottus' || gRefreshing) return;
  gRefreshing = true;
  try {
    // The 24/7 server engine is the PRIMARY source: it's already warm, so
    // results (with order books) show instantly. While its snapshot is live
    // this page makes ZERO Giottus calls of its own — the in-page scanner
    // below is only a fallback for when the engine is warming up or down.
    // (Polling the snapshot also acts as a keepalive that wakes the engine.)
    await gFetchSnapshot();
    if (gSnapLive()) { renderToolbar(); renderGiottusPage(); return; }
    const res = await fetch('/api/giottus/ticker');
    if (!res.ok) { let m = `API returned ${res.status}`; try { const b = await res.json(); if (b.error) m = b.error; } catch (e) {} throw new Error(m); }
    gTicker = await res.json(); gErr = null;
    gLastTs = new Date().toLocaleTimeString('en-US', { hour12: false });
    const maps = gMaps();
    gLastRoutes = gScreen(maps);
    renderToolbar(); renderGiottusPage();

    const thr = gSettings.thr;
    // Verify: above-threshold candidates PLUS the top-5 watchlist of each tab
    // (watchlist is depth-checked regardless of threshold). Active tab first.
    const seenQ = new Set();
    const queue = [];
    for (const c of [...gLastRoutes.filter(r => r.pct >= thr && gInTab(r)),
                     ...gLastRoutes.filter(r => gInTab(r)).slice(0, 5),
                     ...gLastRoutes.filter(r => r.pct >= thr && !gInTab(r)),
                     ...gLastRoutes.filter(r => !gInTab(r)).slice(0, 5)]) {
      if (seenQ.has(c.label)) continue;
      seenQ.add(c.label); queue.push(c);
    }
    const toCheck = [];
    for (const c of queue) {
      if (!gFreshCheck(gChecked.get(c.label), c.pct)) toCheck.push(c);
      if (toCheck.length >= G_PER_CYCLE) break;
    }
    gCalls = 0;
    // Background re-probe: blacklisted halves whose books have gone stale get
    // their markets silently re-fetched (max 4 halves/cycle) so they can
    // re-qualify without ever flashing back into the visible lists.
    const reprobe = new Set();
    let reprobes = 0;
    for (const [, info] of gBadHalves) {
      if (reprobes >= 4) break;
      if (info.mkts.some(m => { const d = gDepth[m]; return !d || (Date.now() - d.ts) >= G_TTL; })) {
        info.mkts.forEach(m => reprobe.add(m));
        reprobes++;
      }
    }
    if (Date.now() >= gBackoffUntil && (toCheck.length || reprobe.size)) {
      const btc = maps.usdt.get('btc');
      const btcPx = btc && (btc.bid || btc.ask);
      const mins = { inr: gSettings.minInr, usdt: gSettings.minUsdt, btc: btcPx ? gSettings.minUsdt / btcPx : 0 };
      const need = new Set(reprobe);
      for (const c of toCheck) for (const L of c.legsSpec) need.add(L.market);
      for (const m of need) {
        if (Date.now() < gBackoffUntil) break;
        const cc = gDepth[m];
        if (cc && Date.now() - cc.ts < 30000) continue;
        await gFetchDepth(m);
        await new Promise(r => setTimeout(r, G_SPACING));
      }
      for (const c of toCheck) {
        const legs = []; let ok = true;
        for (const L of c.legsSpec) {
          const d = gDepth[L.market];
          if (!d) { ok = false; break; }
          legs.push({ side: L.side, fee: L.fee, levels: gLv(L.side === 'buy' ? d.asks : d.bids) });
        }
        if (!ok) continue;
        const v = gVerdict(legs, c.legsSpec, mins);
        gChecked.set(c.label, { ts: Date.now(), walk: v.walk, forced: v.forced, scrPct: c.pct });
      }
      if (currentPage === 'giottus') { renderToolbar(); renderGiottusPage(); }
    }
  } catch (e) {
    gErr = e.message;
    if (currentPage === 'giottus') renderGiottusPage();
  } finally { gRefreshing = false; }
}

function gRouteChips(label) {
  return label.split(' → ').map((s, i, arr) =>
    `<span class="g-chip ${s === 'INR' ? 'inr' : ''}">${s}</span>${i < arr.length - 1 ? '<span class="g-arrow">▸</span>' : ''}`).join('');
}

// ---- shared book-row + summary builders (overlay) ----
// A taken row gets a red/green bar sized to the % of that LEVEL consumed,
// the % itself, and the qty you take — the Track Live visual language.
function gBookRows(cls, lv, used) {
  return lv.map((l, i) => {
    const t = (used && used[i]) || 0;
    if (!(t > 1e-9)) return `<tr class="${cls}"><td>${l.p}</td><td>${l.q}</td><td class="take"></td></tr>`;
    const pct = l.q > 0 ? Math.min(100, t / l.q * 100) : 0;
    return `<tr class="${cls} used"><td>${l.p}</td><td>${l.q}</td><td class="take"><span class="g-tbar"><span class="bar"><i style="width:${Math.max(3, Math.round(pct))}%"></i></span><span class="pv">${pct < 1 ? '<1' : pct.toFixed(0)}%</span><span class="tq">${+t.toPrecision(4)}</span></span></td></tr>`;
  }).join('');
}
// Volume-weighted average fill price over the levels the walk takes.
function gLegAvg(lv, used) {
  let q = 0, v = 0;
  for (let i = 0; i < lv.length; i++) { const u = (used && used[i]) || 0; if (u > 1e-9) { q += u; v += u * lv[i].p; } }
  return q > 1e-9 ? v / q : null;
}
// Per-leg summary strip: side, market, avg fill, order value — the whole trade
// at a glance before reading any table. meta: [{L,{lv,used,title,value}}]
function gLegSummary(meta) {
  return '<div class="g-ov-sum">' + meta.map((m, j) => {
    const avg = gLegAvg(m.lv, m.used);
    const q = (m.L.quote || '').toUpperCase();
    const val = m.value == null ? '' : (m.L.quote === 'inr' ? gInrFmt(m.value) : (+m.value).toFixed(2) + ' ' + q);
    return `<div class="g-sum-cell">
      <div class="k"><span class="sb ${m.L.side}">${m.L.side === 'buy' ? 'BUY' : 'SELL'}</span> ${j + 1}. ${m.title}</div>
      <div class="v">${avg != null ? 'avg fill ' + (+avg.toPrecision(6)) : 'avg fill —'}</div>
      <div class="s">${val}</div>
    </div>`;
  }).join('') + '</div>';
}

function gBooksHtml(c) {
  const meta = c.legsSpec.map((L, j) => {
    const d = gDepth[L.market];
    const lv = d ? gLv(L.side === 'buy' ? d.asks : d.bids).slice(0, 8) : [];
    return { L, lv, used: (c.walkUsed && c.walkUsed[j]) || [], title: L.label,
             value: c.walk && c.walk.notion ? c.walk.notion[j] : null };
  });
  return gLegSummary(meta) + '<div class="g-books">' + meta.map(m => {
    if (!m.lv.length) return `<div class="g-book"><div class="bt">${m.title}</div><table><tr><td class="h">no depth</td></tr></table></div>`;
    const cls = m.L.side === 'buy' ? 'ask' : 'bid';
    return `<div class="g-book"><div class="bt">${m.title} — ${m.L.side === 'buy' ? 'asks' : 'bids'}</div>
      <table><tr><td class="h">price</td><td class="h">qty</td><td class="h">you take</td></tr>${gBookRows(cls, m.lv, m.used)}</table></div>`;
  }).join('') + '</div>';
}

// True while the server snapshot is usable (engine on + data < 90s old).
function gSnapLive() {
  return !!(gServerSnap && gServerSnap.enabled && gServerSnap.ts && (Date.now() - gServerSnap.ts) < 90_000);
}

// ---- SERVER-ENGINE VIEW (primary) ----
// The 24/7 alert engine on the backend is always warm, so its results — with
// order books — show the instant this page opens. No cold start, no minutes
// of depth-checking in the browser. The in-page scanner further below is only
// the fallback while the engine is waking up (~15s) or the backend is down.
let gSrvTradable = [], gSrvWatch = []; // current tab's lists, for Books toggles

function gLegTitle(L) {
  const base = L.market.endsWith(L.quote) ? L.market.slice(0, L.market.length - L.quote.length) : L.market;
  return `${base.toUpperCase()}/${L.quote.toUpperCase()}`;
}

// Order books for a tradable. Prefers LIVE Giottus depth (fetched client-side by
// the open-book refresher every 3s) so the prices match the exchange for an
// actual trade; the "you take" consumption bars are recomputed by re-walking the
// SAME trade size (t.inrIn) against that live depth. Falls back per-leg to the
// engine's snapshot book when live depth for a market isn't in hand yet.
function gSrvBooksHtml(t) {
  const legs = t.legs || [];
  const IF = gSettings.feeInr / 100, BF = gSettings.feeUsdt / 100;
  // Recompute the walk on LIVE books with the profit-stop ON (capped at the
  // engine's trade size). If the live books no longer pay, the walk comes back
  // empty — then we show the books CLEAN (no green/red "you take" marks, which
  // would imply a trade that no longer exists) plus an explicit "arb gone at
  // live prices" verdict. The card header above comes from the 24/7 engine and
  // can lag ~15s+, so this line is the truth at this instant.
  let liveUsed = null, liveVerdict = '';
  const haveAllLive = legs.length > 0 && legs.every(L => gDepth[L.market]);
  if (haveAllLive && t.inrIn > 0) {
    const walkLegs = legs.map(L => ({ side: L.side, fee: L.quote === 'inr' ? IF : BF,
      levels: gLv(L.side === 'buy' ? gDepth[L.market].asks : gDepth[L.market].bids) }));
    const w = gWalk(walkLegs, { targetIn: t.inrIn }); // stopWhenUnprofitable: true
    if (w && w.profit > 0.01) {
      liveUsed = w.used;
      liveVerdict = `<div class="g-live-note ok">Live book · still profitable: ${gInrFmt(w.profit)} (${w.pct.toFixed(2)}%) on ${gInrFmt(w.inrIn)}</div>`;
    } else {
      liveUsed = [];  // explicitly NO marks — nothing profitable to take
      liveVerdict = `<div class="g-live-note dead">⚠ Arb gone at live prices — no profitable size on this book right now. The card above updates from the 24/7 engine (~15s behind).</div>`;
    }
  }
  // One aligned column per leg, in trade order; live depth preferred, engine
  // snapshot as the per-leg fallback (labelled so it's never mistaken for
  // live). Summary values come from the ENGINE walk (L.value) so the strip
  // always agrees with the card; the bars/avg-fill reflect the live re-walk.
  const meta = legs.map((L, j) => {
    const d = gDepth[L.market];
    if (d) {
      const u = (liveUsed && liveUsed[j]) || [];
      // Same rule as obCut(): 13 rows normally, stretched only as far as the
      // deepest level this walk actually takes, so a taken row can never fall
      // off the bottom of the table.
      let uLast = -1;
      for (let k = 0; k < u.length; k++) if (u[k] > 1e-9) uLast = k;
      const lv = gLv(L.side === 'buy' ? d.asks : d.bids)
        .slice(0, Math.min(OB_MAX_ROWS, Math.max(OB_MIN_ROWS, uLast + 1)));
      return { L, lv, used: u, live: true, title: gLegTitle(L), value: L.value != null ? L.value : null };
    }
    return { L, lv: (L.levels || []).map(x => ({ p: +x[0], q: +x[1] })), used: L.used || [],
             live: false, title: gLegTitle(L), value: L.value != null ? L.value : null };
  });
  return liveVerdict + gLegSummary(meta) + '<div class="g-books">' + meta.map(m => {
    const cls = m.L.side === 'buy' ? 'ask' : 'bid';
    const title = `${m.title} — ${m.L.side === 'buy' ? 'asks' : 'bids'}${m.live ? '' : ' · engine snapshot'}`;
    if (!m.lv.length) return `<div class="g-book"><div class="bt">${title}</div><table><tr><td class="h">no depth yet</td></tr></table></div>`;
    return `<div class="g-book"><div class="bt">${title}</div>
      <table><tr><td class="h">price</td><td class="h">qty</td><td class="h">you take</td></tr>${gBookRows(cls, m.lv, m.used)}</table></div>`;
  }).join('') + '</div>';
}

// ---- FULL-SCREEN BOOK OVERLAY (one book at a time) ----
// His ask: "open a over-top new page like live track page". Tapping ◉ Books
// slides a full-screen layer over the Giottus page with the route's books,
// refreshed every 3s with LIVE (uncached) Giottus depth. ONE book at a time —
// also his call — so the live-depth budget is never more than the ≤4 markets
// of the route actually being looked at.
function gOvEnsureDom() {
  if (document.getElementById('gOverlay')) return;
  const d = document.createElement('div');
  d.id = 'gOverlay'; d.className = 'g-overlay';
  d.innerHTML = `
    <div class="g-ov-head">
      <button class="g-ov-back" onclick="gCloseBooksOv()" aria-label="Close">←</button>
      <div class="g-ov-title" id="gOvTitle"></div>
      <div class="g-ov-age" id="gOvAge">—</div>
    </div>
    <div class="g-ov-body" id="gOvBooks"></div>`;
  document.body.appendChild(d);
}

function gOpenBooksOv(which, i) {
  const src = which === 'st' ? gSrvTradable : which === 'sw' ? gSrvWatch : which === 'c' ? gCandidates : gWatch;
  const o = src && src[i];
  if (!o) return;
  gOvKey = which + ':' + o.label;   // replaces any previously open book
  gBookSoftBackoffUntil = 0;
  gOvEnsureDom();
  document.getElementById('gOverlay').style.display = 'flex';
  document.body.style.overflow = 'hidden'; // page behind must not scroll
  gOvPaint(true);
  gSyncBookTimer();
  gRefreshOpenBooks(); // pull live depth immediately, don't wait for the first tick
}

function gCloseBooksOv() {
  gOvKey = null;
  const el = document.getElementById('gOverlay');
  if (el) el.style.display = 'none';
  document.body.style.overflow = '';
  gSyncBookTimer();
}

// Find the CURRENT object behind the open overlay in whichever list owns it —
// resolved fresh on every paint so a snapshot refresh can't strand the books
// on a stale object reference.
function gOvResolve() {
  if (!gOvKey) return null;
  const sep = gOvKey.indexOf(':');
  const which = gOvKey.slice(0, sep), label = gOvKey.slice(sep + 1);
  if (which === 'st' || which === 'sw') {
    const snap = gServerSnap;
    const t = snap && ((which === 'st' ? snap.tradable : snap.watch) || []).find(x => x.label === label);
    return t ? { which, label, t, src: 'srv' } : null;
  }
  const c = ((which === 'c' ? gCandidates : gWatch) || []).find(x => x.label === label);
  return c ? { which, label, c, src: 'local' } : null;
}

// Repaint the overlay. full=true also rebuilds the header. The books grid is
// replaced in ONE innerHTML write under a sticky header, so there is no
// flicker and no scroll jump.
function gOvPaint(full) {
  if (!gOvKey || !document.getElementById('gOverlay')) return;
  const r = gOvResolve();
  const booksEl = document.getElementById('gOvBooks');
  if (!r || !booksEl) { gOvPaintAge(null); return; } // route left the list — keep last books, age pill explains
  if (full) document.getElementById('gOvTitle').innerHTML = gRouteChips(r.label);
  booksEl.innerHTML = r.src === 'srv' ? gSrvBooksHtml(r.t) : gBooksHtml(r.c);
  gOvPaintAge(r);
}

// The honest freshness stamp: worst age across the route's LIVE books.
function gOvPaintAge(r) {
  const el = document.getElementById('gOvAge');
  if (!el) return;
  if (r === null) { el.textContent = 'route left the list — books frozen'; el.className = 'g-ov-age bad'; return; }
  if (!r) r = gOvResolve();
  if (!r) { el.textContent = '—'; return; }
  const legs = r.src === 'srv' ? (r.t.legs || []) : r.c.legsSpec;
  let oldest = null;
  for (const L of legs) {
    const d = gDepth[L.market];
    if (!d) { oldest = null; break; }
    const age = (Date.now() - d.ts) / 1000;
    oldest = oldest === null ? age : Math.max(oldest, age);
  }
  if (oldest === null) { el.textContent = 'engine book (warming live feed…)'; el.className = 'g-ov-age warn'; return; }
  const s = Math.round(oldest);
  const rl = Date.now() < gBookSoftBackoffUntil;
  el.textContent = rl ? `rate-limited · retrying · book ${s}s old` : `live · ${s}s old`;
  el.className = 'g-ov-age ' + (rl || s > 15 ? 'bad' : s > 6 ? 'warn' : 'ok');
}

// Fetch the engine snapshot WITHOUT re-rendering the whole page (the normal
// gFetchSnapshot repaints everything). Used by the book-only refresher.
async function gFetchSnapshotQuiet() {
  try {
    const res = await fetch(`${API_BASE}/api/giottus/snapshot`);
    if (!res.ok) return false;
    gServerSnap = await res.json();
    return true;
  } catch (e) { return false; }
}

// Once the book overlay is open, update ONLY it every 3s with LIVE depth:
// (a) refresh the engine snapshot quietly (structure + trade size), (b) pull
// ?live=1 depth for the route's markets ONE AT A TIME, ~250ms apart — never a
// parallel burst; bursts are what tripped Giottus's 429 and froze the books
// behind a 15s→4min backoff — then (c) repaint the overlay in one write.
// Rate limits stay respected: ≤4 markets per 3s tick, a 2s per-market dedupe,
// and the overlay's own gentle 5s backoff.
async function gRefreshOpenBooks() {
  if (!gOvKey) return;
  if (currentPage !== 'giottus') { gCloseBooksOv(); return; }
  if (gOvKey[0] === 's') await gFetchSnapshotQuiet(); // srv views: best-effort; keep last snapshot on failure
  const r = gOvResolve();
  if (!r) { gOvPaintAge(null); return; }
  const legs = r.src === 'srv' ? (r.t.legs || []) : r.c.legsSpec;
  if (Date.now() >= gBookSoftBackoffUntil) {
    for (const L of legs) {
      if (Date.now() < gBookSoftBackoffUntil) break; // a 429 mid-route: stop this tick
      if (Date.now() - (gBookLastFetch.get(L.market) || 0) < 2000) continue;
      await gFetchDepthLive(L.market);
      await new Promise(res => setTimeout(res, 250));
    }
  }
  if (!gOvKey || currentPage !== 'giottus') return;
  gOvPaint(false);
}

// ---- Signals (equity paper desk) ----
async function eqRefresh() {
  if (eqBusy) return;
  eqBusy = true;
  try {
    const j = async r => { if (!r.ok) throw new Error('API ' + r.status); return r.json(); };
    const [health, stats, signals, open, closed, settings, curve, mgrlog, radar] = await Promise.all([
      fetch(`${API_BASE}/api/eq/health`).then(j),
      fetch(`${API_BASE}/api/eq/stats`).then(j),
      fetch(`${API_BASE}/api/eq/signals?limit=30`).then(j),
      fetch(`${API_BASE}/api/eq/positions?status=OPEN`).then(j),
      fetch(`${API_BASE}/api/eq/positions?status=CLOSED`).then(j),
      fetch(`${API_BASE}/api/eq/settings`).then(j).catch(() => null),
      fetch(`${API_BASE}/api/eq/equity?limit=150`).then(j).catch(() => []),
      fetch(`${API_BASE}/api/eq/manager/log`).then(j).catch(() => []),
      fetch(`${API_BASE}/api/eq/scan-report`).then(j).catch(() => null),
    ]);
    eqData = { health, stats, signals, open, closed: closed.slice(0, 12), curve, mgrlog, radar };
    if (!eqSettingsOpen && settings) eqSettings = settings; // never clobber the form mid-edit
    eqErr = null;
  } catch (e) { eqErr = e.message; }
  finally { eqBusy = false; }
}

async function eqAction(path, confirmMsg) {
  if (eqActionBusy) return;
  if (confirmMsg && !confirm(confirmMsg)) return;
  eqActionBusy = true;
  try {
    const res = await fetch(`${API_BASE}${path}`, { method: 'POST' });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || j.ok === false) alert('Rejected: ' + (j.error || ('API ' + res.status)));
  } catch (e) { alert('Failed: ' + e.message); }
  finally {
    eqActionBusy = false;
    await eqRefresh();
    if (currentPage === 'others') renderOthersPage();
  }
}
function eqExecute(id, sym) { eqAction(`/api/eq/signals/${id}/execute`, `Execute ${sym} as a PAPER trade? (No real money — simulated fill.)`); }
function eqDismiss(id) { eqAction(`/api/eq/signals/${id}/dismiss`); }
function eqClose(id, sym) { eqAction(`/api/eq/positions/${id}/close`, `Close PAPER position ${sym} at market?`); }
async function eqScanNow() {

  await eqRefresh();
  if (currentPage === 'others') renderOthersPage();
}
function eqSetView(v) { eqView = v; renderOthersPage(); }
function eqToggleSettings() { eqSettingsOpen = !eqSettingsOpen; renderOthersPage(); }
async function eqSaveSettings() {
  const g = id => document.getElementById(id);
  const body = {
    risk_per_trade_pct: parseFloat(g('eqRisk') && g('eqRisk').value),
    min_rr: parseFloat(g('eqRR') && g('eqRR').value),
    max_open_positions: parseInt(g('eqMaxPos') && g('eqMaxPos').value, 10),
    max_heat_pct: parseFloat(g('eqHeat') && g('eqHeat').value),
    auto_execute: !!(g('eqAuto') && g('eqAuto').checked),
    watchlist: (g('eqWatch') && g('eqWatch').value) || '',
  };
  const at = new Date().toLocaleTimeString('en-US', { hour12: false });

  } catch (e) { eqSaveAck2 = { ok: false, at }; }
  renderOthersPage();
}

const othInr = n => (n === null || n === undefined || !isFinite(n)) ? '—' : '₹' + Math.round(n).toLocaleString('en-IN');
const othFmt = (n, d = 2) => (n === null || n === undefined || !isFinite(Number(n))) ? '—' : Number(n).toLocaleString('en-IN', { maximumFractionDigits: d });
const othSigned = (n, suffix = '') => n === null || n === undefined ? '—'

function eqSparkline(curve) {
  if (!curve || curve.length < 2) return '<div class="oth-sub">Equity curve appears after the first monitor snapshots.</div>';
  const w = 640, h = 130, vals = curve.map(p => Number(p.equity));
  const mn = Math.min(...vals), mx = Math.max(...vals), rng = (mx - mn) || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - 10 - (v - mn) / rng * (h - 20)).toFixed(1)}`).join(' ');
  const up = vals[vals.length - 1] >= vals[0];
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block; background:var(--ocard); border:1px solid var(--oline); border-radius:14px;" role="img" aria-label="Equity curve">
    <polyline fill="none" stroke="${up ? '#34d399' : '#f87171'}" stroke-width="2" points="${pts}"/></svg>`;
}

function eqGate(label, val, target, pass, text) {
  const pct = Math.max(0, Math.min(100, val / target * 100));
  return `<div class="oth-gate"><div class="lbl">${label}</div>
    <div class="bar"><i style="width:${pct.toFixed(0)}%; background:${pass ? 'var(--ogreen)' : 'var(--oamber)'};"></i></div>
    <div class="val ${pass ? 'oth-pos' : ''}" style="${pass ? '' : 'color:var(--oamber);'}">${text}</div></div>`;
}

function eqViewAnalysis() {

      ${eqGate('Profit factor ≥ 1.5', pf || 0, 1.5, (pf || 0) >= 1.5, pf == null ? 'pending' : String(pf))}
      ${eqGate('Max drawdown < 10%', Math.max(0, 10 - dd), 10, dd < 10 && trades > 0, `${othFmt(dd, 1)}%`)}

// Radar (8 Aug) — the "why is it quiet" answer, live on the page. Every
// watchlist symbol, its distance from a signal, and the exact checks that
// failed. NEAR MISS = one condition away (or fired but under his min R:R).
function eqBar(pct) {
  const col = pct >= 99 ? 'var(--ogreen)' : pct >= 66 ? 'var(--oamber)' : 'var(--oline)';
  return `<span style="display:inline-flex; align-items:center; gap:6px;"><span style="display:inline-block; width:64px; height:6px; background:rgba(255,255,255,.06); border-radius:3px; overflow:hidden;"><i style="display:block; height:100%; width:${pct}%; background:${col};"></i></span><span class="oth-name">${pct}%</span></span>`;
}
function eqViewRadar() {
  const r = eqData.radar;
  const head = `${eqTiles()}<div class="oth-sec">Watchlist radar — distance to a signal</div>`;
  if (!r || !r.at) return `${head}
    <div class="oth-sub">${r && r.note ? r.note : 'Radar endpoint not answering — redeploy the scanner backend with the radar pack, then hit ⟳ Scan now.'} Every scan (5-min auto during market hours, or Scan now) rebuilds this table: each symbol, how many setup checks it passes, and exactly which check is blocking it.</div>`;
  const rows = (r.results || []).map(s => {
    const cls = s.status === 'SIGNAL' ? 'ok' : s.status === 'NEAR_MISS' ? 'warn' : s.status === 'NO_DATA' ? 'stop' : 'med';
    const near = (s.detectors || []).filter(d => d.nearMiss && d.gate).map(d => `${d.setup}: ${d.gate}`);
    const best = (s.detectors || []).slice().sort((a, b) => (b.passed / (b.total || 1)) - (a.passed / (a.total || 1)))[0];
    const why = s.status === 'SIGNAL' ? 'setup live — Signals tab has the card'
      : s.status === 'NO_DATA' ? 'no OHLCV from Yahoo this pass'
      : near.length ? near.join(' · ')
      : best ? `${best.setup} closest — blocking: ` + (best.checks || []).filter(c => !c.pass).map(c => `${c.name} (${c.detail})`).join('; ')
      : '—';
    return `<tr><td>${s.symbol}</td><td>${othFmt(s.ltp)}</td>
      <td><span class="oth-pill ${cls}">${String(s.status).replace('_', ' ')}</span></td>
      <td>${eqBar(Math.round((s.score || 0) * 100))}</td>
      <td class="oth-name" style="white-space:normal; min-width:230px;">${why}</td></tr>`;
  }).join('');
  return `${head}
    <div class="oth-sub">as of ${new Date(r.at).toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata' })} IST · ${r.marketOpen ? 'market open' : 'market closed — frozen at last scan'} · min R:R ${r.minRR}</div>
    <div class="oth-scroll"><table><tr><th>Symbol</th><th>Close</th><th>Status</th><th>Checks passed</th><th>What's blocking it</th></tr>${rows}</table></div>
    <div class="oth-note">A quiet Signals tab plus a full radar is the system saying "nothing worth your risk today" — with receipts. NEAR MISS names the one failing condition; it resolves or it doesn't, no signal is forced.</div>`;
}

// ---- Metal Arb (same-origin Vercel function) ----
async function metalRefresh(force) {
  if (metalBusy) return;
  if (!force && metalData && Date.now() - metalLastTs < 5 * 60 * 1000) return; // 5-min cadence
  metalBusy = true;
  try {
    const r = await fetch('/api/metal/check');
    if (!r.ok) throw new Error('API ' + r.status);
    metalData = await r.json(); metalErr = null; metalLastTs = Date.now();
    metalPushHistory(); // fire-and-forget — sparklines land on the repaint
  } catch (e) { metalErr = e.message; }
  finally { metalBusy = false; }
}

// History courier: after each check, POST the picker's live-iNAV rows to the
// scanner's 2-day store and pull the series back for sparklines. The scanner
// dedupes 2-min repeats, so two open devices can't double-write. 404 =
// scanner not redeployed with the metal-history pack yet — degrade to no
// sparklines, never to an error banner.
async function metalPushHistory() {
  try {
    const rows = Object.values((metalData && metalData.picker) || {}).flatMap(p => p.rows || []);
    if (rows.length) {
      await fetch(`${API_BASE}/api/metal/snapshot`, { method: 'POST',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rows }) }).catch(() => {});
    }
    const h = await fetch(`${API_BASE}/api/metal/history`);
    metalHist = h.ok ? await h.json() : null;
    metalHistErr = h.ok ? null : (h.status === 404 ? 'scanner deploy pending' : 'API ' + h.status);
  } catch (e) { metalHist = null; metalHistErr = e.message; }
  if (currentPage === 'others' && othTab === 'metal') renderOthersPage();
}

// Tiny premium sparkline. GREEN when the premium is FALLING — for a buyer,
// a cheapening premium is the good direction; red means it's running away.
function metalSpark(sym) {
  const s = metalHist && metalHist.series && metalHist.series[sym];
  if (!s || s.length < 2) return '<span class="oth-name">—</span>';
  const w = 120, h = 30;
  const t0 = s[0][0], tr = (s[s.length - 1][0] - t0) || 1;
  const vals = s.map(p => p[1]);
  const mn = Math.min(...vals), mx = Math.max(...vals), rng = (mx - mn) || 1;
  const pts = s.map(p => `${(((p[0] - t0) / tr) * w).toFixed(1)},${(h - 4 - ((p[1] - mn) / rng) * (h - 8)).toFixed(1)}`).join(' ');
  const falling = vals[vals.length - 1] <= vals[0];
  return `<svg viewBox="0 0 ${w} ${h}" style="width:${w}px; height:${h}px; display:block;" role="img" aria-label="${sym} premium trend">
    <polyline fill="none" stroke="${falling ? '#34d399' : '#f87171'}" stroke-width="1.5" points="${pts}"/></svg>`;
}

function othPremCell(p, thr) {
  if (p === null || p === undefined) return '<td>—</td>';
  const c = Math.abs(p) >= (thr ?? 2) ? 'oth-breach' : p > 0 ? 'oth-pos' : 'oth-neg';
  return `<td class="${c}">${(p > 0 ? '+' : '') + p}%</td>`;
}

// 29 Jul, his call: "increase the time to 4 or 5 seconds instead of 2
// seconds". The server recomputes every 3s, so a 2s poll was also asking
// more often than there could ever be an answer. 4s halves the request rate
// per open tab and still catches every server tick within one poll.
const REFRESH_MS = 4000;

// ---- Split-screen / foldable touch-offset fix ----
// Some Android browsers (notably foldables in multi-window / split-screen) don't
// refresh their touch hit-test map after the window is resized, so taps land
// offset from what's drawn — e.g. aiming at a button and hitting the Sort
// dropdown higher up. The offset PERSISTS the whole time you're split-screened,
// not just right after the resize, and plain scrolling fires no resize event to
// re-trigger a one-shot fix. So we re-seat the map two ways:
//   1) after every viewport change, several times, to catch the layout once the
//      OS finishes the split-screen animation;
//   2) throttled, at the start of every touch, so the map is guaranteed fresh
//      the instant before a tap resolves — this is what kills the persistent
//      offset while scrolling and tapping inside split-screen.
// The re-seat forces a synchronous layout and nudges scroll by 1px and back
// (temporarily adding scroll room so the nudge takes effect even when the page
// fits), which invalidates the stale hit regions with no visible movement.
let __lastReseat = 0;
function reseatHitMap(force) {
  const now = Date.now();
  if (!force && now - __lastReseat < 250) return;   // throttle: at most ~4×/s
  __lastReseat = now;
  const se = document.scrollingElement || document.documentElement;
  const y = se.scrollTop || 0;
  const body = document.body;
  const prevMin = body.style.minHeight;
  body.style.minHeight = (se.scrollHeight + 4) + 'px'; // guarantee 1px of scroll room
  se.scrollTop = y + 1;
  void body.offsetHeight;                              // commit the intermediate scroll
  se.scrollTop = y;
  body.style.minHeight = prevMin;
}
function kickTouchReflow() {
  // Fire now and again as the OS settles the new window size (animations).
  [0, 180, 400, 700].forEach(d => setTimeout(() => reseatHitMap(true), d));
}
window.addEventListener('resize', kickTouchReflow);
window.addEventListener('orientationchange', () => setTimeout(kickTouchReflow, 120));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', kickTouchReflow);
  window.visualViewport.addEventListener('scroll', () => reseatHitMap());
}

// Mobile browsers throttle/suspend timers in background tabs, so coming back to
// the app could mean staring at data from whenever the phone was locked until
// the next (throttled) tick got around to firing. Refresh the moment the page
// becomes visible again so what you see is never older than the screen-on time.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { fullRefresh(); kickTouchReflow(); }
});
// Just-in-time: re-seat right as the finger lands (throttled) so the ensuing
// click always resolves against a fresh hit map — passive, so it never blocks
// scrolling, and the scroll nudge reverts within the same frame (no jitter).
document.addEventListener('touchstart', () => reseatHitMap(), { capture: true, passive: true });
</script>

<!-- ==== EXECUTE PATCH (everything above is the scanner, unmodified) ==== -->
<script>
// ============================================================
// TRACK-LIVE CLONE PATCH — appended to the cloned scanner page
// (track.html). The scanner itself (index.html) is NEVER touched.
//
// The clone stays the COMPLETE page — every tab, filter and detail.
// This patch only ADDS the execute capability Nikhil asked for:
//   • an EXECUTE panel inside the Direct / Loop / Intra Loop
//     "Track Live" popups, wired to the Fast Trader backend —
//     it places real WazirX orders (paper or LIVE):
//       - direct    → fires the WazirX leg only (buy or sell)
//       - intraloop → path A or B, 3 WazirX orders
//       - loop      → 4 WazirX orders (only when both hops are WazirX)
//     Sizing: % of walkable depth, or a tap on the trader's own
//     depth ladder ("till book level k → this %").
//   • opening a popup pins that coin on the trader
//     (/api/trader/watch) so its 100ms books are hot by the time
//     Execute is tapped.
// Popups for non-WazirX venues get no buttons — the WazirX key
// cannot fire there, and the panel says so.
// ============================================================
(function () {
  'use strict';

  // ---------- trader API glue ----------
  // Same resolution order as trade.html: explicit URL saved on this device →
  // the Vercel /trader-api proxy → the known DigitalOcean app URL.
  var FT_FALLBACK = 'https://walrus-app-b5qke.ondigitalocean.app';
  var ftBase = null;
  function ftCandidates() {
    var c = [];
    try { var u = localStorage.getItem('swenik_trader_url'); if (u) c.push(u.replace(/\/$/, '')); } catch (e) {}
    c.push(''); // '' → same-origin /trader-api proxy
    c.push(FT_FALLBACK);
    return c;
  }
  async function traderApi(path, opts) {
    var cands = ftBase !== null ? [ftBase] : ftCandidates();
    var lastErr = null;
    for (var i = 0; i < cands.length; i++) {
      var url = cands[i] === '' ? path.replace(/^\/api\//, '/trader-api/') : cands[i] + path;
      try {
        var r = await fetch(url, opts);
        var j = await r.json().catch(function () { return {}; });
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        ftBase = cands[i]; // remember the base that answered
        return j;
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('trader unreachable');
  }
  var ftPost = function (path, body) {
    return traderApi(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  };

  // ---------- state ----------
  // mode is ALWAYS live — Nikhil: "keep it live, no need of paper trade
  // option". The one guard left is the per-tap confirm dialog.
  // ready: the trader has live books for the open coin. Pinning a coin makes
  // the trader open its 100ms streams, which takes a few seconds — tapping
  // Execute inside that gap used to fail with "no live WazirX ask book".
  // sel: which LEG of the arb is selected in the leg toggle.
  var ft = { pct: 25, lvl: null, mode: 'live', sel: 0, plan: null, timer: null, watched: {}, ready: false, retries: 0, fills: {} };
  // WazirX BUY fills, remembered per coin — THE hedge size. The arb card can
  // vanish right after execution (he just ate it); the fill must not.
  try {
    var savedFills = JSON.parse(localStorage.getItem('swenik_ft_fills') || '{}');
    var cutoff = Date.now() - 2 * 3600 * 1000;
    Object.keys(savedFills).forEach(function (k) { if (savedFills[k] && savedFills[k].at > cutoff) ft.fills[k] = savedFills[k]; });
  } catch (e) {}
  function saveFills() { try { localStorage.setItem('swenik_ft_fills', JSON.stringify(ft.fills)); } catch (e) {} }
  // WHICH WAY THE HEDGE POINTS.
  //   WazirX BUY  → he now HOLDS the coin → SHORT the perp (price falls, the
  //                 short pays for it).
  //   WazirX SELL → he just emptied that holding and will buy it back → LONG
  //                 the perp, which locks the price he buys back at.
  // Saved fills from before this existed have no dir and were always buys, so
  // an absent dir means short.
  function fillDir(f) { return f && f.dir === 'long' ? 'long' : 'short'; }
  function hedgeLabel(coin, dir) { return 'HEDGE ' + String(coin).toUpperCase() + ' @Binance Futures (' + dir + ')'; }
  // exchange identity chip (uses the scanner's own icon when available)
  function exChip(ex) {
    var icon = '';
    try { if (typeof exIcon === 'function') icon = exIcon(ex) || ''; } catch (e) {}
    return icon + '<span style="font-weight:800;">' + (ex === 'binance' ? 'Binance' : 'WazirX') + '</span>';
  }

  function ftWatch(coin) {
    // pin the coin on the trader so its 100ms books + ladder warm up
    if (!coin) return;
    var t = Date.now();
    if (ft.watched[coin] && t - ft.watched[coin] < 60000) return;
    ft.watched[coin] = t;
    ftPost('/api/trader/watch', { coin: coin }).catch(function () {});
  }

  // ---------- render ----------
  function pill(txt, on, js) {
    return '<button onclick="' + js + '" style="font:inherit;font-size:12px;font-weight:800;padding:7px 0;border-radius:8px;cursor:pointer;' +
      'border:1px solid ' + (on ? '#1c8a5c;background:#e7f6ee;color:#177a4c' : 'var(--border);background:#fff;color:var(--gray-700)') + ';">' + txt + '</button>';
  }
  var fmtQ = function (n) { return n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : n >= 1 ? (+n.toFixed(3)).toString() : (+n.toPrecision(3)).toString(); };

  // ---------- SIZE PREVIEW ----------
  // Nikhil: "it's showing 25% 50% etc but when we selected it should show the
  // 25% values of currently and equivalent inr value as well." A bare "25%"
  // says nothing about what he is about to spend, so every size now prints as
  // BOTH the coin quantity AND the money — on the chips' tally line, on the
  // Execute button, and in the confirm dialog. Direct, loop and intra loop.
  var fmtMoney = function (amt, ccy) {
    if (amt == null || !isFinite(amt)) return null;
    if (ccy === 'USDT') return (amt >= 1000 ? Math.round(amt).toLocaleString('en-US') : (+amt.toFixed(2)).toString()) + ' USDT';
    return '₹' + (amt >= 100 ? Math.round(amt).toLocaleString('en-IN') : (+amt.toFixed(2)).toLocaleString('en-IN'));
  };
  // A USDT leg is still money he can feel in rupees. Take the rate the page
  // itself is already using — the loop's own usdtInrUsed, else the live
  // USDT/INR book behind the intra-loop triangle. No rate → no ₹ line, never
  // an invented one. (USDT/INR stays a REFERENCE rate, not a traded leg.)
  function usdtInrRate() {
    var v = function (x) { return x && typeof x === 'object' ? x.rate : x; };
    try {
      var e = (typeof loopLiveEntry !== 'undefined' && loopLiveEntry) || null;
      var u = (e && e.usdtInrUsed) || {};
      var r = Number(v(u.entry)) || Number(v(u.exit)) || 0;
      if (r > 0) return r;
    } catch (x) {}
    try {
      var ie = (typeof intraLoopLiveEntry !== 'undefined' && intraLoopLiveEntry) || null;
      var lgs = (ie && ie.liveBooks && ie.liveBooks.legs) || [];
      for (var i = 0; i < lgs.length; i++) {
        if (String(lgs[i].market || '').toLowerCase() !== 'usdtinr') continue;
        var b = (lgs[i].bids || [])[0] || (lgs[i].asks || [])[0];
        if (b && Number(b.price) > 0) return Number(b.price);
      }
    } catch (x) {}
    return null;
  }
  // What a slice of a leg actually costs: walk the consumed rows in order,
  // cheapest first — the same rows the red/green bars are drawn on, so the
  // money quoted here is the money the order will move.
  function sliceValue(v, qty) {
    if (!v || !(qty > 0)) return null;
    if (Array.isArray(v.rows) && v.rows.length) {
      var left = qty, val = 0;
      for (var i = 0; i < v.rows.length && left > 1e-12; i++) {
        var take = Math.min(left, v.rows[i].qty);
        val += take * v.rows[i].price;
        left -= take;
      }
      if (left > 1e-9) val += left * v.rows[v.rows.length - 1].price;  // past the walk — hold the last price
      return val;
    }
    // No per-level record (older payloads, or the intra-loop's top-of-book
    // legs) — scale the leg's own total. Inside one level that is exact.
    if (v.amount != null && v.qty > 0) return v.amount * qty / v.qty;
    return null;
  }
  // { q: '0.0522 ETH', m: '₹10,341' } for the chosen %. Either half may be
  // missing; the callers just drop what isn't there.
  function sizeParts(v, pct) {
    if (!v) return {};
    var qty = Number(v.qty) > 0 ? v.qty * pct / 100 : null;
    var out = {};
    if (qty) out.q = fmtQ(qty) + ' ' + String(v.unit || '').toUpperCase();
    var val = sliceValue(v, qty);
    var m = fmtMoney(val, v.ccy);
    if (m) {
      if (v.ccy === 'USDT') { var r = usdtInrRate(); if (r) m += ' (≈ ' + fmtMoney(val * r, 'INR') + ')'; }
      out.m = m;
    }
    return out;
  }
  // The one line under the % chips. A single leg reads "25% of this leg =
  // 0.0522 ETH ≈ ₹10,341"; a whole rotation reads as the money going IN and
  // the coin the first leg buys with it.
  function sizeLine(act, pct) {
    var s = sizeParts(act && act.view, pct);
    if (!s.q && !s.m) return pct + '% of the walkable depth';
    if (act.view && act.view.chain) {
      return pct + '% of this rotation = ' + (s.m ? '<b>' + s.m + '</b> in' : '')
        + (s.q ? (s.m ? ' → ' : '') + '<b>' + s.q + '</b> on leg 1' : '');
    }
    return pct + '% of this leg = ' + [s.q, s.m].filter(Boolean).map(function (t) { return '<b>' + t + '</b>'; }).join(' ≈ ');
  }
  // The same numbers, unbolded, for the Execute button and the confirm dialog.
  function sizeShort(act, pct) {
    var s = sizeParts(act && act.view, pct);
    var bits = [s.q, s.m].filter(Boolean);
    return bits.length ? bits.join(' · ') : null;
  }

  function ftPanelHtml() {
    var p = ft.plan;
    if (!p) return '';
    var head = '<div style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;">⚡ EXECUTE — Fast Trader' +
      '<span style="margin-left:auto;font-size:11px;font-weight:800;padding:5px 11px;border-radius:999px;background:#d33131;color:#fff;">LIVE — real money</span></div>';
    var note = '<div style="font-size:11px;font-weight:600;color:var(--gray-600);margin:6px 0 8px;line-height:1.45;">' + p.note + '</div>';
    if (!p.acts.length) return head + note;

    var sel = p.acts[ft.sel];

    // BUY legs green, SELL legs red, exchange named on each — the legs mirror
    // the green/red consumption bars in the book above.
    var legs = '<div style="display:grid;grid-template-columns:repeat(' + Math.min(p.acts.length, 2) + ',1fr);gap:6px;margin-bottom:8px;">' +
      p.acts.map(function (a, i) {
        var on = i === ft.sel;
        var col = a.side === 'buy' ? '#177a4c' : a.side === 'sell' ? '#d33131' : a.side === 'hedge' ? '#4653d0' : '#2b6ea3';
        var bg = a.side === 'buy' ? '#e7f6ee' : a.side === 'sell' ? '#fdecec' : a.side === 'hedge' ? '#eef1ff' : '#e8f0fe';
        return '<button onclick="__ftLeg(' + i + ')" style="font:inherit;font-size:11.5px;font-weight:800;padding:9px 6px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;' +
          'border:2px solid ' + (on ? col : 'var(--border)') + ';background:' + (on ? bg : '#fff') + ';color:' + (on ? col : 'var(--gray-700)') + ';">' +
          a.legLabel + '</button>';
      }).join('') + '</div>';

    // ---- % chips tally against the SELECTED leg's own walked volume.
    // NOT for the hedge: the hedge has exactly ONE valid size — the WazirX
    // fill — so the chips disappear when the hedge leg is selected.
    var selFill = ft.fills[sel.coin || p.coin] || null;
    var selDir = fillDir(selFill);
    // The hedge leg's label follows the fill it is hedging, so the button never
    // says "short" when the trade that just happened needs a long.
    var selLabel = sel.side === 'hedge' ? hedgeLabel(sel.coin || p.coin, selDir) : sel.label;
    var pcts = '', tally = '';
    if (sel.side === 'hedge') {
      tally = selFill
        ? '<div style="font-size:11px;font-weight:800;color:#4653d0;margin-bottom:8px;">Hedge size = your WazirX fill: <b>' + fmtQ(selFill.qty) + ' ' + String(sel.coin || p.coin).toUpperCase() + '</b> (order #' + selFill.orderId + ') — fixed, no %. You ' + (selDir === 'long' ? 'SOLD, so this opens a LONG' : 'BOUGHT, so this opens a SHORT') + '.</div>'

          return pill(x + '%', ft.lvl == null && ft.pct === x, '__ftPct(' + x + ')');
        }).join('') + '</div>';
      // A tapped ladder level carries its own quantity and cost — print those
      // too, so "till level 2" is never just a number either.
      var lvlRow = ft.lvl != null ? (p.ladder || []).filter(function (r) { return r.lvl === ft.lvl; })[0] : null;
      tally = '<div style="font-size:11px;font-weight:700;color:var(--gray-600);margin-bottom:8px;">' +
        (ft.lvl != null
          ? 'till book level ' + ft.lvl + (lvlRow
              ? ' = <b>' + fmtQ(lvlRow.qty) + ' ' + String(sel.coin || p.coin).toUpperCase() + '</b> ≈ <b>' + fmtMoney(lvlRow.costInr, 'INR') + '</b>'
              : ' selected')
          : sizeLine(sel, ft.pct)) + '</div>';
    }

    var lad = '';
    // Only the PROFITABLE levels — "show till the positive levels".
    // (No ladder on the hedge leg — its size is the fill, full stop.)
    var posRows = sel.side === 'hedge' ? [] : (p.ladder || []).filter(function (r) { return r.netPct > 0; });
    if (posRows.length) {
      lad = '<div style="font-size:10px;font-weight:800;color:var(--gray-500);text-transform:uppercase;letter-spacing:.04em;margin:2px 0 4px;">Depth analysis — profitable levels only (live from the trader)</div>' +
        '<table style="width:100%;border-collapse:collapse;font-size:11px;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:8px;"><tbody>' +
        posRows.map(function (r) {
          var on = ft.lvl === r.lvl;
          return '<tr onclick="__ftLvl(' + r.lvl + ')" style="cursor:pointer;' + (on ? 'background:#e7f6ee;' : '') + '">' +
            '<td style="padding:5px 8px;font-weight:800;color:var(--gray-500);">' + (on ? '▶ ' : '') + 'Lv ' + r.lvl + '</td>' +
            '<td style="padding:5px 8px;text-align:right;font-weight:800;color:var(--success);">+' + r.netPct.toFixed(2) + '%</td>' +

    } else if (p.wantLadder) {

        : '<div style="font-size:10.5px;color:var(--gray-500);font-weight:600;margin-bottom:8px;">warming the trader’s live books for the depth ladder…</div>';
    }

    // ---- HEDGE pre-flight box: verification + full costs BEFORE the order.
    var hedgeBox = '';
    var hedgeBlocked = false;
    if (sel.side === 'hedge') {
      var hi = (p.hedgeInfo || {})[sel.coin || p.coin];
      var selQty = selFill ? selFill.qty : null;
      if (!selFill) {
        // Locked, but never opaque. He can still open the numbers — futures
