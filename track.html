// ================================================================
// GENERIC VENUE PAGE (Zebpay first) — Direct / Loop / Intra sub-tabs, reusing
// the same card renderers, sort, and wallet filter as the WazirX pages.
// ================================================================
let vTimer = null;
let vTab = 'direct'; // sub-tab within a venue page: direct | loop | intraloop
// Venue Apply-Filter state, per sub-tab (mirrors the WazirX pages' pageFilters):
//   direct    — buyExchanges multi-select (venue / binance) + coin
//   loop      — buy coin (leg 1) + sell coin (leg 2)
//   intraloop — coin
let venueFilter = { direct: { coin: '', buyExchanges: [] }, loop: { buyCoin: '', sellCoin: '' }, intraloop: { coin: '' } };
const venueState = {}; // id -> { opps, ts, tracked, err }

function venueCfg() { return (PAGES[currentPage] && PAGES[currentPage].venue) || null; }
// The INR-side exchange name for cards being rendered on the CURRENT page
// (venue tab -> that venue's label; classic pages -> WazirX).
function pageVenueName() { const v = venueCfg(); return v ? v.label : 'Wazirx'; }
// Same, but for the OPEN MODAL — derived from the card that opened it, so a
// Zebpay modal stays labeled Zebpay even if the page changes underneath.
function cardVenueName() {
  if (openCard && openCard.venueId && PAGES[openCard.venueId] && PAGES[openCard.venueId].venue) {
    return PAGES[openCard.venueId].venue.label;
  }
  return 'WazirX';
}
// liveCache keys MUST be venue-scoped: a WazirX HOT→GALA loop and a Zebpay
// HOT→GALA loop would otherwise share a key, and one venue's cached books
// would flash inside the other venue's modal.
function cachePfx() { return (openCard && openCard.venueId) ? openCard.venueId + ':' : ''; }
// One place applies EVERY venue filter (wallet toggle, USDT toggle, coin
// search, the ₹100 intra noise floor) so the card list and the sub-tab
// counts can never disagree — toggling a filter visibly changes both.
// Memoized per (opps, filter-state). The tab COUNT (updateVenueTabCounts) and
// the card RENDER (renderVenuePage) each call this once per tick, and
// minProfitGate's hysteresis MUTATES a shared set — so two independent passes
// could disagree, e.g. "Intra Loop (1)" over an empty list, or a stale tab. One
// computation per state makes the count and the list read the exact same object.
let _vfMemo = { opps: null, sig: null, val: null };
function _vfSig() {
  try { return [showDisabledWallets, showUsdtPairs, withVolume, JSON.stringify(venueFilter)].join('|'); }
  catch (e) { return 'x' + Math.random(); }
}
function vFiltered(opps) {
  const sig = _vfSig();
  if (_vfMemo.opps === opps && _vfMemo.sig === sig && _vfMemo.val) return _vfMemo.val;
  const f = { direct: [], loop: [], intraloop: [] };
  const vf = venueFilter;
  for (const o of opps || []) {
    if (f[o.type] === undefined) continue;
    if (o.type === 'direct') {
      // Disabled Wallets: OFF = transferable only, ON = wallet-blocked ONLY.
      if (showDisabledWallets ? o.walletEnabled !== false : o.walletEnabled === false) continue;
      // Volume ON shows only walkable, non-negative trades; Volume OFF (₹1L fixed) shows all.
      if (withVolume && (!o.walked || o.walked.profitPct < 0)) continue;
      if (!showUsdtPairs && (o.quote || 'INR') === 'USDT') continue;
      if (vf.direct.coin && !o.coin.includes(vf.direct.coin)) continue;
      if (vf.direct.buyExchanges.length && !vf.direct.buyExchanges.includes(o.buyExchange)) continue;
    } else if (o.type === 'loop') {
      // Loop is ALWAYS transferable-only and ALWAYS depth-walked (volume locked
      // ON), positive, and ≥ ₹100 — no disabled-wallet toggle for loops.
      if (o.walletEnabled === false) continue;
      if (!o.walked || o.walked.profitPct < 0 || !minProfitGate(o)) continue;
      if (vf.loop.buyCoin && !o.coin1.includes(vf.loop.buyCoin)) continue;
      if (vf.loop.sellCoin && !o.coin2.includes(vf.loop.sellCoin)) continue;
    } else if (o.type === 'intraloop') {
      if (o.walked && !minProfitGate(o)) continue; // noise floor, with hysteresis
      if (vf.intraloop.coin && !o.coin.includes(vf.intraloop.coin)) continue;
    }
    f[o.type].push(o);
  }
  _vfMemo = { opps: opps, sig: sig, val: f };
  return f;
}
function vSetTab(t) {
  const forcedVol = (t === 'loop' && withVolume !== true);
  vTab = t;
  if (t === 'loop') withVolume = true; // loop is always depth-walked
  saveUiState();
  renderToolbar();
  // ALWAYS repaint the list for the tab we are on NOW, before any fetch.
  // 29 Jul: "while navigating direct and loop it reflects direct data in loop
  // page". The forced-volume branch used to skip this repaint when there was
  // no cached volume-ON snapshot, so the OLD tab's cards stayed painted under
  // the NEW tab's highlight — and because a 204 "unchanged" poll deliberately
  // repaints nothing, they could sit there for good. Painting synchronously
  // from the data we already hold (corrected a moment later by the fetch)
  // means the page can never show one tab's cards under another tab's name.
  renderVenuePage();
  if (forcedVol) {
    // Volume just flipped ON for the loop tab — load the volume-ON data.
    const v = venueCfg();
    if (v && !v.native) vRefresh(); else applyVolumeInstant();
  }
}

// Active-filter chips for the current venue sub-tab (with × to clear each).
function venueFilterChips() {
  const chips = [];
  const push = (label, onclick) => chips.push(`<span class="active-filter-chip">${label} <button onclick="${onclick}">×</button></span>`);
  if (vTab === 'direct') {
    if (venueFilter.direct.buyExchanges.length) push(`Buy on: ${venueFilter.direct.buyExchanges.map(exLabel).join(', ')}`, `clearVenueFilter('direct','buyExchanges')`);
    if (venueFilter.direct.coin) push(`Coin: ${venueFilter.direct.coin.toUpperCase()}`, `clearVenueFilter('direct','coin')`);
  } else if (vTab === 'loop') {
    if (venueFilter.loop.buyCoin) push(`Buy coin: ${venueFilter.loop.buyCoin.toUpperCase()}`, `clearVenueFilter('loop','buyCoin')`);
    if (venueFilter.loop.sellCoin) push(`Sell coin: ${venueFilter.loop.sellCoin.toUpperCase()}`, `clearVenueFilter('loop','sellCoin')`);
  } else if (vTab === 'intraloop') {
    if (venueFilter.intraloop.coin) push(`Coin: ${venueFilter.intraloop.coin.toUpperCase()}`, `clearVenueFilter('intraloop','coin')`);
  }
  return chips.join('');
}
function clearVenueFilter(tab, field) {
  venueFilter[tab][field] = (field === 'buyExchanges') ? [] : '';
  saveUiState(); renderToolbar(); renderVenuePage();
}

// Start/stop the venue's 10s poll based on its paused flag. A paused venue must
// NOT poll — that's the whole point of Pause (no capture, no bandwidth). Called
// after we learn the state (initial load, a tick, or a Play/Pause tap).
function vSyncTimer() {
  const v = venueCfg();
  const running = !!(v && !v.native && !((venueState[v.id] || {}).paused));
  if (running) { if (!vTimer) vTimer = setInterval(vRefresh, 10000); }
  else if (vTimer) { clearInterval(vTimer); vTimer = null; }
}

// Flip a venue engine on/off. POSTs the new paused state to the server (the flag
// is global + persisted, default OFF), then re-syncs polling and repaints. This
// is the only venue write and it never touches orders/execution — pause only
// controls whether the engine captures & computes.
async function vTogglePause() {
  const v = venueCfg(); if (!v || v.native) return;
  const st = venueState[v.id] || (venueState[v.id] = { opps: [], ts: 0, tracked: 0, err: null });
  const wantPaused = !st.paused;          // flip the current state
  st.pausing = true; renderToolbar();     // disable the button while the call is in flight
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 11000);
  try {
    const res = await fetch(`${API_BASE}/api/venue/${v.id}/pause`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paused: wantPaused }), signal: ctrl.signal
    });
    if (!res.ok) throw new Error(`API returned ${res.status}`);
    const data = await res.json();
    st.paused = data.paused === true; st.err = null;
    if (!st.paused) { st.ts = 0; st.opps = []; } // resuming: drop stale, fetch fresh below
  } catch (e) {
    st.err = (e && e.name === 'AbortError') ? 'pause request timed out' : e.message;
  } finally { clearTimeout(to); }
  st.pausing = false;
  if (venueCfg() === v) {
    vSyncTimer();                    // arm polling if now running, kill it if paused
    renderToolbar(); renderVenuePage();
    if (st.paused === false && !st.err) vRefresh(); // resuming: pull live data now
  }
}

async function vRefresh() {
  const v = venueCfg(); if (!v) return;
  const st = venueState[v.id] || (venueState[v.id] = { opps: [], ts: 0, tracked: 0, err: null });
  const wasPaused = st.paused === true;
  try {
    const res = await fetchWithTimeout(`${API_BASE}${v.api}/opportunities?volume=${withVolume}&wallets=all&profit=all`);
    if (!res.ok) throw new Error(`API returned ${res.status}`);
    const data = await res.json();
    st.opps = data.opportunities || []; st.ts = data.ts; st.tracked = data.trackedPairs || 0; st.err = null;
    st.paused = data.paused === true;
  } catch (e) { st.err = e.message; }
  // Same rule as the native venue: data ticks update toolbar text in place,
  // they never rebuild the toolbar (which would swallow an in-flight tap).
  // EXCEPTION: a paused-state flip is a discrete event (not a per-tick change),
  // so rebuild the toolbar then to swap the Play/Pause button + status.
  if (venueCfg() === v) {
    vSyncTimer();
    if ((st.paused === true) !== wasPaused) renderToolbar();
    else updateVenueTabCounts();
    renderVenuePage();
  }
}

function renderVenuePage() {
  const v = venueCfg(); if (!v) return;
  __lastPaintSig = viewSig(); // this paint is for the CURRENT page/tab/volume
  const el = document.getElementById('cardList');
  let opps;
  if (v.native) {
    // WazirX: the main scanner feeds this tab.
    if (!hasLoadedOnce) { el.innerHTML = `<div class="empty-state"><span class="emoji">⏳</span>Loading opportunities…</div>`; return; }
    opps = allOpportunities;
  } else {
    const st = venueState[v.id];
    if (st && st.paused) {
      el.innerHTML = `<div class="empty-state"><span class="emoji">⏸️</span><div style="font-weight:700;font-size:15px;margin-bottom:6px;">${v.label} is paused</div><div style="font-size:12.5px;color:var(--gray-500,#6b7280);max-width:340px;margin:0 auto 16px;line-height:1.5;">The ${v.label} engine isn't capturing or computing right now, so it uses no bandwidth. Tap Start when you want live ${v.label} ⇄ ${v.partner} data.</div><button onclick="vTogglePause()" style="display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:9px;font-weight:700;font-size:13.5px;cursor:pointer;border:1px solid #16a34a;background:#16a34a;color:#fff;">▶ Start ${v.label}</button></div>`;
      return;
    }
    if (!st || (!st.ts && !st.err)) { el.innerHTML = `<div class="empty-state"><span class="emoji">⏳</span>Connecting to ${v.label}…</div>`; return; }
    if (st.err && !(st.opps && st.opps.length)) {
      el.innerHTML = `<div class="empty-state"><span class="emoji">⚠️</span>Couldn't reach the ${v.label} engine (${st.err}). If the backend was just deployed, give it a moment to discover markets.</div>`;
      return;
    }
    opps = st.opps;
  }
  const list = sortList(vFiltered(opps)[vTab] || []);
  if (!list.length) {
    // Call out an active filter so a filtered-to-zero list isn't mistaken for
    // "no data"; note intra-loop is same-exchange (never "⇄ Binance").
    const activeCoin = vTab === 'direct' ? venueFilter.direct.coin
      : vTab === 'loop' ? (venueFilter.loop.buyCoin || venueFilter.loop.sellCoin)
      : venueFilter.intraloop.coin;
    const filterNote = activeCoin ? ` matching “${activeCoin.toUpperCase()}”` : '';
    const scope = vTab === 'intraloop'
      ? `No ${v.label} triangle (intra-loop) opportunities${filterNote} with ≥ ₹100 profit right now — all three legs run on ${v.label} itself.`
      : vTab === 'loop'
      ? `No profitable ${v.label} ⇄ ${v.partner} loops${filterNote} right now (loops are shown depth-walked, transferable, and ≥ ₹100).`
      : `No direct opportunities${filterNote} on ${v.label} ⇄ ${v.partner} right now${!showDisabledWallets ? ' (blocked-wallet coins are hidden — flip “Disabled Wallets” to include them)' : ''}.`;
    el.innerHTML = `<div class="empty-state"><span class="emoji">🔍</span>${scope}</div>`;
    return;
  }
  paintCappedCards(el, list, o => o.type === 'direct' ? directCard(o) : o.type === 'loop' ? loopCard(o) : intraLoopCard(o));
}

// Inject a sidebar tab for every venue (under the Exchanges group), so adding
// to VENUES is all it takes for a new exchange to appear.
function buildVenueNav() {
  // Insert Zebpay/CoinDCX right after the WazirX tab, so the Exchanges group
  // reads WazirX · Zebpay · CoinDCX · Giottus.
  let after = document.getElementById('nav-wazirx') || document.getElementById('nav-giottus');
  if (after) {
    VENUES.forEach(v => {
      if (document.getElementById('nav-' + v.id)) return;
      const el = document.createElement('div');
      el.className = 'sidebar-item';
      el.id = 'nav-' + v.id;
      el.textContent = v.label;
      el.onclick = () => selectPage(v.id);
      after.insertAdjacentElement('afterend', el);
      after = el;
    });
  }
}

// "<Venue> Direct/Loop/Intra Loop" entries for the Create-alert menu — one set

let futTimer = null, futSnap = null, futErr = null, futMinDev = 0.1; // min |deviation| % filter

async function futRefresh() {
  try {

// Stop/Start the whole futures engine from the UI, so the WazirX + Binance perp
// feeds aren't polling in the background when you don't need them. The choice is
// saved server-side and survives a redeploy.
let futBusy = false;
async function toggleFutures(enabled) {
  if (futBusy) return;
  futBusy = true;
  try {
    const res = await fetch(`${API_BASE}/api/futures/control`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled })
    });
    if (!res.ok) throw new Error(`API ${res.status}`);
    if (futSnap) futSnap.running = enabled; // optimistic, so the button flips instantly
    await futRefresh();
  } catch (e) {
    alert(`Could not ${enabled ? 'start' : 'stop'} the futures scanner: ${e.message}`);

function renderFuturesPage() {
  const el = document.getElementById('cardList');
  if (!futSnap) { el.innerHTML = `<div class="empty-state">${futErr ? `Couldn't reach the futures engine (${futErr}).` : '⏳ Connecting…'}</div>`; return; }
  const running = futSnap.running !== false; // older backend without the flag => treat as running
  const controlBar = futuresControlBar(running);
  if (!running) {
    el.innerHTML = controlBar + `<div class="empty-state" style="grid-column:1/-1;"><span class="emoji">⏸️</span>Futures scanning is stopped — the WazirX &amp; Binance perp feeds aren't running, so nothing is polling in the background. Press <b>Start scanning</b> above whenever you want it back.</div>`;
    return;
  }
  const all = futSnap.opportunities || [];
  if (!all.length) { el.innerHTML = controlBar + `<div class="empty-state" style="grid-column:1/-1;"><span class="emoji">📉</span>No common WazirX↔Binance perp pairs yet — if the backend was just deployed, give discovery a minute.</div>`; return; }
  const warming = all.filter(o => !o.warmedUp);
  const ready = all.filter(o => o.warmedUp && Math.abs(o.deviationPct) >= futMinDev);
  const quiet = all.filter(o => o.warmedUp && Math.abs(o.deviationPct) < futMinDev);
  let html = controlBar + ready.map(futuresCard).join('');
  if (!ready.length) html += `<div class="empty-state" style="grid-column:1/-1;"><span class="emoji">😴</span>No perp deviating ≥ ${futMinDev}% from its baseline right now — ${quiet.length} pair(s) tracking quietly. The basis is calm; that's normal most of the time.</div>`;
  if (quiet.length && ready.length) html += `<div class="note-box" style="display:block; grid-column:1/-1;">${quiet.length} more pair(s) within ±${futMinDev}% of baseline (calm).</div>`;
  html += warming.map(futuresCard).join('');
  el.innerHTML = html;
}

// Paint a card list without blocking the main thread. A big list (e.g. Direct
// with volume OFF = 250+ cards) costs ~700ms to build+insert+lay-out in one
// shot, which freezes the UI on every tab switch and refresh. Instead we paint
// the first visible chunk instantly, then stream the rest one animation frame
// at a time so the page stays responsive. Small lists (the common case) render
// in a single pass — identical to before. A monotonic token cancels any
// in-flight stream the moment a newer render starts (tab switch / refresh), and
// the container's height is held during streaming so scroll never jumps.
let __paintToken = 0;
function paintCards(el, list, renderFn, chunk = 24) {
  const token = ++__paintToken;
  if (list.length <= chunk) { el.style.minHeight = ''; el.innerHTML = list.map(renderFn).join(''); return; }
  const prevH = el.offsetHeight;
  if (prevH) el.style.minHeight = prevH + 'px';
  el.innerHTML = list.slice(0, chunk).map(renderFn).join('');
  let i = chunk;
  const step = () => {
    if (token !== __paintToken) return; // superseded by a newer paint
    const end = Math.min(i + chunk, list.length);
    let html = '';
    for (; i < end; i++) html += renderFn(list[i]);
    el.insertAdjacentHTML('beforeend', html);
    if (i < list.length) requestAnimationFrame(step);
    else el.style.minHeight = '';
  };
  requestAnimationFrame(step);
}

// Only ever render the best CARD_CAP opportunities. The list is already sorted
// best-first, so the top slice is exactly what's worth looking at; showing 250+
// cards was the whole reason a render could be heavy. The tab count still shows
// the TRUE total, and a footer tells the user how many were trimmed so nothing
// feels silently hidden.
const CARD_CAP = 30;

// A stable identity for one opportunity, so the same card can keep the same DOM
// element from one refresh to the next instead of being demolished and rebuilt.
// Returns null for anything unrecognised — the painter then falls back to the
// old whole-list write, so an unfamiliar card can only ever be slower, never
// wrong.
function cardKey(o) {
  if (!o || typeof o !== 'object') return null;
  if (o.type === 'direct') {
    return `d|${o.coin}|${o.buyExchange}|${o.buyMarket}|${o.sellExchange}|${o.sellMarket}`;
  }
  if (o.type === 'loop') {
    return `l|${o.coin1}|${o.coin2}|${o.entryVenue}|${o.exitVenue}|${o.entryMarket || ''}|${o.exitMarket || ''}`;
  }
  if (o.type === 'intraloop') {
    // pathLabel is what separates the two rotations of the same coin
    // (INR → COIN → USDT → INR versus INR → USDT → COIN → INR).
    return `i|${o.coin}|${o.exchange || 'wazirx'}|${o.pathLabel || ''}`;
  }
  return null;
}

// Turn one card's HTML string into the exact list of nodes that string would
// have produced inside the container. Every node is kept, including the leading
// whitespace the render functions emit, so what ends up in the DOM is character
// for character what the old whole-list write produced. <template> is used
// rather than a scratch <div> because it parses any markup without dropping it.
function cardNodes(html) {
  const t = document.createElement('template');
  t.innerHTML = html;
  return Array.prototype.slice.call(t.content.childNodes);
}

// ---------------------------------------------------------------------------
// KEYED PAINT — why this is not `el.innerHTML = ...` any more.
//
// The old painter wrote the whole list in one go, which threw away roughly
// 2,500 DOM elements and rebuilt them from a ~106 KB string on EVERY 10-second
// refresh. Measured on a phone-class CPU that cost 190-460ms per refresh, with
// one 2.1-second freeze recorded. For that whole window the page cannot scroll,
// cannot register a tap, and cannot animate — which is exactly the lag that a
// native app like Myntra never shows, because it recycles its rows instead of
// rebuilding them.
//
// Now every opportunity keeps its own element. A card whose HTML has not
// changed is not touched at all. A card whose numbers moved is refilled on its
// own. Cards that leave the list are removed; cards that change rank are MOVED,
// which the browser does without re-parsing them.
//
// The critical part for safety: renderFn is untouched, and the HTML written
// here is byte-for-byte what the old painter wrote. The arbitrage numbers
// cannot drift from this change — the only difference is how the same bytes
// reach the screen.
// ---------------------------------------------------------------------------
// Everything a card's HTML can be built from besides the opportunity object
// itself. Measured by reading the card renderers: directCard and loopCard both
// branch on `withVolume`, and loopCard prints the venue name, which comes from
// `currentPage`. `sortBy` decides the wording of the cap note. If any of these
// move, every memo is invalidated at once.
function paintEpoch() {
  // vTab added 6 Aug: it wasn't here even though it's exactly the kind of
  // page-state this comment already warns about — a venue page's Direct/Loop/
  // Intra Loop sub-tabs all share one currentPage value, so the epoch alone
  // couldn't tell them apart. The paint-cache is now ALSO reset on any view
  // change by paintCappedCards itself (viewSig check, which includes vTab),
  // so this is belt-and-suspenders, not the primary fix — but it costs
  // nothing and matches what the comment above always promised.
  return `${currentPage}|${typeof vTab !== 'undefined' ? vTab : ''}|${withVolume}|${sortBy}|${CARD_CAP}`;
}

// The memo below is checked against reality on a rolling basis rather than
// trusted. Every PAINT_AUDIT_EVERY-th paint renders every card the slow way and
// compares it against what the memo would have reused. A single disagreement
// means some page state feeds the cards that this file does not know about, so
// the memo is switched off permanently for the session and the page carries on
// at the old speed. Being slow is survivable; showing a stale price is not.
const PAINT_AUDIT_EVERY = 20;
let __paintCount = 0;
let __paintMemoOff = false;
const CAP_NOTE_KEY = 'cap-note';

function paintCappedCards(el, fullList, renderFn) {
  const shown = fullList.slice(0, CARD_CAP);
  const hidden = fullList.length - shown.length;
  el.style.minHeight = '';
  ++__paintToken; // cancel any in-flight streamed paint from before
  const note = hidden > 0
    ? `<div class="cap-note">Showing the top ${CARD_CAP} by ${sortBy === 'profit' ? 'rupee profit' : 'percentage'} · ${hidden} more not shown — add a coin filter to narrow.</div>`
    : '';

  // Nikhil, 6 Aug — hard close on "a Direct card under the Intra Loop tab".
  // The keyed diff below is content-safe (it fingerprints the actual
  // opportunity object, so it can never show one coin's data under another's
  // card) — but #cardList is the SAME element for every tab of every venue,
  // and its el.__cards Map was never invalidated on a TAB SWITCH specifically,
  // only on content change. viewSig() (page|tab|volume) already existed for
  // the poll-skip check elsewhere; it's used here for the first time to also
  // gate the paint cache. A view change just drops the Map — the existing
  // "prev has nothing for this key" path below already rebuilds every card
  // from scratch (cheap: it's the same one-time cost as a tab click already
  // pays) AND repopulates el.__cards properly, so the NEXT repaint on this
  // same tab still gets the fast path. This removes any possibility of a
  // stale node surviving a tab boundary, full stop.
  const curViewSig = viewSig();
  if (el.__cardsViewSig !== curViewSig) { el.__cardsViewSig = curViewSig; el.__cards = null; }

  // Same arguments the old `shown.map(renderFn)` passed, so a renderFn that
  // looks at its index still behaves identically.
  const render = (i) => renderFn(shown[i], i, shown);
  const slowPaint = () => {
    el.__cards = null;
    el.innerHTML = shown.map((o, i, a) => renderFn(o, i, a)).join('') + note;
  };

  const keys = shown.map(cardKey);
  // Unrecognised or duplicate keys => do it the old way. Correctness first.
  if (keys.some(k => !k) || new Set(keys).size !== keys.length) { slowPaint(); return; }
  if (note) keys.push(CAP_NOTE_KEY);

  const audit = (++__paintCount % PAINT_AUDIT_EVERY) === 0;
  const epoch = paintEpoch();
  const prev = el.__cards instanceof Map ? el.__cards : new Map();
  const next = new Map();
  const order = [];
  let rebuilt = 0;
  for (let i = 0; i < keys.length; i++) {
    const k = keys[i];
    const isNote = k === CAP_NOTE_KEY;
    // The fingerprint is the complete set of inputs the card's HTML is built
    // from: the opportunity object itself, plus the page state captured in the
    // epoch, plus its index. Same fingerprint => the renderer would produce the
    // same string, so it is not called at all. That skip is where the speed
    // comes from: building the 30 HTML strings measured at 57ms of a 113ms
    // refresh, the fingerprint compare at 0.2ms.
    const sig = isNote ? 'note ' + note
      : epoch + ' ' + i + ' ' + JSON.stringify(shown[i]);
    let rec = prev.get(k);
    const fresh = !__paintMemoOff && rec && rec.sig === sig && rec.nodes.length &&
                  rec.nodes[0].parentNode === el;

    if (!fresh || audit) {
      const h = isNote ? note : render(i);
      if (fresh && rec.html !== h) {
        // The memo said "unchanged" and the renderer disagreed. Never trust it
        // again this session, and take the renderer's HTML from here on.
        __paintMemoOff = true;
        try { console.warn('[paint] memo disabled - a card rendered differently than its fingerprint predicted'); } catch (e) {}
      }
      if (!fresh || rec.html !== h) {
        const nodes = cardNodes(h);
        if (!nodes.length) { slowPaint(); return; }
        rec = { nodes, sig, html: h };
        rebuilt++;
      } else {
        // Different inputs, identical output — a field moved that this card does
        // not print. Keep the nodes untouched and record the new fingerprint, so
        // an identical refresh after this one skips the render as well.
        rec.sig = sig;
      }
    }
    next.set(k, rec);
    for (const n of rec.nodes) order.push(n);
  }

  if (rebuilt * 2 > shown.length) {
    // Most of the visible cards actually changed. Splicing ~2,500 nodes into the
    // live tree one at a time is worse than the old single innerHTML write, so
    // the new order is assembled in a detached fragment — where inserts cost
    // almost nothing because nothing is laid out — and swapped in at the end.
    // Two live mutations instead of thousands, and the per-card records survive,
    // so the very next refresh still gets the cheap path.
    const frag = document.createDocumentFragment();
    for (const node of order) frag.appendChild(node);
    while (el.firstChild) el.removeChild(el.firstChild);
    el.appendChild(frag);
  } else {
    // Only a few cards moved. Walk the desired order against what is actually in
    // the container: a node already in the right place is skipped, anything else
    // is inserted, which for an existing node is a cheap MOVE rather than a
    // rebuild. Whatever is left over at the end is stale and gets dropped — that
    // also cleans up after any other page that wrote into this container.
    let ref = el.firstChild;
    for (const node of order) {
      if (ref === node) { ref = node.nextSibling; continue; }
      el.insertBefore(node, ref);
    }
    while (ref) { const n = ref.nextSibling; el.removeChild(ref); ref = n; }
  }

  el.__cards = next;
}

// What view the card list was last painted FOR. A 204 "unchanged" poll skips
// repainting on the assumption the screen already shows the current data on
// the current tab — this signature is how that assumption is checked instead
// of trusted. If the user navigated and a repaint slipped through (any bug,
// present or future), the next poll notices the mismatch and repaints.
let __lastPaintSig = '';
function viewSig() { return `${currentPage}|${typeof vTab !== 'undefined' ? vTab : ''}|${withVolume}`; }

function renderCards() {
  const list0 = document.getElementById('cardList');
  __lastPaintSig = viewSig();

  if (venueCfg()) { renderVenuePage(); return; }
  if (currentPage === 'futures') { renderFuturesPage(); return; }
  if (currentPage === 'alerts') { renderAlertsPage(); return; }
  if (currentPage === 'orderbook') { renderOrderbookPage(); return; }
  if (currentPage === 'others') { renderOthersPage(); return; }
  if (currentPage === 'giottus') { renderGiottusPage(); return; }
  if (currentPage === 'coinswitch') { renderCoinswitchPage(); return; }
  if (currentPage === 'notifications') { renderNotificationsPage(); return; }

  if (currentPage === 'intraloop') {
    const f = pageFilters.intraloop;
    let list = allOpportunities.filter(o => o.type === 'intraloop');
    if (!list.length) {
      list0.innerHTML = `<div class="empty-state"><span class="emoji">🔄</span>No intra-loop data yet. If the backend hasn't been redeployed with the intra-loop engine, deploy the updated compute.js first — otherwise there may just be no computable triangles right now.</div>`;
      return;
    }
    if (f.exchange) list = list.filter(o => (o.exchange || 'wazirx') === f.exchange);
    if (f.coin) list = list.filter(o => o.coin.includes(f.coin));
    // Intra-loops under ₹100 walked profit are noise — hidden on the page (and
    // in alerts), with hysteresis so a borderline triangle doesn't flicker.
    list = list.filter(o => !o.walked || minProfitGate(o));
    list = sortList(list);
    if (!list.length) {
      list0.innerHTML = `<div class="empty-state"><span class="emoji">🔍</span>No intra-loop opportunities match the current filters.</div>`;
      return;
    }
    paintCappedCards(list0, list, intraLoopCard);
    return;
  }
  if (!hasLoadedOnce) {
    list0.innerHTML = `<div class="empty-state"><span class="emoji">⏳</span>Loading opportunities…</div>`;
    return;
  }
  if (allOpportunities.length === 0) {
    list0.innerHTML = `<div class="empty-state"><span class="emoji">⚠️</span>No data from the scanner yet. It may still be starting up — try Refresh in a moment.</div>`;
    return;
  }
  const list = filteredOpportunities();
  if (list.length === 0) {
    list0.innerHTML = `<div class="empty-state"><span class="emoji">🔍</span>No arbitrage was found for the selected filters. Try changing them.</div>`;
    return;
  }
  paintCappedCards(list0, list, o => o.type === 'direct' ? directCard(o) : loopCard(o));
}

// ================================================================
// RENDER — depth bar cell + dual order-book table (DIRECT modal).
// Side-by-side layout matching the reference. Note: this only shows
// the side of each book that's actually walked (Binance asks since
// we're buying there, WazirX bids since we're selling there) — the
// API doesn't expose the opposite/unused side of either book, so a
// full two-sided view per exchange isn't possible without a backend
// change.
// ================================================================
function kkBar(l, colorVar) {
  if (!l || !(l.consumedQty > 0)) return '';
  const pct = Math.min(l.consumedPct || 0, 100);
  return `
    <div class="kk-ob-bar">
      <div class="kk-ob-track"><div class="kk-ob-fill" style="width:${pct}%; background:var(${colorVar});"></div></div>
      <span class="kk-ob-pct" style="color:var(${colorVar});">${(l.consumedPct||0).toFixed(2)}%</span>
    </div>
    <div class="kk-ob-consumed" style="color:var(${colorVar});">(${fmtSize(l.consumedQty)})</div>`;
}

function kkObCellPair(l, colorVar, currency, showBars) {
  if (!l) return '<td class="ob-size-cell"></td><td class="ob-price-cell"></td>';
  // showBars === false hides the red/green "% consumed" bar (used for Loop /
  // Intra Loop when the overall arb has gone negative). Undefined = show, so
  // the Direct modal keeps its bars unchanged.
  const bar = (showBars === false) ? '' : kkBar(l, colorVar);
  return `<td class="ob-size-cell"><div class="kk-ob-size">${fmtSize(l.size)}</div>${bar}</td><td class="ob-price-cell">${fmtAdaptive(l.price)}</td>`;
}

// KoinKnight layout: one continuous table — asks section (pink) on top with
// best ask nearest the middle, a yellow Spread row, then bids (green) with
// best bid first. Left column pair = buy exchange (its asks are what we
// buy into); right pair = sell exchange (its bids are what we sell into).
// The buy exchange has no rows in the bids section and vice versa, because
// the backend only streams the walked side of each book.
// How many levels to actually draw. The 13-row cap was a deliberate readability
// call and it stays as the FLOOR — but it was applied blindly, so on a deep book
// a level the trade genuinely consumed could be cut off the bottom of the table.
// The walk would say it used 15 levels and the page would show 13, with the last
// two bars simply missing. Now the cap stretches just far enough to keep every
// consumed level on screen (never past the 20 the feed carries), and stays at 13
// whenever the trade is shallower than that — which is nearly always.
var OB_MIN_ROWS = 13, OB_MAX_ROWS = 20;
function obCut(levels) {
  const arr = levels || [];
  let last = -1;
  for (let i = 0; i < arr.length; i++) if ((arr[i] && arr[i].consumedQty) > 0) last = i;
  return arr.slice(0, Math.min(OB_MAX_ROWS, Math.max(OB_MIN_ROWS, last + 1)));
}

function dualOrderBookTable(buy, sell) {
  buy = { ...buy, levels: obCut(buy.levels) };
  sell = { ...sell, levels: obCut(sell.levels) };
  const asksReversed = [...buy.levels].reverse(); // best ask ends up adjacent to the spread row
  const askRows = asksReversed.map(l =>
    `<tr class="kk-ask-row">${kkObCellPair(l, '--danger', buy.currency)}<td></td><td></td></tr>`
  ).join('');
  const bidRows = sell.levels.map(l =>
    `<tr class="kk-bid-row"><td></td><td></td>${kkObCellPair(l, '--success', sell.currency)}</tr>`
  ).join('');
  return `
    <div class="loop-scroll">
    <table class="ob-table dual">
      <thead>
        <tr>
          <th colspan="2" class="ob-group">${exLabel(buy.exchange)}<div class="ob-sub">${buy.market}</div></th>
          <th colspan="2" class="ob-group">${exLabel(sell.exchange)}<div class="ob-sub">${sell.market}</div></th>
        </tr>
        <tr><th>Size</th><th>Price</th><th>Size</th><th>Price</th></tr>
      </thead>
      <tbody>
        ${askRows}
        <tr class="kk-spread-row"><td class="kk-spread-label">Spread</td><td>—</td><td class="kk-spread-label">Spread</td><td>—</td></tr>
        ${bidRows}
      </tbody>
    </table>
    </div>`;
}

function renderDirectModal(entry) {
  if (!entry) {
    document.getElementById('modalBody').innerHTML = `<div class="modal-note">Loading…</div>`;
    return;
  }
  document.getElementById('modalTitle').textContent = `${entry.coin.toUpperCase()} — Direct Arbitrage`;
  document.getElementById('modalStatus').innerHTML = modalVolumeToggleHtml() + (withVolume
    ? `refreshes every 3s while open · <a href="#" onclick="refreshDirectModalLive(); return false;" style="color:var(--primary);">refresh now</a>`
    : 'Volume is OFF — showing top-of-book only');

  // Volume OFF (or the walk not loaded yet): show the rough spread box but
  // STILL render the live order book below — same normal book view, just
  // without the fee/leg breakdowns that need a walk.
  if (!withVolume || !entry.walked) {
    const legsEarly = entry.liveBooks && entry.liveBooks.legs;
    const obEarly = legsEarly
      ? `${entry.partial ? `<div class="modal-note">${entry.partialReason}</div>` : ''}
         <div class="ob-section-title" style="margin-top:10px;">Order Book</div>${loopOrderBookTable(legsEarly)}`
      : (liveBookError
          ? `<div class="banner-error">Couldn't load the order book (${liveBookError}). Retrying every 15s.</div>`
          : `<div class="modal-note">Loading live order book depth…</div>`);
    document.getElementById('modalBody').innerHTML = `
      ${!withVolume ? '<div class="note-box">Volume is OFF — figures priced on a fixed ₹1,00,000 at the first ask/bid.</div>' : ''}
      ${entry.fixed ? `
        <div class="profit-box ${entry.fixed.profit < 0 ? 'negative' : ''}">
          <div>
            <div class="profit-pct">${entry.fixed.profitPct.toFixed(2)}% (${fmtInr(entry.fixed.profit,2)})</div>
            <div class="profit-sub">buy ${fmtAdaptive(entry.fixed.buyQty)} ${entry.coin.toUpperCase()} @ ${fmtAdaptive(entry.fixed.buyPrice)} → sell @ ${fmtAdaptive(entry.fixed.sellPrice)}</div>
          </div>
          <div class="profit-sub">on ₹1,00,000</div>
        </div>`
      : `
        <div class="profit-box ${(entry.roughPct ?? 0) < 0 ? 'negative' : ''}">
          <div class="profit-pct">${entry.roughPct != null ? entry.roughPct.toFixed(2) + '%' : '—'}</div>
          <div class="profit-sub">${entry.roughPct != null ? 'raw spread, fees not applied' : 'spread not computable this instant'}</div>
        </div>`}
      ${obEarly}`;
    return;
  }

  const d = entry.walked;
  const legs = entry.liveBooks && entry.liveBooks.legs;
  let buy = entry.liveBooks && entry.liveBooks.buy;   // legacy shape (seed data / older backend)
  let sell = entry.liveBooks && entry.liveBooks.sell;
  let usingFallbackBooks = false;
  if (!legs && (!buy || !sell)) {
    const fb = fallbackBooksFromRows(entry);
    if (fb) { buy = fb.buy; sell = fb.sell; usingFallbackBooks = true; }
  }

  // "Why did it stop at THIS level?" — the question the table could never answer.
  // The walk takes every level where the next one still pays, so the number of
  // Binance levels it touches is decided by how big those levels happen to be,
  // not by any cap. Two screenshots of the same coin a minute apart stopped at
  // the same PRICE and used two levels one time and four the next, purely
  // because the depth sitting at those prices had changed. That was invisible
  // from the page, so it read as arbitrary. It isn't, and now it says so.
  //
  // The distinction that matters: 'unprofitable' means this IS the whole
  // arbitrage. The two depth reasons mean the 20-level feed ran out while the
  // trade was still paying — the profit shown is then a floor, not the total.
  function walkStopNote(entry) {
    const s = entry && entry.walkStop;
    if (!s) return '';
    const px = (v) => v == null ? '—' : fmtAdaptive(v);
    if (s.reason === 'unprofitable') {
      const nxt = s.nextAskPrice != null || s.nextBidPrice != null
        ? ` The next level (buy ${px(s.nextAskPrice)} / sell ${px(s.nextBidPrice)}) would have lost money on every token, so it was left alone.`
        : '';
      return `<div class="note-box">Used the top ${s.bidLevelsUsed} sell level${s.bidLevelsUsed === 1 ? '' : 's'} and the top ${s.askLevelsUsed} buy level${s.askLevelsUsed === 1 ? '' : 's'} — it goes as deep as the arbitrage stays positive and stops there.${nxt} A different level count next time means the book changed, not the rule.</div>`;
    }
    const side = s.reason === 'bid_depth' ? 'sell' : 'buy';
    return `<div class="note-box" style="border-color:#f4c2c2;">Took every one of the ${side === 'sell' ? s.bidLevelsAvailable : s.askLevelsAvailable} ${side} levels the feed carries and the trade was <b>still profitable</b> at the last one. This is as deep as the data goes, not as deep as the money goes — treat the profit above as a minimum.</div>`;
  }
  const obStopNote = walkStopNote(entry);

  const obLegend = `
    <div class="ob-legend">
      <div class="ob-legend-item"><span class="ob-swatch" style="background:var(--ask-bg); border:1px solid #f4c2c2;"></span><span class="ob-bar-icon" style="background:var(--danger);"></span>Asks — % consumed by this trade</div>
      <div class="ob-legend-item"><span class="ob-swatch" style="background:var(--bid-bg); border:1px solid #b7e6da;"></span><span class="ob-bar-icon" style="background:var(--success);"></span>Bids — % consumed by this trade</div>
    </div>`;

  const obSection = legs ? `
    ${obLegend}
    <div class="ob-section-title">Order Book</div>
    ${liveBookError ? `<div class="modal-note" style="color:var(--danger);">Last refresh failed (${liveBookError}) — showing the previous snapshot, retrying every 15s.</div>` : ''}
    ${loopOrderBookTable(legs)}
    ${obStopNote}
    <div class="note-box">Both sides of both books, up to 20 levels each. Bars mark the levels this trade consumes: ${exLabel(entry.buyExchange)}'s asks (buying) and ${exLabel(entry.sellExchange)}'s bids (selling).</div>`
  : (buy && sell && liveFailStreak >= 2) ? `
    ${obLegend}
    <div class="ob-section-title">Order Book</div>
    <div class="banner-error">Live order-book feed unreachable${liveBookError ? ` — reason: ${liveBookError}` : ''} — showing only the levels this trade touched meanwhile.</div>
    ${dualOrderBookTable(buy, sell)}
    ${obStopNote}`
  : (liveBookError && liveFailStreak >= 2
      ? `${obLegend}<div class="ob-section-title">Order Book</div><div class="banner-error">Couldn't load the order book (${liveBookError}). Retrying automatically every 15s — or tap "refresh now" above.</div>`
      : `${obLegend}<div class="ob-section-title">Order Book</div><div class="modal-note">Updating live order book depth…</div>`);

  document.getElementById('modalBody').innerHTML = `
    <details class="leg-detail" open>
      <summary>
        <div class="leg-summary-left">
          <div class="leg-tag buy">Buy</div>
          <div class="leg-amount">${fmtAdaptive(d.buyQty)} ${entry.coin.toUpperCase()}</div>
          <div class="leg-sub">${fmtInr(d.buyPrice,0)}</div>
        </div>
        <div class="leg-summary-right">
          <div class="ex-name">${exLabel(entry.buyExchange)}</div>
          <div class="ex-market">${entry.buyMarket}</div>
        </div>
      </summary>
      <div class="leg-detail-body">
        <div class="leg-line"><span class="k">Buy price</span><span class="v">${fmtInr(d.buyPrice,4)}</span></div>
        <div class="leg-line"><span class="k">Trading charges</span><span class="v">${fmtInr(d.tradingChargeBuy,4)}</span></div>
        <div class="leg-line"><span class="k">Final buy price</span><span class="v">${fmtInr(d.finalBuy,4)}</span></div>
      </div>
    </details>

    <details class="leg-detail" open>
      <summary>
        <div class="leg-summary-left">
          <div class="leg-tag sell">Sell</div>
          <div class="leg-amount">${fmtAdaptive(d.sellQty)} ${entry.coin.toUpperCase()}</div>
          <div class="leg-sub">${fmtInr(d.finalSell,0)}</div>
        </div>
        <div class="leg-summary-right">
          <div class="ex-name">${exLabel(entry.sellExchange)}</div>
          <div class="ex-market">${entry.sellMarket}</div>
        </div>
      </summary>
      <div class="leg-detail-body">
        <div class="leg-line"><span class="k">Sell price</span><span class="v">${fmtInr(d.sellPrice,4)}</span></div>
        <div class="leg-line"><span class="k">Crypto transfer charge</span><span class="v">${fmtInr(d.transferCharge,4)}</span></div>
        <div class="leg-line"><span class="k">Network</span><span class="v">${entry.network}</span></div>
        <div class="leg-line"><span class="k">Trading charges</span><span class="v">${fmtInr(d.tradingChargeSell,4)}</span></div>
        <div class="leg-line"><span class="k">Final sell price</span><span class="v">${fmtInr(d.finalSell,4)}</span></div>
      </div>
    </details>

    <details class="arb-detail" open>
      <summary>
        <div class="arb-box">
          <div class="arb-pct">${d.profitPct.toFixed(2)}% (${fmtInr(d.profit,2)})</div>
          <div class="arb-time">${entry.executionMin.toFixed(2)} mins <span class="arb-caret">▾</span></div>
        </div>
      </summary>
      <div class="leg-detail-body">
        <div class="leg-line"><span class="k">Transfer + confirmation time</span><span class="v">${entry.executionMin.toFixed(2)} mins</span></div>
        <div class="leg-line"><span class="k">Network</span><span class="v">${entry.network}</span></div>
        <div class="leg-line"><span class="k">Rate source</span><span class="v">${entry.rateSource}</span></div>
      </div>
    </details>

    ${obSection}
  `;
}

async function refreshDirectModalLive() {
  if (!openCard || openCard.type !== 'direct') return;
  renderDirectModal(directLiveEntry || findOpportunity(openCard)); // show what we have immediately
  try {
    const data = await fetchLiveCoin(openCard.coin);
    const list = data.opportunities || [];
    // Prefer the exact combo (exchange + market); then same buy exchange;
    // then anything — never flash the sparse fallback over a technicality.
    const match = list.find(o => o.buyExchange === openCard.buyExchange && o.buyMarket === openCard.buyMarket)
      || list.find(o => o.buyExchange === openCard.buyExchange)
      || list[0];
    if (match) {
      directLiveEntry = match; liveBookError = null; liveFailStreak = 0;
      liveCache[`${cachePfx()}${openCard.coin}:${openCard.buyExchange}:${openCard.buyMarket}`] = match;
    }
    if (openCard) renderDirectModal(directLiveEntry || findOpportunity(openCard));
  } catch (err) {
    liveFailStreak++;
    liveBookError = err.message;
    // Keep showing the last good live books; only fall back to the sparse
    // touched-levels view if we never got a live response at all.
    if (openCard) renderDirectModal(directLiveEntry || findOpportunity(openCard));
  }
}

// Fallback order book when the live per-coin endpoint isn't reachable:
// rebuilt from the walked rows already in the list data. Only the levels
// the trade actually touched are known (level index, price, qty consumed)
// — not the full 20-level depth — so it's clearly labeled as such.
function fallbackBooksFromRows(entry) {
  const rows = entry.walked && entry.walked.rows;
  if (!rows || !rows.length) return null;
  const asks = {}, bids = {};
  for (const r of rows) {
    if (r.askLevel !== undefined) {
      const p = r.priceAsk !== undefined ? r.priceAsk : r.price;
      if (!asks[r.askLevel]) asks[r.askLevel] = { price: p, size: 0, consumedQty: 0, consumedPct: 100 };
      asks[r.askLevel].size += r.qty; asks[r.askLevel].consumedQty += r.qty;
    }
    if (r.bidLevel !== undefined && r.priceBid !== undefined) {
      if (!bids[r.bidLevel]) bids[r.bidLevel] = { price: r.priceBid, size: 0, consumedQty: 0, consumedPct: 100 };
      bids[r.bidLevel].size += r.qty; bids[r.bidLevel].consumedQty += r.qty;
    }
  }
  const toArr = m => Object.keys(m).sort((a,b)=>a-b).map(k => m[k]);
  return {
    buy:  { exchange: entry.buyExchange, market: entry.buyMarket, currency: 'INR', levels: toArr(asks) },
    sell: { exchange: entry.sellExchange, market: entry.sellMarket, currency: 'INR', levels: toArr(bids) }
  };
}

// KoinKnight-style multi-market order book for loops: one table, a column
// pair (Size|Price) per leg, asks section on top aligned so every leg's
// best ask sits adjacent to the yellow Spread row (shorter books pad at
// the top), then per-leg Spread values (best ask - best bid — computable
// now that the backend sends both sides), then bids best-first.
function loopOrderBookTable(legs, opts) {
  opts = opts || {};
  const showBars = opts.showBars !== false;   // false → plain book (arb negative)
  const levels = opts.levels || null;         // {first:{pct,inr}, second:{pct,inr}}
  // Drop the synthetic USDTUSDC book: on a stablecoin cash-out loop the middle
  // Binance "buy USDT" leg is a 1:1 no-op, so its book (an inverted USDC/USDT
  // reference) isn't part of the actual trade and only confuses. Real loops keep
  // their genuine c2 Binance book (e.g. GALAUSDT).
  // Drop the synthetic USDTUSDC no-op — but ONLY when doing so still leaves a
  // real two-sided view. On a stablecoin cash-out LOOP the usdtusdc leg is a
  // 1:1 middle no-op among 3+ legs, so it goes. On the USDT DIRECT modal the
  // legs are exactly [binance usdtusdc, wazirx usdtinr] — there the usdtusdc
  // book IS the trade (usdt priced vs usdc), so dropping it would leave one
  // lonely WazirX book, which is the "USDT shows only one leg" bug. Keep both
  // whenever the filter would cut the display below two legs.
  const _noStable = (legs || []).filter(l => (l.market || '').toLowerCase() !== 'usdtusdc');
  legs = _noStable.length >= 2 ? _noStable : (legs || []);
  // Cap at 13 levels a side — deeper reads poorly on screen (user call) — but
  // stretch past it when the trade itself reaches further, so no consumed level
  // is ever cut off the bottom of the table. See obCut().
  legs = legs.map(l => ({ ...l, asks: obCut(l.asks), bids: obCut(l.bids) }));
  const maxAsks = Math.max(...legs.map(l => l.asks.length));
  const maxBids = Math.max(...legs.map(l => l.bids.length));

  let askRows = '';
  for (let r = 0; r < maxAsks; r++) {
    askRows += '<tr class="kk-ask-row">';
    for (const leg of legs) {
      // bottom row (r = maxAsks-1) shows each leg's BEST ask (index 0),
      // rows above walk outward into worse prices; shallow legs pad at top
      const idx = maxAsks - 1 - r;
      askRows += idx < leg.asks.length ? kkObCellPair(leg.asks[idx], '--danger', leg.currency, showBars) : '<td></td><td></td>';
    }
    askRows += '</tr>';
  }

  let spreadRow = '<tr class="kk-spread-row">';
  for (const leg of legs) {
    const bestAsk = leg.asks[0], bestBid = leg.bids[0];
    const spread = (bestAsk && bestBid) ? (bestAsk.price - bestBid.price) : null;
    spreadRow += `<td class="kk-spread-label">Spread</td><td class="ob-price-cell">${spread !== null ? fmtAdaptive(spread) : '—'}</td>`;
  }
  spreadRow += '</tr>';

  let bidRows = '';
  for (let r = 0; r < maxBids; r++) {
    bidRows += '<tr class="kk-bid-row">';
    for (const leg of legs) {
      bidRows += leg.bids[r] ? kkObCellPair(leg.bids[r], '--success', leg.currency, showBars) : '<td></td><td></td>';
    }
    bidRows += '</tr>';
  }

  const headGroups = legs.map(l => `<th colspan="2" class="ob-group">${exLabel(l.exchange)}<div class="ob-sub">${l.market}</div></th>`).join('');
  const headCols = legs.map(() => '<th class="ob-size-cell">Size</th><th class="ob-price-cell">Price</th>').join('');

  // 1st/2nd Level Arb banner (4-leg loop books only). The arb % for each half
  // now lives HERE, right above its columns — instead of at the top of the
  // modal — so you can read it against the book it belongs to.
  const arbCell = (label, x) => {
    if (!x || !isFinite(x.pct)) return label;
    const color = x.pct < 0 ? 'var(--danger)' : 'var(--success)';
    const inr = (x.inr != null && isFinite(x.inr)) ? ` (${fmtInr(x.inr, 2)})` : '';
    return `${label} <span style="color:${color}; font-weight:700;">${x.pct.toFixed(2)}%${inr}</span>`;
  };
  const levelBanner = legs.length >= 4
    ? `<tr><th class="ob-group" colspan="${legs.length}">${levels ? arbCell('1st Level Arb', levels.first) : '1st Level Arb'}</th><th class="ob-group" colspan="${legs.length}">${levels ? arbCell('2nd Level Arb', levels.second) : '2nd Level Arb'}</th></tr>`
    : '';
  return `
    <div class="loop-scroll">
    <table class="ob-table dual" style="min-width:${legs.length * 150}px;">
      <thead>
        ${levelBanner}
        <tr>${headGroups}</tr>
        <tr>${headCols}</tr>
      </thead>
      <tbody>${askRows}${spreadRow}${bidRows}</tbody>
    </table>
    </div>`;
}

// ================================================================
// RENDER — LOOP modal
// ================================================================
// Shared builders so the periodic refresh can update just the numbers + order
// book IN PLACE (see updateLoopModalLive) instead of tearing down and rebuilding
// the whole modal, which flickered and reset scroll / open <details> every cycle.
function loopTouchedRows(label, arr, unit) {
  return (arr && arr.length) ? arr.map(t =>
    `<div class="leg-line"><span class="k">${label} — level ${t.level}</span><span class="v">${fmtCoin(t.qty,2)} ${unit} @ ${fmtNum(t.price,6)} (${t.pct.toFixed(1)}% of level)</span></div>`
  ).join('') : `<div class="leg-line"><span class="k">—</span><span class="v">no levels touched</span></div>`;
}

// A loop that cashes out in a stablecoin (c2 = USDT/USDC) has NO real middle
// Binance leg — you already hold USDT after selling c1, so "buy c2 on Binance"
// is a 1:1 no-op (the engine values it at exactly 1.0). For those loops we drop
// that phantom leg and, crucially, surface the real first step — buying c1 on
// the home venue — which the generic 3-leg layout otherwise hides in the rate
// note. Normal loops (c2 = a real coin) keep the original three legs.
function loopIsStableCashout(entry) {
  return entry && (entry.coin2 === 'usdt' || entry.coin2 === 'usdc');
}
// Both shapes are always three top-level legs — Buy c1 → (middle) → Sell c2 —
// matching the card and the KoinKnight layout:
//   3-leg (stablecoin cash-out): buy c1 → sell c1 on Binance (→ USDT) → sell USDT on home
//   4-leg (buy another coin):    buy c1 → CONVERT c1▶c2 on Binance → sell c2 on home
// In the 4-leg case the middle "Convert" leg is a collapsed dropdown that
// expands to reveal both Binance sub-legs (sell c1 for USDT, buy c2 with USDT).
function loopLegLabels(entry) {
  const c1 = entry.coin1.toUpperCase(), c2 = entry.coin2.toUpperCase(), vn = cardVenueName();
  return loopIsStableCashout(entry)
    ? [`Leg 1 — buy ${c1} on ${vn}`, `Leg 2 — sell ${c1} on Binance`, `Leg 3 — sell ${c2} on ${vn}`]
    : [`Leg 1 — buy ${c1} on ${vn}`, `Leg 2 — convert ${c1} ▶ ${c2} on Binance`, `Leg 3 — sell ${c2} on ${vn}`];
}
// Index of the leg that should render COLLAPSED by default (the "extra" middle
// convert leg). −1 = none collapsed (3-leg cash-out has no extra leg).
function loopCollapsedLeg(entry) { return loopIsStableCashout(entry) ? -1 : 1; }
function loopLegBodies(entry, l) {
  const c1 = entry.coin1.toUpperCase(), c2 = entry.coin2.toUpperCase();
  const u = entry.usdtInrUsed || {};
  const rateVal = x => (x && typeof x === 'object') ? x.rate : x;
  const entryRate = rateVal(u.entry);
  // USDT actually spent buying c1 on the venue's coin/USDT market (finalCostInr
  // valued at the same usdtinr rate the engine used) — this is the "which USDT
  // price is considered" number.
  const usdtInBuy = (entryRate && l.finalCostInr) ? l.finalCostInr / entryRate : null;
  const line = (k, v) => `<div class="leg-line"><span class="k">${k}</span><span class="v">${v}</span></div>`;

  const buyBody =
    line(`${c1} bought`, `${fmtAdaptive(l.trbQty)} ${c1}`) +
    (usdtInBuy != null ? line('Paid (USDT)', `${fmtAdaptive(usdtInBuy)} USDT · ${fmtInr(l.finalCostInr, 2)}`)
                       : line('Cost (incl. fees)', fmtInr(l.finalCostInr, 2))) +
    (entryRate ? line('USDT/INR rate used', `₹${fmtNum(entryRate, 2)}`) : '') +
    line(`${c1} transfer fee`, loopXferFee(l.trbFeeQty, l.trbTransferChargeInr, c1));

  const sellUsdtBody =
    loopTouchedRows(`Sell ${c2}`, l.sellGALATouched, c2) +
    line('INR received (net)', fmtInr(l.inrReceived, 2));

  if (loopIsStableCashout(entry)) {
    const sellC1Body =
      loopTouchedRows(`Sell ${c1}`, l.sellTRBTouched, c1) +
      line('USDT received', `${fmtAdaptive(l.usdtFromTRB)} USDT`);
    return [buyBody, sellC1Body, sellUsdtBody];
  }
  const convertBody =
    line(`Sell ${c1} → USDT`, `${fmtAdaptive(l.usdtFromTRB)} USDT`) +
    loopTouchedRows(`Sell ${c1}`, l.sellTRBTouched, c1) +
    line(`Buy ${c2} with USDT`, `${fmtAdaptive(l.galaQty)} ${c2}`) +
    loopTouchedRows(`Buy ${c2}`, l.buyGALATouched, c2);
  return [buyBody, convertBody, sellUsdtBody];
}

function loopRateNoteHtml(entry) {
  const c1 = entry.coin1.toUpperCase(), c2 = entry.coin2.toUpperCase();
  const u = entry.usdtInrUsed || {};
  // Support both shapes: {rate,source} (build 45+) and a bare number (older).
  const rateVal = x => (x && typeof x === 'object') ? x.rate : x;
  const rateSrc = x => (x && typeof x === 'object' && x.source) ? x.source : null;
  const srcTag = x => { const s = rateSrc(x); return s ? ` <span style="opacity:.7;">(${s === 'wazirx' ? 'WazirX book' : s})</span>` : ''; };
  const vn = cardVenueName();
  const rateBits = [];
  if (u.entry != null) rateBits.push(`buying ${c1} via ${vn} ${c1}/USDT → USDT/INR <b>₹${fmtNum(rateVal(u.entry), 2)}</b>${srcTag(u.entry)}`);
  if (u.exit != null)  rateBits.push(`selling ${c2} via ${vn} ${c2}/USDT → USDT/INR <b>₹${fmtNum(rateVal(u.exit), 2)}</b>${srcTag(u.exit)}`);
  return rateBits.length
    ? `<div style="margin-top:10px; padding:9px 12px; background:#eef6ff; border:1px solid #cfe3f7; border-radius:8px; font-size:12.5px; color:#345;">
         <b>${vn} USDT/INR used:</b> ${rateBits.join(' &nbsp;·&nbsp; ')}
       </div>`
    : '';
}

// Request 3: show the 1st Level Arb (buy c1 half) and 2nd Level Arb (sell c2
// half) percentages individually inside Track Live — same split as the loop
// card — so you can see which leg carries the edge. Updated live with the book.
function loopLevelSectionHtml(entry) {
  if (!entry.levels) return '';
  return `<div class="ob-section-title" style="margin-top:14px;">Arbitrage by level</div>${levelArbHtml(entry)}`;
}

function loopFeeBodyHtml(l, c1, c2, entry) {

        <div class="leg-line"><span class="k">${c1} bought (${cardVenueName()})</span><span class="v">${fmtCoin(l.trbQty,2)} ${c1}</span></div>
        <div class="leg-line"><span class="k">Final cost</span><span class="v">${fmtInr(l.finalCostInr,2)}</span></div>

function loopObSectionHtml(entry) {
  if (entry.liveBooks && entry.liveBooks.legs) {
    // Overall arb negative → the trade has slipped/been taken; drop the
    // red/green "% consumed" bars and their legend (they imply a live trade
    // that no longer exists) and just show the plain book.
    const overall = entry.walked ? entry.walked.profit
                   : (entry.roughPct != null ? entry.roughPct : null);
    const negative = overall != null && overall < 0;
    const showBars = !negative;
    const header = showBars
      ? `<div class="ob-legend" style="margin-top:14px;">
           <div class="ob-legend-item"><span class="ob-swatch" style="background:var(--ask-bg); border:1px solid #f4c2c2;"></span><span class="ob-bar-icon" style="background:var(--danger);"></span>Asks — % consumed by this loop</div>
           <div class="ob-legend-item"><span class="ob-swatch" style="background:var(--bid-bg); border:1px solid #b7e6da;"></span><span class="ob-bar-icon" style="background:var(--success);"></span>Bids — % consumed by this loop</div>
         </div>`
      : `<div class="note-box" style="margin-top:14px;">Overall arbitrage is negative right now — the trade has slipped, so the plain order book is shown (no consumption bars).</div>`;
    return `${header}
         <div class="ob-section-title">Order Book <span style="font-weight:500; font-size:11px; color:var(--gray-500);">· live · updates every 3s</span></div>
         ${loopOrderBookTable(entry.liveBooks.legs, { showBars, levels: entry.levels })}`;
  }
  return loopLiveError
    ? `<div class="banner-error">Order book depth unavailable (${loopLiveError}). If the backend hasn't been redeployed with the loop live endpoint yet, deploy the updated server.js and src/compute.js first — depth appears automatically once it's live.</div>`
    : `<div class="modal-note">Loading order book depth…</div>`;
}

function renderLoopModal() {
  const entry = loopLiveEntry || findOpportunity(openCard);
  if (!entry) {
    document.getElementById('modalBody').innerHTML = loopLiveError
      ? `<div class="banner-error">Couldn't load this loop (${loopLiveError}). Retrying every 3s.</div>`
      : `<div class="modal-note">Loading…</div>`;
    return;
  }
  const c1 = entry.coin1.toUpperCase(), c2 = entry.coin2.toUpperCase();
  document.getElementById('modalTitle').textContent = `${c1} → ${c2} — Loop Arbitrage`;
  document.getElementById('modalStatus').innerHTML = modalVolumeToggleHtml() + `order book updates live every 3s · <a href="#" onclick="refreshLoopModalLive(); return false;" style="color:var(--accent);">refresh now</a>`;

  if (!withVolume || !entry.walked) {
    const legsEarly = entry.liveBooks && entry.liveBooks.legs;

    // Use whichever spread number is present so this never crashes.
    const loopPct = entry.roughPct != null ? entry.roughPct

    document.getElementById('modalBody').innerHTML = `
      <div class="note-box">Volume is OFF — spread below is top-of-book only, no depth walked.</div>
      <div class="profit-box ${(loopPct ?? 0) < 0 ? 'negative' : ''}">

        <div class="profit-sub">raw two-leg spread, fees not applied</div>
      </div>
      <div id="loopObSlot">${legsEarly ? `<div class="ob-section-title" style="margin-top:14px;">Order Book</div>${loopOrderBookTable(legsEarly, { showBars: (loopPct ?? 0) >= 0, levels: entry.levels })}` : '<div class="modal-note">Loading order book depth…</div>'}</div>`;
    return;
  }

  const l = entry.walked;
  document.getElementById('modalBody').innerHTML = `
    <div class="summary-box">
      <div class="title">Loop Arbitrage Summary</div>
      <div class="summary-grid">
        <div><div class="lab">Net Profit</div><div class="val" id="loopSumProfit" style="color:var(--success);">${fmtInr(l.profit,2)}</div></div>
        <div><div class="lab">ROI</div><div class="val" id="loopSumRoi" style="color:var(--success);">${l.profitPct.toFixed(2)}%</div></div>
        <div><div class="lab">Exec Time</div><div class="val" id="loopSumExec">${entry.executionMin.toFixed(2)} min</div></div>
      </div>
    </div>
    <div id="loopRateNote">${loopRateNoteHtml(entry)}</div>

    ${(() => {
      const lab = loopLegLabels(entry), bod = loopLegBodies(entry, l), collapsed = loopCollapsedLeg(entry);
      return lab.map((label, i) => `
    <details class="leg-detail"${i === 0 ? ' style="margin-top:12px;"' : ''}${i === collapsed ? '' : ' open'}>
      <summary><div class="leg-summary-left"><div class="leg-amount">${label}</div></div><div></div></summary>
      <div class="leg-detail-body" id="loopLeg${i+1}Body">${bod[i]}</div>
    </details>`).join('');
    })()}

    <details class="leg-detail">
      <summary><div class="leg-summary-left"><div class="leg-amount">Full fee breakdown</div></div><div></div></summary>
      <div class="leg-detail-body" id="loopFeeBody">${loopFeeBodyHtml(l, c1, c2, entry)}</div>
    </details>

    <div id="loopObSlot">${loopObSectionHtml(entry)}</div>
  `;
}

// Request 4: refresh ONLY the numbers, level split, leg tables and order book
// in place, so the modal never fully redraws while open (no flicker, no scroll
// jump, open <details> stay open). Falls back to a full render if the expected
// volume-ON structure isn't there yet (e.g. volume was OFF, walk just arrived).
function updateLoopModalLive(entry) {
  const slot = document.getElementById('loopObSlot');
  const sumP = document.getElementById('loopSumProfit');
  if (!slot || !sumP || !withVolume || !entry.walked) { renderLoopModal(); return; }
  const c1 = entry.coin1.toUpperCase(), c2 = entry.coin2.toUpperCase();
  const l = entry.walked;
  sumP.textContent = fmtInr(l.profit,2);
  const roi = document.getElementById('loopSumRoi'); if (roi) roi.textContent = l.profitPct.toFixed(2) + '%';
  const ex  = document.getElementById('loopSumExec'); if (ex) ex.textContent = entry.executionMin.toFixed(2) + ' min';
  const rn  = document.getElementById('loopRateNote'); if (rn) rn.innerHTML = loopRateNoteHtml(entry);
  const bod = loopLegBodies(entry, l);
  bod.forEach((h, i) => { const el = document.getElementById(`loopLeg${i + 1}Body`); if (el) el.innerHTML = h; });
  const fb  = document.getElementById('loopFeeBody'); if (fb) fb.innerHTML = loopFeeBodyHtml(l, c1, c2, entry);
  slot.innerHTML = loopObSectionHtml(entry);
}

let loopLiveEntry = null;   // last successful response from the loop live endpoint
let loopLiveError = null;

async function fetchLoopLive(coin1, coin2, entryVenue, exitVenue) {
  const qs = new URLSearchParams();
  if (entryVenue) qs.set('entry', entryVenue);
  if (exitVenue) qs.set('exit', exitVenue);
  const q = qs.toString();
  const loopPath = (openCard && openCard.venueApi)
    ? `${openCard.venueApi}/loop/${coin1}/${coin2}/live`
    : `/api/opportunities/loop/${coin1}/${coin2}/live`;
  const res = await fetch(`${API_BASE}${loopPath}${q ? '?' + q : ''}`);
  if (!res.ok) {
    let reason = `API returned ${res.status}`;
    try { const body = await res.json(); if (body.error) reason = body.error; } catch (e) {}
    throw new Error(reason);
  }
  return res.json();
}

async function refreshLoopModalLive() {
  if (!openCard || openCard.type !== 'loop') return;
  if (!document.getElementById('loopObSlot')) renderLoopModal(); // first paint builds the shell
  try {
    const data = await fetchLoopLive(openCard.coin1, openCard.coin2, openCard.entryVenue, openCard.exitVenue);
    loopLiveEntry = data.opportunity;
    loopLiveError = null;
    liveCache[`${cachePfx()}loop:${openCard.coin1}:${openCard.coin2}:${openCard.entryVenue}:${openCard.exitVenue}`] = data.opportunity;
  } catch (err) {
    loopLiveError = err.message;
    // keep the last good entry so the book doesn't vanish on a transient failure
  }
  if (!openCard || openCard.type !== 'loop') return;
  const entry = loopLiveEntry || findOpportunity(openCard);
  if (entry && document.getElementById('loopObSlot')) updateLoopModalLive(entry);
  else renderLoopModal();
}

let intraLoopLiveEntry = null;
let intraLoopLiveError = null;

async function fetchIntraLoopLive(coin) {
  const intraPath = (openCard && openCard.venueApi)
    ? `${openCard.venueApi}/intraloop/${coin}/live`
    : `/api/opportunities/intraloop/${coin}/live`;
  const res = await fetch(`${API_BASE}${intraPath}`);
  if (!res.ok) {
    let reason = `API returned ${res.status}`;
    try { const body = await res.json(); if (body.error) reason = body.error; } catch (e) {}
    throw new Error(reason);
  }
  return res.json();
}

function renderIntraLoopModal() {
  const coin = (openCard.coin || '').toUpperCase();
  document.getElementById('modalTitle').textContent = `${coin} — Intra Loop (${cardVenueName()} triangle)`;
  document.getElementById('modalStatus').innerHTML = `refreshes every 3s while open · <a href="#" onclick="refreshIntraLoopModalLive(); return false;" style="color:var(--accent);">refresh now</a>`;
  const entry = intraLoopLiveEntry;
  if (!entry) {
    document.getElementById('modalBody').innerHTML = intraLoopLiveError
      ? `<div class="banner-error">Couldn't load this triangle (${intraLoopLiveError}). Retrying every 15s.</div>`
      : `<div class="modal-note">Loading…</div>`;
    return;
  }
  const opps = entry.opportunities || [];
  const legs = entry.liveBooks && entry.liveBooks.legs;
  // Same rule as Loop: if no triangle direction is positive, the trade has
  // slipped — show the plain book without the red/green consumption bars.
  const intraShowBars = opps.some(op => (op.walked ? op.walked.profit : op.roughPct) > 0);
  const pathHtml = opps.length ? opps.map(op => {
    const l = op.walked;
    const p = l ? l.profitPct : op.roughPct;
    return `<div class="profit-box ${(p ?? 0) < 0 ? 'negative' : ''}" style="flex-direction:column; align-items:flex-start; gap:2px;">
      <div class="profit-pct">${p != null ? p.toFixed(2) + '%' : '—'}${l ? ` (${fmtInr(l.profit,2)})` : ''}</div>
      <div class="profit-sub">${op.pathLabel || ''}${l ? ` · max ${fmtCoin(l.qty,2)} ${coin} at top-of-book` : ''}</div>
    </div>`;
  }).join('') : `<div class="modal-note">No computable triangle right now (thin ${cardVenueName()} book).</div>`;
  document.getElementById('modalBody').innerHTML = `
    <div class="note-box">Same-exchange ${cardVenueName()} triangle — top-of-book, instant, no transfers. The three books below are the markets it routes through.</div>
    ${pathHtml}
    ${legs ? `${intraShowBars
         ? `<div class="ob-legend" style="margin-top:14px;">
         <div class="ob-legend-item"><span class="ob-swatch" style="background:var(--ask-bg); border:1px solid #f4c2c2;"></span><span class="ob-bar-icon" style="background:var(--danger);"></span>Asks — % consumed by this loop</div>
         <div class="ob-legend-item"><span class="ob-swatch" style="background:var(--bid-bg); border:1px solid #b7e6da;"></span><span class="ob-bar-icon" style="background:var(--success);"></span>Bids — % consumed by this loop</div>
       </div>`
         : `<div class="note-box" style="margin-top:14px;">Triangle is negative right now — showing the plain order book (no consumption bars).</div>`}
       <div class="ob-section-title">Order Book</div>${loopOrderBookTable(legs, { showBars: intraShowBars })}` : '<div class="modal-note">Loading order book depth…</div>'}
  `;
}

async function refreshIntraLoopModalLive() {
  if (!openCard || openCard.type !== 'intraloop') return;
  renderIntraLoopModal(); // show what we have immediately
  try {
    const data = await fetchIntraLoopLive(openCard.coin);
    intraLoopLiveEntry = data.view;
    intraLoopLiveError = null;
    liveCache[`${cachePfx()}intraloop:${openCard.coin}`] = data.view;
  } catch (err) {
    intraLoopLiveError = err.message;
    intraLoopLiveEntry = null;
  }
  if (openCard) renderIntraLoopModal();
}

async function saveGiottusAlert() {
  const name = document.getElementById('gafName').value.trim();
  if (!name) { document.getElementById('gafError').textContent = 'Alert name is required.'; return; }
  const minProfit = parseFloat(document.getElementById('gafMinProfit').value);
  if (isNaN(minProfit)) { document.getElementById('gafError').textContent = 'Min profit ₹ must be a number.'; return; }
  const minPctRaw = document.getElementById('gafMinPct').value.trim();
  const minPct = minPctRaw === '' ? null : parseFloat(minPctRaw);
  const enabledEl = document.getElementById('gafEnabled');
  const body = {
    name, type: 'arbitrage', kind: 'giottus', direction: null, wallets: 'any',
    frequency: document.querySelector('input[name=gafFreq]:checked').value,
    coin: null,
    cooldown_min: parseInt(document.getElementById('gafCooldown').value) || 30,
    threshold_inr: minProfit,
    threshold_pct: (minPct != null && !isNaN(minPct)) ? minPct : null,
    enabled: enabledEl ? enabledEl.checked : true,
    config: {
      routeKind: document.querySelector('input[name=gafKind]:checked').value,
      persistChecks: parseInt(document.getElementById('gafPersist').value) || 2,
      maxPerHour: parseInt(document.getElementById('gafMaxHour').value) || 6,
      coins: parseCoinList(document.getElementById('gafCoins').value),
      excludeCoins: parseCoinList(document.getElementById('gafExclude').value)
    }
  };
  try {
    const url = editingAlert ? `${API_BASE}/api/alerts/${editingAlert.id}` : `${API_BASE}/api/alerts`;
    const res = await fetch(url, { method: editingAlert ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error(`API returned ${res.status}`);
    closeModal();
    await loadAlerts();
  } catch (err) {
    document.getElementById('gafError').textContent = `Couldn't save (${err.message}).`;
  }
}

async function saveAlert() {
  const name = document.getElementById('afName').value.trim();
  if (!name) { document.getElementById('afError').textContent = 'Alert name is required.'; return; }
  const trig = document.querySelector('input[name=afTrig]:checked').value;
  const threshold = parseFloat(document.getElementById('afThreshold').value);
  if (isNaN(threshold)) { document.getElementById('afError').textContent = 'Threshold must be a number (negative is fine).'; return; }
  // Optional min profit ₹ that ALSO must be met (only meaningful alongside a % trigger).
  const minProfitRaw = (document.getElementById('afMinProfitInr') || {}).value;
  const hasMinProfit = minProfitRaw != null && String(minProfitRaw).trim() !== '';
  const afMinProfitInr = hasMinProfit ? parseFloat(minProfitRaw) : null;
  if (hasMinProfit && isNaN(afMinProfitInr)) { document.getElementById('afError').textContent = 'Min profit ₹ must be a number (or blank).'; return; }
  const enabledEl = document.getElementById('afEnabled');
  const body = {
    name,
    type: 'arbitrage',
    kind: creatingKind,
    wallets: document.querySelector('input[name=afWal]:checked').value,
    frequency: document.querySelector('input[name=afFreq]:checked').value,
    direction: (() => {
      if (creatingKind === 'futures') return null; // direction is auto (long cheap / short rich)
      if (creatingKind === 'direct') {
        const from = document.getElementById('afFrom').value, to = document.getElementById('afTo').value;
        return (from && to && from !== to) ? `${from}_to_${to}` : null;
      }
      if (creatingKind === 'loop') {
        return `${document.getElementById('afLoopEx').value}_via_${document.getElementById('afViaEx').value}`;
      }
      return `intra_${document.getElementById('afIntraEx').value}`;
    })(),
    coin: null, // superseded by config.coins (multi); kept for API compatibility
    cooldown_min: parseInt(document.getElementById('afCooldown').value) || 5,
    threshold_pct: trig === 'percentage' ? threshold : null,
    // % trigger + optional ₹ floor (both stored → backend ANDs them, same as Giottus).
    // Profit trigger: the ₹ IS the threshold, so the extra field doesn't apply.
    threshold_inr: trig === 'profit' ? threshold : (trig === 'percentage' ? afMinProfitInr : null),
    enabled: enabledEl ? enabledEl.checked : true,
    config: {
      venue: creatingVenue, // routes this alert to the matching engine (wazirx / zebpay)
      coins: parseCoinList(document.getElementById('afCoins').value),
      excludeCoins: parseCoinList(document.getElementById('afExclude').value),
      volumeMode: document.querySelector('input[name=afVol]:checked').value,
      market: creatingKind === 'direct' ? document.querySelector('input[name=afMkt]:checked').value : 'any'
    }
  };
  try {
    const url = editingAlert ? `${API_BASE}/api/alerts/${editingAlert.id}` : `${API_BASE}/api/alerts`;
    const res = await fetch(url, {
      method: editingAlert ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(`API returned ${res.status}`);
    closeModal();
    await loadAlerts();
  } catch (err) {
    document.getElementById('afError').textContent = `Couldn't save (${err.message}).`;
  }
}

async function deleteAlert(id) {
  const a = alertsList.find(x => x.id === id);
  if (!confirm(`Delete alert "${a ? a.name : id}"? This can't be undone.`)) return;
  try {
    const res = await fetch(`${API_BASE}/api/alerts/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error(`API returned ${res.status}`);
    await loadAlerts();
  } catch (err) {
    setBanner(`Couldn't delete alert (${err.message}).`);
  }
}

// ORDERBOOK PAGE — pick a coin, see its live books (both direct combos)
// with the same KoinKnight asks/spread/bids layout, refreshed every 15s
// while the page is open.
// ================================================================
let obSelections = [];      // [{exchange, coin}]
let obBooks = {};           // key 'exchange:coin' -> book | {error}
let orderbookTimer = null;

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'obCoinInput') addObSelection();
});

function addObSelection() {
  const exchange = document.getElementById('obExchangeSelect').value;
  const coin = document.getElementById('obCoinInput').value.trim().toLowerCase();
  if (!coin) return;
  if (obSelections.some(s => s.exchange === exchange && s.coin === coin)) return; // no dupes
  obSelections.push({ exchange, coin });
  renderToolbar();
  renderOrderbookPage();
  refreshOrderbook();
}

function removeObSelection(i) {
  const s = obSelections.splice(i, 1)[0];
  if (s) delete obBooks[`${s.exchange}:${s.coin}`];
  renderToolbar();
  renderOrderbookPage();
}

async function refreshOrderbook() {
  if (currentPage !== 'orderbook' || !obSelections.length) return;
  await Promise.all(obSelections.map(async s => {
    const key = `${s.exchange}:${s.coin}`;
    try {
      const res = await fetch(`${API_BASE}/api/orderbook/${s.exchange}/${s.coin}`);
      if (!res.ok) {
        let reason = `API returned ${res.status}`;
        try { const b = await res.json(); if (b.error) reason = b.error; } catch (e) {}
        throw new Error(reason);
      }
      obBooks[key] = await res.json();
    } catch (err) {
      obBooks[key] = { error: err.message };
    }
  }));
  if (currentPage === 'orderbook') renderOrderbookPage();
}

// Single-market two-sided table: asks (worst→best) on top, real spread row,
// bids (best→worst) below — the per-market view from KoinKnight's
// Orderbook page.
function singleMarketBookTable(b) {
  b = { ...b, asks: obCut(b.asks), bids: obCut(b.bids) };
  const askRows = [...b.asks].reverse().map(l => `<tr class="kk-ask-row">${kkObCellPair(l, '--danger', b.currency)}</tr>`).join('');
  const bidRows = b.bids.map(l => `<tr class="kk-bid-row">${kkObCellPair(l, '--success', b.currency)}</tr>`).join('');
  const spread = (b.asks[0] && b.bids[0]) ? fmtAdaptive(b.asks[0].price - b.bids[0].price) : '—';
  return `
    <table class="ob-table">
      <thead><tr><th>Size</th><th>Price (${b.currency})</th></tr></thead>
      <tbody>
        ${askRows}
        <tr class="kk-spread-row"><td class="kk-spread-label">Spread</td><td>${spread}</td></tr>
        ${bidRows}
      </tbody>
    </table>`;
}

function renderOrderbookPage() {
  const el = document.getElementById('cardList');
  if (!obSelections.length) {
    el.innerHTML = `<div class="empty-state"><span class="emoji">📖</span>Pick an exchange, type a coin, and press Compare — each selection renders its live two-sided book below. Add several to compare side by side.</div>`;
    return;
  }
  el.innerHTML = obSelections.map(s => {
    const b = obBooks[`${s.exchange}:${s.coin}`];
    let body;
    if (!b) body = `<div class="modal-note">Loading…</div>`;
    else if (b.error) body = `<div class="banner-error">${b.error}${b.error.includes('404') || b.error.includes('not tracked') ? '' : ' — if the backend hasn\'t been redeployed with the orderbook endpoint, deploy the updated server.js first.'}</div>`;
    else body = `
      ${b.fresh === false ? `<div class="banner-error">This feed looks stale — prices may be out of date.</div>` : ''}
      ${singleMarketBookTable(b)}`;
    return `
      <div class="card" style="padding:14px;">
        <div class="ob-section-title" style="margin-bottom:8px;">${exLabel(s.exchange)} — ${s.coin.toUpperCase()}${b && b.market ? ` <span style="font-weight:400; color:var(--gray-500);">(${b.market})</span>` : ''}</div>
        ${body}
      </div>`;
  }).join('');
}
