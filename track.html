          + (pump.distrib?'<div style="font-size:11px;color:'+RSC.dn+';margin-top:4px;">⚠️ Distribution: heavy volume, long upper wicks — someone large is selling into strength.</div>':'')
          + (pump.ext!=null&&Math.abs(pump.ext)>2.5?'<div style="font-size:11px;color:'+RSC.dn+';margin-top:4px;">⚠️ Overextended '+Math.abs(pump.ext).toFixed(1)+' ATRs — chasing here is buying someone’s exit.</div>':''), RSC.org);
      }

      // ================= CROWD PSYCHOLOGY =================
      var fng = (R.fng&&R.fng[0])?+R.fng[0].value:null;
      var fund = (R.perp&&R.perp.prem)?+R.perp.prem.lastFundingRate*100:null;
      var ls = (R.ls&&R.ls.length)?+R.ls[R.ls.length-1].longShortRatio:null;
      var tk = (R.taker&&R.taker.length)?+R.taker[R.taker.length-1].buySellRatio:null;
      var psy = rsTitle('Crowd psychology',RSC.vio)
        + '<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;">';
      if (fng!=null) psy += '<div style="text-align:center;">'+rsDial(fng,(R.fng[0].value_classification||''))+'<div style="font-size:9.5px;color:'+RSC.mut+';">market mood</div></div>';
      psy += '<div style="flex:1;min-width:200px;">';
      if (fund!=null) psy += rsTug(Math.max(-1,Math.min(1,fund/0.08)),'shorts pay','longs pay',(fund>=0?'+':'')+fund.toFixed(3)+'%',fund>0.05?RSC.amb:fund<-0.05?RSC.cyn:RSC.ink);
      if (ls!=null) psy += rsTug(Math.max(-1,Math.min(1,(ls-1))),'shorts','longs',ls.toFixed(2)+' : 1',ls>2?RSC.amb:RSC.ink);
      if (tk!=null) psy += rsTug(Math.max(-1,Math.min(1,(tk-1)/0.3)),'sellers','buyers',tk.toFixed(2),tk>1.15||tk<0.87?RSC.amb:RSC.ink);
      psy += '</div></div>';
      var readLine=[];
      if (fund!=null&&fund>0.05) readLine.push('Longs are paying to stay — greed with a bill; crowded-long is squeeze-DOWN fuel.');
      else if (fund!=null&&fund<-0.05) readLine.push('Shorts are paying — fear is crowded; squeeze-UP fuel.');
      if (ls!=null&&ls>2) readLine.push('The boat is '+ls.toFixed(1)+':1 long — markets punish the crowded side first.');
      if (fng!=null&&fng>=75) readLine.push('Extreme greed forgives nothing.'); else if (fng!=null&&fng<=25) readLine.push('Extreme fear is where bottoms get built — slowly.');
      if (readLine.length) psy += '<div style="font-size:11px;color:'+RSC.sub+';margin-top:8px;line-height:1.5;">'+readLine.join(' ')+'</div>';
      html += rsCard(psy, RSC.vio);

      // ================= BTC TIDE + LEVELS + NEWS =================
      var btc = E.btc;
      if (btc && btc.lines.length) html += rsCard(rsTitle('The tide — BTC',RSC.amb)+'<div style="font-size:11.5px;line-height:1.6;color:'+RSC.ink+';">'+btc.lines.join('<br>')+'</div>', RSC.amb);
      if (S1) { var sw1=rsSwings(S1.h,S1.l);
        html += rsCard(rsTitle('Key levels',RSC.cyn)
          + '<div style="font-size:11.5px;line-height:1.7;"><span style="color:'+RSC.dn+';font-weight:700;">Resistance</span> '+(sw1.res.length?sw1.res.slice(0,4).sort(function(a,b){return a-b;}).map(function(x){return '$'+rsNum(x);}).join(' · '):'—')
          + '<br><span style="color:'+RSC.up+';font-weight:700;">Support</span> '+(sw1.sup.length?sw1.sup.slice(0,4).sort(function(a,b){return b-a;}).map(function(x){return '$'+rsNum(x);}).join(' · '):'—')+'</div>', RSC.cyn);
      }
      var nl=function(u,t){ return '<a href="'+u+'" target="_blank" rel="noopener" style="color:'+RSC.cyn+';font-weight:700;text-decoration:none;">'+t+'</a>'; };
      html += rsCard(rsTitle('News — check before entering','#facc15')
        + '<div style="font-size:12px;line-height:1.9;">'+nl('https://news.google.com/search?q='+coin+'%20crypto','Google News')+' · '+nl('https://x.com/search?q=%24'+coin,'X ($'+coin+')')+' · '+nl('https://www.binance.com/en/square/search?q='+coin,'Binance Square')
        + (R.cgId?' · '+nl('https://www.coingecko.com/en/coins/'+R.cgId,'CoinGecko'):'')+' · '+nl('https://www.tradingview.com/symbols/'+coin+'USDT/','TradingView')+'</div>'
        + '<div style="font-size:10px;color:'+RSC.mut+';margin-top:5px;">One headline (listing, delist, hack, unlock) outweighs everything above. If news fights the plan, the news wins.</div>', '#facc15');
      html += '<div style="grid-column:1/-1;font-size:10.5px;color:'+RSC.mut+';text-align:center;padding:6px;">Live read '+new Date(R.at).toLocaleTimeString()+' — tap Research to refresh · measured probabilities, never guarantees · the stop is the trade.</div>';
      el.innerHTML = html;
    }

    // ================================================================
    // MY COINS — the trading-buddy tab. Log what you bought (coin, buy
    // price in USDT, quantity); while this page is open the same engine
    // that produced the research re-reads every holding on a 2-minute
    // cycle and gives ONE of four words, with the reason:
    //   SELL NOW      — structure broke against you; the market changed
    //   TAKE PROFIT   — you're up and the move shows exhaustion; bank some
    //   ADD THE DIP   — trend intact, price pulled back to value, crowd sane
    //   HOLD          — nothing changed; sit still (hardest, most profitable)
    // The ⚠️ on the sub-tab lights from any tab of the Futures page the
    // moment a holding turns urgent.
    //
    // HONEST LIMIT, stated once: this is a page, not a server. It watches
    // while the site is open; a closed phone is not watched. Positions
    // live in THIS browser's storage — they are private and never leave
    // the device, which also means another device has its own list.
    // ================================================================
    var HC_LS = 'swenik-holdings-v1', HC_EVAL_MS = 120000;
    var hcState = {};   // coin -> { px, pnlPct, verdict, why, stopLine, at }
    var hcBusy = false;
    // ---- server sync: the DigitalOcean watcher keeps checking after the
    // phone is closed and drops verdict changes into Notifications (48h
    // auto-clean). Auth = the lock passcode this device saved at unlock;
    // the server holds only the fingerprint. If the server isn't enabled
    // or reachable, everything below still works purely on-device. ----
    var hcSrv = { on: null };   // true / false / null(unknown)
    function hcKeyHdr() {
      try { var k = localStorage.getItem('swenik-app-key'); return k ? { 'x-swenik-key': k } : null; } catch (e) { return null; }
    }
    function hcSync() {
      var h = hcKeyHdr();
      if (!h || typeof API_BASE !== 'string') { hcSrv.on = false; return; }
      fetch(API_BASE + '/api/holdings', { headers: h }).then(function (r) {
        if (r.status === 503 || r.status === 401) { hcSrv.on = false; hcRender(); return null; }
        return r.ok ? r.json() : null;
      }).then(function (d) {
        if (!d || !d.holdings) return;
        hcSrv.on = true;
        // server is the master list — adds/removes from any device converge
        var l = d.holdings.map(function (r) {
          var st = r.last_state || null;
          if (st && typeof st === 'string') { try { st = JSON.parse(st); } catch (e) { st = null; } }
          if (st && st.verdict) hcState[String(r.coin) + '@' + Number(r.buy_price)] = {
            px: st.px, pnlPct: st.pnlPct, verdict: st.verdict, why: st.why,
            stopLine: 'Exit line: 1h close below $' + st.stop,
            at: new Date(r.checked_at || Date.now()).getTime(), srv: true
          };
          return { coin: r.coin, buy: Number(r.buy_price), qty: Number(r.qty), added: new Date(r.added_at).getTime(), srvId: r.id };
        });
        hcSave(l); hcRender();
      }).catch(function () {});
    }
    function hcSrvAdd(h) {
      var hd = hcKeyHdr(); if (!hd || typeof API_BASE !== 'string') return;
      hd['Content-Type'] = 'application/json';
      fetch(API_BASE + '/api/holdings', { method: 'POST', headers: hd, body: JSON.stringify({ coin: h.coin, buy: h.buy, qty: h.qty }) })
        .then(function (r) { if (r.ok) hcSync(); }).catch(function () {});
    }
    function hcSrvDel(h) {
      var hd = hcKeyHdr(); if (!hd || !h.srvId || typeof API_BASE !== 'string') return;
      fetch(API_BASE + '/api/holdings/' + h.srvId, { method: 'DELETE', headers: hd }).catch(function () {});
    }
    function hcList() {
      try { return JSON.parse(localStorage.getItem(HC_LS) || '[]'); } catch (e) { return []; }
    }
    function hcSave(l) { try { localStorage.setItem(HC_LS, JSON.stringify(l)); } catch (e) {} }
    function hcUrgent() {
      for (var k in hcState) if (hcState[k] && hcState[k].verdict === 'SELL NOW') return true;
      return false;
    }

    // The verdict. Direction is LONG by definition (he bought the coin).
    function hcJudge(h, S15, S1, S4) {
      var i15 = S15.c.length - 1, i1 = S1.c.length - 1, i4 = S4 ? S4.c.length - 1 : null;
      var px = S15.c[i15];
      var pnl = (px - h.buy) / h.buy * 100;
      var v15 = rsVotes(S15, i15).score, v1 = rsVotes(S1, i1).score, v4 = S4 ? rsVotes(S4, i4).score : 0;
      var sw = rsSwings(S1.h, S1.l);
      var sup = sw.sup.filter(function (x) { return x < px; }).sort(function (a, b) { return b - a; })[0];
      var atr1 = S1.atr[i1] || px * 0.02;
      var stop = sup != null ? sup - 0.5 * atr1 : px - 2 * atr1;
      var ext = S1.atr[i1] ? (px - S1.e20[i1]) / S1.atr[i1] : 0;
      var rsi15 = S15.rsi[i15];
      var out = { px: px, pnlPct: pnl, stop: stop, at: Date.now() };
      // SELL NOW — the market has changed against the position. Thresholds
      // are set for how downtrends actually score: oscillators go "oversold"
      // all the way down and partially offset the trend votes, so a real
      // waterfall reads about -1.5 to -3, not the theoretical minimum.
      if (v4 <= -1.5 && v1 <= -1) {
        out.verdict = 'SELL NOW';
        out.why = 'The 4h trend has broken down (score ' + v4.toFixed(1) + ') and the 1h agrees — this is no longer the market you bought. ' + (pnl >= 0 ? 'You still have profit: take it.' : 'Cutting here is cheaper than hoping.');
      } else if (sup == null && v1 <= -1.25 && v4 < 0) {
        // every recent swing low is ABOVE the current price — it is falling
        // through air with nothing left underneath to lean on
        out.verdict = 'SELL NOW';
        out.why = 'Price is below every recent 1h support with momentum against you — there is no floor under this. Structure gone.';
      } else if (px < stop && v1 < 0) {
        out.verdict = 'SELL NOW';
        out.why = 'Price has lost its 1h support floor ($' + rsNum(stop) + ') with momentum against you — the structure that justified holding is gone.';
      } else if (pnl <= -10 && v4 < 0 && v1 < 0) {
        out.verdict = 'SELL NOW';
        out.why = 'Down ' + Math.abs(pnl).toFixed(1) + '% with both the 4h and 1h against the position — a deep loss with no trend support is how small losses become big ones.';
      } else if (pnl >= 8 && (ext > 2.5 || (rsi15 != null && rsi15 > 80 && v15 < 0) || (pnl >= 20 && ext > 1.5))) {
        out.verdict = 'TAKE PROFIT';
        out.why = 'Up ' + pnl.toFixed(1) + '% and the move is showing exhaustion (' + (ext > 2.5 ? ext.toFixed(1) + ' ATRs above the 1h mean' : '15m euphoria rolling over') + '). Book at least half — nobody went broke doing that.';
      } else if (v4 >= 1.25 && px <= S1.e20[i1] * 1.005 && px > stop && v15 > -2) {
        out.verdict = 'ADD THE DIP';
        out.why = 'The 4h uptrend is intact (score ' + v4.toFixed(1) + ') and price has pulled back to its 1h value zone — this is the dip the trend has been buying. Adds only count if the stop still protects them.';
      } else {
        out.verdict = 'HOLD';
        out.why = v4 >= 1.25 ? 'Trend intact, nothing broken — sitting still is the trade.'
          : v4 <= -1.25 ? 'Trend is weakening but the floor is holding — tighten your attention, not yet your finger.'
          : 'No strong signal either way — the stop line below is what matters.';
      }
      out.stopLine = 'Exit line: 1h close below $' + rsNum(stop) + (px > stop ? ' (' + ((px - stop) / px * 100).toFixed(1) + '% below current)' : '');
      return out;
    }

    function hcTick(force) {
      if (hcBusy) return;
      if (!force && !(currentPage === 'futures' && bfTab === 'mycoins' && document.visibilityState === 'visible')) return;
      var list = hcList();
      if (!list.length) return;
      hcBusy = true;
      var idx = 0;
      function nextCoin() {
        if (idx >= list.length) { hcBusy = false; hcRender(); try { updateVenueTabCounts(); } catch (e) {} return; }
        var h = list[idx++];
        // FUTURES, per his scope rule ("except the scanner and the basis
        // tabs"). The perp symbol is resolved per coin and its series is
        // rescaled to coin units so h.buy compares like-for-like. Caveat he
        // accepted with the rule: the P&L is now measured against the perp
        // price, which sits a basis away from any spot venue he bought on.
        rsPerpSym(h.coin).then(function (p) {
          if (!p) throw new Error('no USDT-M perpetual for ' + h.coin);
          var mult = rsPerpMult(h.coin, p.sym);
          return Promise.all([
            rsPerpKl(p.sym, mult, '15m'),
            rsPerpKl(p.sym, mult, '1h'),
            rsPerpKl(p.sym, mult, '4h')
          ]);
        }).then(function (r) {
          hcState[h.coin + '@' + h.buy] = hcJudge(h, rsSeries(r[0]), rsSeries(r[1]), rsSeries(r[2]));
        }).catch(function (e) {
          hcState[h.coin + '@' + h.buy] = { err: e.message, at: Date.now() };
        }).then(function () { setTimeout(nextCoin, 250); }); // gentle spacing
      }
      nextCoin();
    }
    setInterval(function () { try { hcTick(false); } catch (e) {} }, HC_EVAL_MS);

    window.hcAdd = function () {
      var c = String((document.getElementById('hcCoin') || {}).value || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
      var b = parseFloat((document.getElementById('hcBuy') || {}).value);
      var q = parseFloat((document.getElementById('hcQty') || {}).value);
      if (!c || !(b > 0) || !(q > 0)) return;
      var h = { coin: c, buy: b, qty: q, added: Date.now() };
      var l = hcList(); l.push(h);
      hcSave(l); hcRender(); hcTick(true); hcSrvAdd(h);
    };
    window.hcDel = function (i) {
      var l = hcList(); var h = l.splice(i, 1)[0];
      if (h) { delete hcState[h.coin + '@' + h.buy]; hcSrvDel(h); }
      hcSave(l); hcRender();
    };
    window.hcResearch = function (coin) {
      rsCoinLast = coin;
      try { localStorage.setItem('swenik-rs-coin', coin); } catch (e) {}
      bfSetTab('research');
      setTimeout(function () { try { rsGo(); } catch (e) {} }, 80);
    };

    var HC_STYLE = {
      'SELL NOW':    ['#d64545', '#fdf1f0'],
      'TAKE PROFIT': ['#c07f16', '#fdf7ec'],
      'ADD THE DIP': ['#1f9d55', '#eefaf3'],
      'HOLD':        ['#64748b', '#f4f6f9']
    };
    function hcRender() {
      if (currentPage !== 'futures' || bfTab !== 'mycoins') return;
      var el = document.getElementById('cardList');
      if (!el) return;
      var list = hcList();
      var html = bfBar(bfCounts())
        + '<div style="grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">'
        + '<input id="hcCoin" placeholder="Coin" style="width:90px;padding:9px 10px;border:1px solid var(--border,#e2e8f0);border-radius:8px;font-size:13px;text-transform:uppercase;">'
        + '<input id="hcBuy" type="number" step="any" placeholder="Buy price (USDT)" style="width:130px;padding:9px 10px;border:1px solid var(--border,#e2e8f0);border-radius:8px;font-size:13px;">'
        + '<input id="hcQty" type="number" step="any" placeholder="Qty" style="width:90px;padding:9px 10px;border:1px solid var(--border,#e2e8f0);border-radius:8px;font-size:13px;">'
        + '<button onclick="hcAdd()" style="padding:9px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;font-size:13px;">Track it</button>'
        + '</div>';
      if (!list.length) {
        el.innerHTML = html + '<div class="empty-state" style="grid-column:1/-1;"><span class="emoji">👛</span>Nothing tracked yet. After you buy a coin from the Research tab’s plan, log it here — every 2 minutes while this page is open, the same engine re-reads the market and tells you SELL NOW / TAKE PROFIT / ADD THE DIP / HOLD, with the reason. The ⚠️ lights on this tab from anywhere in Futures if something turns urgent.</div>';
        return;
      }
      // portfolio summary
      var inv = 0, cur = 0, missing = 0;
      list.forEach(function (h) {
        inv += h.buy * h.qty;
        var st = hcState[h.coin + '@' + h.buy];
        if (st && st.px) cur += st.px * h.qty; else { cur += h.buy * h.qty; missing++; }
      });
      var pl = cur - inv, plp = inv ? pl / inv * 100 : 0;
      html += '<div style="grid-column:1/-1;background:#fff;border:1.5px solid var(--border,#e2e8f0);border-radius:12px;padding:10px 14px;display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;">'
        + '<span style="font-size:11.5px;color:var(--gray-500,#64748b);">Invested <b style="color:#16202e;">$' + inv.toFixed(2) + '</b></span>'
        + '<span style="font-size:11.5px;color:var(--gray-500,#64748b);">Now <b style="color:#16202e;">$' + cur.toFixed(2) + '</b></span>'
        + '<span style="font-size:14px;font-weight:800;color:' + (pl >= 0 ? 'var(--success,#1f9d55)' : 'var(--danger,#d64545)') + ';">' + (pl >= 0 ? '+' : '') + pl.toFixed(2) + ' (' + rsPct(plp) + ')</span>'
        + (missing ? '<span style="font-size:10.5px;color:var(--gray-500,#64748b);">' + missing + ' awaiting first check…</span>' : '')
        + (hcBusy ? '<span style="font-size:10.5px;color:var(--gray-500,#64748b);">checking…</span>' : '')
        + '</div>';
      list.forEach(function (h, i) {
        var st = hcState[h.coin + '@' + h.buy];
        var inner = '<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;">'
          + '<b style="font-size:15px;">' + h.coin + '</b>'
          + '<span style="font-size:10.5px;color:var(--gray-500,#64748b);">' + h.qty + ' @ $' + rsNum(h.buy) + '</span></div>';
        if (!st) inner += '<div style="font-size:11.5px;color:var(--gray-500,#64748b);margin-top:6px;">⏳ first check queued…</div>';
        else if (st.err) inner += '<div style="font-size:11.5px;color:var(--danger,#d64545);margin-top:6px;">check failed (' + st.err + ') — retries every 2 min</div>';
        else {
          var sty = HC_STYLE[st.verdict] || HC_STYLE.HOLD;
          inner += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;flex-wrap:wrap;gap:6px;">'
            + '<span style="font-size:13px;font-weight:800;">$' + rsNum(st.px) + ' <span style="color:' + (st.pnlPct >= 0 ? 'var(--success,#1f9d55)' : 'var(--danger,#d64545)') + ';">' + rsPct(st.pnlPct) + '</span></span>'
            + '<span style="background:' + sty[1] + ';color:' + sty[0] + ';border:1px solid ' + sty[0] + ';border-radius:6px;padding:2px 10px;font-size:12px;font-weight:800;">' + st.verdict + '</span></div>'
            + '<div style="font-size:11.5px;margin-top:6px;line-height:1.5;">' + st.why + '</div>'
            + '<div style="font-size:11px;color:var(--gray-500,#64748b);margin-top:4px;">' + st.stopLine + '</div>'
            + '<div style="font-size:10px;color:var(--gray-500,#64748b);margin-top:2px;">checked ' + new Date(st.at).toLocaleTimeString() + '</div>';
        }
        inner += '<div style="margin-top:8px;display:flex;gap:8px;">'
          + '<button onclick="hcResearch(\'' + h.coin + '\')" style="padding:6px 12px;border:1px solid var(--border,#e2e8f0);border-radius:6px;background:#fff;font-size:11.5px;font-weight:600;">Full research</button>'
          + '<button onclick="hcDel(' + i + ')" style="padding:6px 12px;border:1px solid #f4c2c2;border-radius:6px;background:#fff;color:var(--danger,#d64545);font-size:11.5px;font-weight:600;">Remove</button>'
          + '</div>';
        var bd = (st && !st.err && HC_STYLE[st.verdict]) ? HC_STYLE[st.verdict][0] : 'var(--border,#e2e8f0)';
        html += '<div style="background:#fff;border:1.5px solid ' + bd + ';border-radius:12px;padding:12px 14px;">' + inner + '</div>';
      });
      html += '<div class="note-box" style="display:block;grid-column:1/-1;">'
        + (hcSrv.on === true ? '<b>Server watcher is ON</b> — your DigitalOcean scanner re-checks these 24/7 even with the phone closed, and posts SELL NOW / TAKE PROFIT / ADD THE DIP changes to the Notifications page (auto-cleans after 48h). This page additionally re-checks every 2 minutes while open. '
           : hcSrv.on === false ? 'Server watcher not enabled — watching only while this page is open. To arm 24/7 watching, set the SWENIK_LOCK_HASH env var on the scanner backend. '
           : 'Checking server watcher\u2026 ')
        + ' SELL NOW means the structure that justified the buy is gone — decide fast, but it is advice, not an order: nothing here trades by itself.</div>';
      el.innerHTML = html;
    }

    // ---- hooks: the engine view gets the sub-tab bar prepended; a basis
    // view replaces the card list entirely. futRefresh already ticks every
    // 10s while (and only while) the Futures page is open — our fetch rides
    // that tick instead of owning a timer, so its lifecycle can't leak. ----
    var _rfp = window.renderFuturesPage;
    window.renderFuturesPage = function () {
      if (bfTab !== 'engine') { bfRender(); return; }
      _rfp.apply(this, arguments);
      try {
        var el = document.getElementById('cardList');
        if (el && el.firstChild && String(el.innerHTML).indexOf('bfSetTab') < 0) {
          el.insertAdjacentHTML('afterbegin', bfBar(bfCounts()));
        }
      } catch (e) {}
    };
    var _fr = window.futRefresh;
    if (typeof _fr === 'function') {
      window.futRefresh = function () {
        var r = _fr.apply(this, arguments);
        try { bfFetch(); } catch (e) {}
        return r;
      };
    }
  } catch (e) {}
})();

</script>
<!-- ==== SIMPLE DEVICE LOCK ====
"a simple lock to the total website when a new device is detected".
Entirely inside this page: no backend change, no env var, nothing to
configure on DigitalOcean. A device that has never entered the
passcode sees only a lock screen; a device that has is remembered in
its own browser storage and never asked again. The passcode is NOT in
this file — only its one-way SHA-256 fingerprint is, so reading this
source does not reveal it. Wrong tries slow down and lock this device
out after 5 in a row. To change the passcode: generate a new
fingerprint with the make-passcode page and swap the HASH line.
IDENTICAL block in index.html and track.html. -->
<script>
(function () {
  var HASH = '85008494962725a5e6c095daf4a19e2c84dacc847d5b30c5285492256907ff53'; // sha256('swenik-lock-v1|' + passcode) — empty string = lock off
  var SALT = 'swenik-lock-v1|';
  var OK_LS = 'swenik-device-ok-v1', FAIL_LS = 'swenik-lock-fails-v1';
  if (!HASH) return;
  try { if (localStorage.getItem(OK_LS) === HASH) return; } catch (e) {} // known device — straight in

  var curtain = document.createElement('div');
  curtain.setAttribute('style', 'position:fixed;inset:0;z-index:2147483647;background:#0d1524;display:flex;align-items:center;justify-content:center;');
  curtain.innerHTML =
    '<div style="width:min(320px,86vw);text-align:center;font-family:system-ui,-apple-system,sans-serif;color:#e8eef7;">' +
    '<div style="font-size:34px;">&#128274;</div>' +
    '<div style="font-weight:700;font-size:16px;margin:8px 0 2px;">Private</div>' +
    '<div id="swkLockMsg" style="font-size:12.5px;color:#94a3b8;min-height:16px;">New device — enter your passcode to continue.</div>' +
    '<input id="swkLockIn" type="password" autocomplete="current-password" placeholder="Passcode" ' +
      'style="margin-top:12px;width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid #2b3a52;background:#111c30;color:#e8eef7;font-size:14px;">' +
    '<button id="swkLockBtn" style="margin-top:10px;width:100%;padding:10px;border-radius:8px;border:0;background:#2563eb;color:#fff;font-weight:700;font-size:14px;">Unlock</button>' +
    '</div>';
  (document.body || document.documentElement).appendChild(curtain);
  var msgEl = function () { return document.getElementById('swkLockMsg'); };

  function fails() {
    try { return JSON.parse(localStorage.getItem(FAIL_LS) || '{"n":0,"until":0}'); }
    catch (e) { return { n: 0, until: 0 }; }
  }
  function setFails(f) { try { localStorage.setItem(FAIL_LS, JSON.stringify(f)); } catch (e) {} }

  var busy = false;
  function tryUnlock() {
    if (busy) return;
    var v = (document.getElementById('swkLockIn').value || '').trim();
    if (!v) return;
    var f = fails(), now = Date.now();
    if (f.until > now) {
      msgEl().textContent = 'Too many wrong tries — wait ' + Math.ceil((f.until - now) / 60000) + ' min.';
      return;
    }
    busy = true;
    msgEl().textContent = 'Checking…';
    // ~1s pause per attempt keeps hand-guessing slow without annoying a typo
    setTimeout(function () {
      var enc = new TextEncoder().encode(SALT + v);
      crypto.subtle.digest('SHA-256', enc).then(function (d) {
        var hex = '';
        var a = new Uint8Array(d);
        for (var i = 0; i < a.length; i++) hex += (a[i] < 16 ? '0' : '') + a[i].toString(16);
        busy = false;
        if (hex === HASH) {
          try { localStorage.setItem(OK_LS, HASH); localStorage.removeItem(FAIL_LS); } catch (e) {}
          // Keep the passcode on THIS device too: the server's My Coins
          // watcher accepts only requests that can present it (the server
          // stores just the fingerprint, so only your devices qualify).
          try { localStorage.setItem('swenik-app-key', v); } catch (e) {}
          curtain.remove(); // this device is now remembered — no reload needed
          return;
        }
        var f2 = fails(); var n = (f2.until && f2.until <= Date.now()) ? 1 : f2.n + 1;
        setFails({ n: n, until: n >= 5 ? Date.now() + 15 * 60 * 1000 : 0 });
        msgEl().textContent = n >= 5 ? 'Wrong — locked for 15 minutes.' : 'Wrong passcode (' + n + '/5).';
        document.getElementById('swkLockIn').value = '';
      }).catch(function () { busy = false; msgEl().textContent = 'This browser blocked the check — use HTTPS.'; });
    }, 1000);
  }
  document.getElementById('swkLockBtn').addEventListener('click', tryUnlock);
  document.getElementById('swkLockIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') tryUnlock(); });
  try { document.getElementById('swkLockIn').focus(); } catch (e) {}
})();
</script>
