        hedgeBox = '<div style="border:1px solid #e6d3a3;background:#fdf6e3;border-radius:9px;padding:9px 11px;font-size:11.5px;font-weight:700;color:#b7791f;margin-bottom:8px;">🔒 Hedge locked — execute the WazirX leg first, BUY <i>or</i> SELL. The hedge then sizes itself to that exact fill and points the right way (a buy is hedged with a SHORT, a sell with a LONG). It is offered on the confirmation page the moment the leg fills.' +
          '<button onclick="__ftHedgeLook(\'' + (sel.coin || p.coin) + '\', \'' + selDir + '\')" style="width:100%;font:inherit;font-weight:800;font-size:11.5px;padding:9px;border-radius:8px;border:1px solid #d9c48a;background:#fff;color:#8a5a00;cursor:pointer;margin-top:8px;">👀 See the numbers first — futures price, funding, spot-vs-futures gap</button>' +
        '</div>';
        hedgeBlocked = true;
      } else if (!hi) {
        hedgeBox = '<div style="font-size:11px;font-weight:700;color:var(--gray-500);margin-bottom:8px;">checking Binance futures (perp · leverage · funding)…</div>';
        hedgeBlocked = true;
      } else if (!hi.hedgeOk) {
        hedgeBox = '<div style="border:1px solid #f0b4b4;background:#fdecec;border-radius:9px;padding:9px 11px;font-size:11.5px;font-weight:700;color:#d33131;margin-bottom:8px;">🛑 Hedge disabled — ' + (hi.reason || 'failed futures verification') + '</div>';
        hedgeBlocked = true;
      } else {
        var mark = Number(hi.markPrice);
        var notion = selQty && mark ? selQty * mark : null;
        var fee = notion != null ? notion * (Number(hi.takerFeePct) || 0.05) / 100 : null;
        var fr = hi.fundingPct8h;
        var fUsdt = notion != null && fr != null ? notion * fr / 100 : null;
        var hr = function (k, v) { return '<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;"><span style="color:#5b6472;font-weight:600;">' + k + '</span><span style="font-weight:800;">' + v + '</span></div>'; };
        hedgeBox = '<div style="border:1px solid #c7d0f4;background:#f4f6ff;border-radius:9px;padding:9px 11px;margin-bottom:8px;">' +
          '<div style="font-size:10.5px;font-weight:800;color:#4653d0;margin-bottom:3px;">🛡 BINANCE FUTURES · ' + hi.symbol + ' · ' + selDir.toUpperCase() + ' · max ' + hi.maxLeverage + '× (✓ ≥5×)</div>' +
          hr('Mark price', mark ? mark : '—') +
          hr('Size', selQty != null ? fmtQ(selQty) + ' ' + String(sel.coin || p.coin).toUpperCase() : (ft.lvl != null ? 'ladder level ' + ft.lvl : ft.pct + '% of walkable')) +
          (notion != null ? hr('Notional', notion.toFixed(2) + ' USDT') : '') +
          (fee != null ? hr('Taker fee (' + hi.takerFeePct + '%)', '≈ ' + fee.toFixed(4) + ' USDT') : '') +
          (fr != null ? hr('Funding', fr + '%/8h' + (fUsdt != null ? ' ≈ ' + fUsdt.toFixed(4) + ' USDT' : '') +
            (selDir === 'long' ? (fr >= 0 ? ' · longs PAY' : ' · longs RECEIVE')
                               : (fr >= 0 ? ' · shorts RECEIVE' : ' · shorts PAY'))) : '') +
        '</div>';
      }
    }

    // ---- ONE Execute button for the selected leg: green buy, red sell,
    // indigo hedge (greyed until the futures verification passes).
    var col = sel.side === 'buy' ? '#1c8a5c' : sel.side === 'sell' ? '#d33131' : sel.side === 'hedge' ? '#4653d0' : '#1c2f4a';
    var szTxt = sel.side === 'hedge'
      ? (selFill ? fmtQ(selFill.qty) + ' ' + String(sel.coin || p.coin).toUpperCase() + ' (the fill)' : 'locked')
      : ft.lvl != null ? 'till level ' + ft.lvl + (lvlRow ? ' · ' + fmtMoney(lvlRow.costInr, 'INR') : '')
      : sizeShort(sel, ft.pct) || (ft.pct + '%');
    // ---- THE ARB GATE, ON BOTH SIDES. A WazirX leg is only offered while
    // there is a total positive arbitrage to trade into. The depth ladder is
    // the trader's own live verdict: no profitable level means no arb, and the
    // button greys out rather than letting him trade into a loss. This covers
    // the SELL too, on his instruction — he would rather a sell never fill and
    // move the coins to Binance by hand than take whatever the book has left.
    var arbDead = (sel.action === 'buy_wazirx' || sel.action === 'sell_wazirx') &&
      p.ladder && p.ladder.length > 0 && posRows.length === 0;
    var arbSide = sel.action === 'sell_wazirx' ? 'Selling' : 'Buying';
    var btn = hedgeBlocked
      ? '<button disabled style="width:100%;font:inherit;font-size:13px;font-weight:800;padding:12px;border:none;border-radius:9px;margin-bottom:6px;background:#c6ccd6;color:#fff;">Execute · ' + selLabel + ' — verification pending</button>'
      : arbDead
      ? '<button disabled style="width:100%;font:inherit;font-size:13px;font-weight:800;padding:12px;border:none;border-radius:9px;margin-bottom:4px;background:#c6ccd6;color:#fff;">Execute · ' + selLabel + ' — no positive arbitrage</button>' +
        '<div style="font-size:11px;font-weight:700;color:#b7791f;background:#fff7e6;border:1px solid #f0dcae;border-radius:8px;padding:9px 10px;margin-bottom:6px;line-height:1.5;">' + arbSide + ' is switched off while every level of this book prices worse than Binance after fees. It re-arms by itself the moment a profitable level appears.</div>'
      : '<button onclick="__ftFire(' + ft.sel + ')" style="width:100%;font:inherit;font-size:13px;font-weight:800;padding:12px;border:none;border-radius:9px;cursor:pointer;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:7px;' +
        'background:' + col + ';color:#fff;">Execute · ' + selLabel + ' · ' + szTxt + '</button>';

    // ---- "EXECUTE IS ARMED" WAS ONLY EVER HALF TRUE.
    //
    // ft.ready is a WAZIRX fact: liveOpps only emits a coin once its WazirX book
    // is live. The arbitrage needs a SECOND book — Binance — and that one can
    // still be seconds behind, which is exactly the gap that let this line read
    // green while the confirmation page underneath it said NOT ARB-CHECKED. Two
    // parts of the same screen disagreeing is worse than either being slow.
    //
    // The depth ladder is the honest tell: it is computed level-by-level against
    // Binance, so an empty ladder on a coin that should have one means the
    // reference has not arrived. Said plainly, in amber, instead of green.
    var arbCold = p.wantLadder && !(p.ladder && p.ladder.length);
    var st = !ft.ready
      ? '<div style="font-size:10.5px;font-weight:700;color:var(--gray-500);">◌ warming the trader’s live books (a few seconds)… Execute retries by itself if tapped early</div>'
      : arbCold
      ? '<div style="font-size:10.5px;font-weight:700;color:#b7791f;">◐ WazirX book live · the Binance reference that prices the arbitrage is still loading — the arb check is not ready yet</div>'
      : '<div style="font-size:10.5px;font-weight:700;color:var(--success);">● trader books live — Execute is armed</div>';
    return head + note + legs + pcts + tally + hedgeBox + lad + btn + st + '<div id="ftMsg" style="font-size:11.5px;font-weight:700;"></div>';
  }
  // ---------- SCROLL ANCHOR ----------
  // The popup body is repainted wholesale every few seconds. The panel below
  // it is destroyed and re-appended in the same tick, so the modal's scroll
  // box briefly gets shorter and the browser clamps the scroll position —
  // that is the "screen moving" while reading the Execute panel. Snapshot the
  // scroll offsets of every scrollable ancestor before the repaint, put them
  // back after the panel is re-attached.
  var ftScroll = null;
  function ftSnapScroll(el) {
    var list = [];
    try {
      var n = el;
      while (n && n !== document.body && n !== document.documentElement) {
        if (n.scrollHeight > n.clientHeight + 1) list.push([n, n.scrollTop]);
        n = n.parentElement;
      }

    ftScroll = { at: Date.now(), list: list, win: window.scrollY || window.pageYOffset || 0 };
  }
  function ftRestoreScroll() {
    var s = ftScroll;
    if (!s || Date.now() - s.at > 500) return; // stale → the user is in control
    try {
      for (var i = 0; i < s.list.length; i++) {
        if (s.list[i][0].scrollTop !== s.list[i][1]) s.list[i][0].scrollTop = s.list[i][1];
      }
      var w = window.scrollY || window.pageYOffset || 0;
      if (Math.abs(w - s.win) > 1) window.scrollTo(0, s.win);
    } catch (e) {}
  }

  function ftRender() {
    var body = document.getElementById('modalBody');
    if (!body || !ft.plan) return;
    var el = document.getElementById('ftExec');
    if (!el) {
      el = document.createElement('div');
      el.id = 'ftExec';
      el.style.cssText = 'margin-top:14px;border:2px solid var(--primary, #2b6ea3);border-radius:12px;padding:12px;background:#f7fafd;';
      body.appendChild(el);
    }
    // Same no-shake rule as the big containers: the panel repolls every 2.5s,
    // but only touches the DOM when something actually changed.
    var html = ftPanelHtml();
    if (el.__ftPanelHtml !== html) { el.__ftPanelHtml = html; el.innerHTML = html; }
    // Panel is back at full height → the popup can hold its place again.
    ftRestoreScroll();
    requestAnimationFrame(function () { ftRestoreScroll(); ftScroll = null; });
  }
  function ftMsg(t, bad) {
    var m = document.getElementById('ftMsg');
    if (m) { m.textContent = t; m.style.color = bad ? 'var(--danger)' : 'var(--success)'; }
  }

  // ---------- EXECUTION CONFIRMATION PAGE ----------
  // Full-screen result after every Execute: placing → ✅ success with the
  // REAL fills pulled from the trader's order record, or ❌ failure with the
  // exact reason. Sits above the scanner modal; Done returns to it.
  function ftOverlay() {
    var el = document.getElementById('ftResult');
    if (!el) {
      el = document.createElement('div');
      el.id = 'ftResult';
      el.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(8,18,34,.7);display:flex;align-items:center;justify-content:center;padding:16px;';
      document.body.appendChild(el);
    }
    el.style.display = 'flex';
    return el;
  }
  // Every confirmation page gets a sequence number. Closing the overlay, or
  // opening a different one, invalidates whatever the previous page was still
  // waiting on — so a retry that lands late can never repaint over a page he has
  // moved on from.
  var ftConfirmSeq = 0;
  window.__ftCloseResult = function () { ftConfirmSeq++; var el = document.getElementById('ftResult'); if (el) el.style.display = 'none'; };
  function ftCard(inner) {
    return '<div style="background:#fff;border-radius:16px;max-width:540px;width:100%;max-height:86vh;overflow:auto;padding:20px;box-shadow:0 18px 60px rgba(0,0,0,.4);" onclick="event.stopPropagation();">' + inner + '</div>';
  }
  function ftRow(k, v) {
    return '<div style="display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:7px 0;border-bottom:1px solid #eef1f6;">' +
      '<span style="color:#5b6472;font-weight:600;white-space:nowrap;">' + k + '</span><span style="font-weight:800;text-align:right;word-break:break-word;">' + v + '</span></div>';
  }
  // ---------- COLLAPSIBLE SECTIONS ----------
  // Nikhil, 29 Jul: "confirmation page is long and not comfortable make us
  // toggle or dropdowns to look better". The page was one continuous scroll of
  // eleven sections, and the numbers that decide the trade — the arbitrage, the
  // average price, the gap to Binance — were buried between paragraphs of
  // explanation he had already read a hundred times.
  //
  // So the detail now lives in folds. A fold is a native <details>: it needs no
  // JavaScript, it cannot get out of sync, and it opens with one tap. Two rules
  // are absolute and are enforced by the caller, not by this helper:
  //   1. nothing red or amber is ever placed inside a fold, and
  //   2. a fold whose contents carry a warning opens by itself (`open`).
  // A fold is only ever allowed to hide detail he might want — never a reason
  // not to trade.
  // The fold chevron flips on open; the browser's own disclosure triangle is
  // hidden so the summary row reads as one clean tap target on a phone.
  //
  // This lives in a <style> tag in the document head, injected once, and NOT
  // inside the card's own HTML — which is where it started. A <style> element
  // nested in the card is invisible on screen but its CSS is still text inside
  // that element, so anything reading the card's words gets the stylesheet
  // first: `#ftResult summary{list-style:none}...🔴CONFIRM SELL`. That broke
  // two checks that read the confirmation page's text, and it would equally
  // break a screen reader, a copy-paste, or a find-on-page.
  var ftFoldStylesDone = false;
  function ftEnsureFoldStyles() {
    if (ftFoldStylesDone || typeof document === 'undefined') return;
    ftFoldStylesDone = true;
    var st = document.createElement('style');
    st.id = 'ftFoldStyles';
    st.textContent =
      '#ftResult summary{list-style:none}' +
      '#ftResult summary::-webkit-details-marker{display:none}' +
      '#ftResult details[open] .ftChev{transform:rotate(180deg)}' +
      '#ftResult .ftChev{display:inline-block;transition:transform .12s}';
    (document.head || document.documentElement).appendChild(st);
  }
  function ftFold(title, hint, inner, open) {
    ftEnsureFoldStyles();
    return '<details' + (open ? ' open' : '') +' style="border:1px solid #e2e8f0;border-radius:10px;margin:8px 0;background:#fafbfd;overflow:hidden;">' +
      '<summary style="cursor:pointer;padding:11px 12px;font-size:12.5px;font-weight:800;color:#3a4653;display:flex;justify-content:space-between;align-items:center;gap:10px;">' +
        '<span>' + title + '</span>' +
        '<span style="font-weight:700;color:#8792a2;font-size:11px;white-space:nowrap;">' + (hint ? hint + ' ' : '') + '<span class="ftChev">▾</span></span>' +
      '</summary>' +
      '<div style="padding:2px 12px 12px;">' + inner + '</div></details>';

  // Two numbers side by side — how the headline figures fit on a phone without
  // becoming a scroll of their own.
  function ftTwoUp(a, b) {
    return '<div style="display:flex;gap:8px;margin:8px 0 0;">' + a + b + '</div>';
  }
  function ftStat(label, value, bad, flex) {
    return '<div style="flex:' + (flex || 1) + ';min-width:0;padding:10px 11px;border-radius:10px;background:' +
      (bad ? '#fdecec' : '#eef7f1') + ';border:1.5px solid ' + (bad ? '#e08a8a' : '#bfe0cd') + ';">' +
      '<div style="font-size:10.5px;font-weight:700;color:#5b6472;margin-bottom:3px;">' + label + '</div>' +
      '<div style="font-size:15px;font-weight:900;line-height:1.25;word-break:break-word;color:' + (bad ? '#c31d1d' : '#177a4c') + ';">' + value + '</div></div>';
  }
  // The same shape in grey, for facts that are neither good nor bad.
  function ftStatPlain(label, value, flex) {
    return '<div style="flex:' + (flex || 1) + ';min-width:0;padding:10px 11px;border-radius:10px;background:#f4f6fa;border:1.5px solid #dde4ec;">' +
      '<div style="font-size:10.5px;font-weight:700;color:#5b6472;margin-bottom:3px;">' + label + '</div>' +
      '<div style="font-size:15px;font-weight:900;line-height:1.25;word-break:break-word;color:#1c2733;">' + value + '</div></div>';
  }
  function ftNote(text, tone) {
    var c = tone === 'bad' ? ['#fdecec', '#f0c0c0', '#a51f1f'] : tone === 'warn' ? ['#fff7e6', '#f0dcae', '#8a5a00'] : ['#f4f6fa', '#dde4ec', '#5b6472'];
    return '<div style="font-size:11.5px;font-weight:' + (tone ? '700' : '600') + ';line-height:1.55;margin-top:8px;padding:9px 11px;border-radius:9px;background:' +
      c[0] + ';border:1px solid ' + c[1] + ';color:' + c[2] + ';">' + text + '</div>';
  }
  // ---------- ONE PANEL INSTEAD OF A STACK OF BOXES ----------
  // Nikhil, 30 Jul: "make confirmation page looks attractive and simple". The
  // AMP sell was five separate red and amber blocks stacked down the page, each
  // with its own border, its own tint and its own padding, and the effect was
  // that none of them got read — a wall of red reads as one undifferentiated
  // alarm, so the eye skips it and goes looking for the button.
  //
  // Same words, one frame. A single panel, tinted by the WORST thing in it,
  // with each point on its own hairline-separated row and a coloured dot
  // carrying its severity. Five boxes become five lines, the page gets short
  // enough that PROCEED stays on the first screen, and nothing is hidden:
  // this is emphatically NOT a fold. The rule that nothing red or amber may
  // live inside a <details> is untouched, and this panel is how the page keeps
  // to it without looking like a stack of warnings.
  function ftAlerts(items, title) {
    var list = (items || []).filter(function (i) { return i && i.html; });
    if (!list.length) return '';
    var worst = list.some(function (i) { return i.tone === 'bad'; }) ? 'bad'
      : list.some(function (i) { return i.tone === 'warn'; }) ? 'warn' : 'info';
    var edge = worst === 'bad' ? '#e9b4b4' : worst === 'warn' ? '#ecd79f' : '#d7dfea';
    var tint = worst === 'bad' ? '#fdecec' : worst === 'warn' ? '#fff7e6' : '#f4f6fa';
    var ink = worst === 'bad' ? '#a51f1f' : worst === 'warn' ? '#8a5a00' : '#48525f';
    var dot = { bad: '#c31d1d', warn: '#b7791f', info: '#7b8794' };
    var head = '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;background:' + tint +
      ';font-size:10.5px;font-weight:900;letter-spacing:.045em;color:' + ink + ';">' +
      '<span>' + (title || (worst === 'info' ? 'WORTH KNOWING' : 'READ THIS FIRST')) + '</span>' +
      '<span style="font-weight:800;opacity:.75;">' + list.length + (list.length === 1 ? ' point' : ' points') + '</span></div>';
    var rows = list.map(function (i, n) {
      return '<div style="display:flex;gap:9px;align-items:flex-start;padding:10px 12px;font-size:11.5px;font-weight:600;line-height:1.55;color:#3a4653;' +
        (n ? 'border-top:1px solid #eef1f6;' : 'border-top:1px solid ' + edge + ';') + '">' +
        '<span style="color:' + (dot[i.tone] || dot.info) + ';font-size:15px;line-height:1.1;font-weight:900;">•</span>' +
        '<span style="min-width:0;">' + i.html + '</span></div>';
    }).join('');
    return '<div style="margin-top:10px;border:1.5px solid ' + edge + ';border-radius:12px;background:#fff;overflow:hidden;">' + head + rows + '</div>';
  }
  // Server warnings, converted into panel rows rather than boxes of their own.
  function ftWarnItems(ws) {
    // The backend grades these 'high' or 'info' and the difference is real: one
    // is "this order may lose you money", the other is "here is how it was
    // built". Painting both amber made every page look equally alarming, which
    // is the fastest way to teach someone to ignore the amber. Only 'high' is
    // red now; anything the backend called informational reads as such, and the
    // panel titles itself WORTH KNOWING when that is all there is.
    return (ws || []).map(function (w) {
      return { tone: w.level === 'high' ? 'bad' : w.level === 'info' ? 'info' : 'warn', html: w.text };
    });
  }
  // The card header, as one band that bleeds to the card's edges instead of an
  // emoji floating over three centred lines. The card is overflow:auto, so the
  // negative margins are clipped by its radius and the band reads as a header.

        : 'Under your ' + (pv.basisWarnPct || 1) + '% mark — the hedge starts near flat.') + '</div>';

      : '<div style="display:flex;gap:8px;margin-top:14px;"><button onclick="__ftCloseResult()" style="flex:1;font:inherit;font-weight:800;font-size:13px;padding:12px;border-radius:9px;border:1px solid #d7dde6;background:#fff;color:#1c2733;cursor:pointer;">Close</button></div>' +
        (o.canFire ? '' : '<div style="font-size:11px;font-weight:600;color:#5b6472;margin-top:9px;text-align:center;line-height:1.5;">Execute the WazirX leg first — then the hedge opens here with PROCEED.</div>');

  // ---------- WAZIRX BUY / SELL CONFIRMATION PAGE ----------
  // THE COTI SWEEP, 29 Jul 15:00:38. The card said ₹1.483. The order filled
  // 11,488.2 COTI across twelve levels from ₹1.550 to ₹1.999 — 5,228.8 of them
  // (45% of the order) at the top price — averaging ₹1.852, about 23% above
  // Binance's 24h high. Every number was correct; ₹1.483 was the best ask and
  // ₹2.003 was the sweep's limit. Only one of them was ever on screen.
  //
  // So this page prints the whole ladder of prices: top of book, THE AVERAGE
  // HE ACTUALLY PAYS, the worst level the sweep reaches, and the limit that
  // goes to WazirX — plus the gap to Binance spot, which is the number that
  // would have screamed +23% here. That limit is then sent BACK as maxPrice,
  // so if the book moves after he looks, the order fills partially at his
  // price instead of chasing.
  function ftWzxCard(pv, o) {
    var C = String(o.coin).toUpperCase();
    var isBuy = (pv.side || o.side) !== 'sell';
    var cur = pv.cur != null ? pv.cur : '₹';
    var mkt = pv.quote || 'INR';
    // canExecute is the server's own arbitrage verdict. A leg with no positive
    // total arb — buy or sell — never gets a PROCEED button. Same rule that
    // greys Execute on the panel, enforced again here in case the panel was
    // read minutes ago.
    var canGo = !pv.blocker && Number(pv.qty) > 0 && pv.canExecute !== false;
    ftEnsureFoldStyles();
    // NO BINANCE REFERENCE AT ALL. AMP and PEPE have no Binance perp, so the
    // trader opens no Binance book for them and there is nothing to measure a
    // WazirX price against. That used to be a locked button; on his instruction
    // it is now a warned trade. The state gets its own name on the page —
    // "NOT ARB-CHECKED" — because it is neither a good arbitrage nor a bad one.
    var unpriced = !!pv.unpriced || (pv.arbKnown === false && pv.canExecute !== false);
    // The pill takes the arbitrage OF THE SELECTION, not of the full ladder. With
    // the order-count toggles set to 1 of 3, the strip restates every figure for
    // that one order — a pill still showing the nine-level number would be the
    // page arguing with itself two inches apart. So the head is built from
    // whatever arbitrage is actually on offer, and drawn once that is known.
    var mkHead = function (arbNow) {
      var verdict = pv.blocker || pv.canExecute === false
        ? ftPill('BLOCKED', 'bad')
        : unpriced ? ftPill('NOT ARB-CHECKED', 'warn')
        : Number(arbNow) > 0 ? ftPill('ARB +' + Number(arbNow).toFixed(2) + '%', 'good') : null;
      // The band's colour is the VERDICT, never the side. Tinting a sell red made
      // every ordinary sell look like a failure before he had read a number.
      return ftHeadBand(isBuy ? '🟢' : '🔴', 'CONFIRM ' + (isBuy ? 'BUY' : 'SELL'),
        C + ' / ' + mkt + ' · WazirX · ' + String(ft.mode || '').toUpperCase(),
        pv.blocker || pv.canExecute === false ? 'bad' : unpriced ? 'warn' : Number(arbNow) > 0 ? 'good' : 'plain', verdict) +
        '<div style="font-size:11px;font-weight:700;color:#7b8794;text-align:center;margin:-4px 0 2px;">Nothing is placed until you tap PROCEED.</div>';
    };

    if (pv.blocker) {
      // "Waiting" and "refused" are different answers and they now look
      // different. A pending arbitrage reference is amber with a Try again
      // button; a real refusal keeps the red card and the Close button.
      if (pv.arbPending) {
        return ftHeadBand('◐', 'NOT READY YET', C + ' / ' + mkt + ' · WazirX · ' + String(ft.mode || '').toUpperCase(),
          'warn', ftPill('WAITING FOR BINANCE', 'warn')) +
          '<div style="font-size:11px;font-weight:700;color:#7b8794;text-align:center;margin:-4px 0 2px;">Nothing has been placed and nothing has been refused.</div>' +
          ftAlerts([{ tone: 'warn', html: '<b>The arbitrage has not been measured yet.</b><br>' + pv.blocker }].concat(ftWarnItems(pv.warnings)), 'WHAT IS HAPPENING') +
          '<div style="display:flex;gap:8px;margin-top:14px;">' +
            '<button onclick="__ftWzxRetry()" style="flex:1;font:inherit;font-weight:900;font-size:13px;padding:12px;border-radius:9px;border:none;background:#b7791f;color:#fff;cursor:pointer;">Try again</button>' +
            '<button onclick="__ftCloseResult()" style="flex:1;font:inherit;font-weight:800;font-size:13px;padding:12px;border-radius:9px;border:1px solid #d7dde6;background:#fff;color:#1c2733;cursor:pointer;">Close</button></div>';
      }
      return mkHead(pv.arbPct) +
        ftAlerts([{ tone: 'bad', html: '<b>This order cannot be placed.</b><br>' + pv.blocker }].concat(ftWarnItems(pv.warnings)), 'WHY IT IS BLOCKED') +
        '<div style="display:flex;gap:8px;margin-top:14px;"><button onclick="__ftCloseResult()" style="flex:1;font:inherit;font-weight:800;font-size:13px;padding:12px;border-radius:9px;border:1px solid #d7dde6;background:#fff;color:#1c2733;cursor:pointer;">Close</button></div>';
    }

    var px8 = function (v) { return v == null ? '—' : cur + num(v, 8); };
    var lad = pv.levels || [];
    var vb = pv.vsBinancePct;
    var qtyShort = pv.requestedQty != null && pv.qty != null && Math.abs(pv.requestedQty - pv.qty) > 1e-9;

    // ── ORDER-COUNT TOGGLES ────────────────────────────────────────────────
    // 29 Jul: "keep toggles to number of orders to place". The ladder runs
    // from the best price to the worst, so the choice that makes sense is how
    // DEEP to go: switching a row off also switches off every row below it
    // (nobody skips a better price to take a worse one), and switching a row
    // on brings back everything above it. The selection is always "the first
    // N orders". Every number on this page is then restated from the SERVER'S
    // own cumulative columns for row N (cumQty / cumAvgPrice / cumCostQuote /
    // cumArbPct) — the client derives nothing except by exact algebra on those
    // same figures. At least one order always stays on; Cancel is the way to
    // place nothing.
    var keepN = (ftPend && ftPend.wzx && ftPend.keepN != null)
      ? Math.max(1, Math.min(lad.length, ftPend.keepN)) : lad.length;
    var trimmedSel = lad.length > 0 && keepN < lad.length;
    var selRow = lad.length ? lad[keepN - 1] : null;
    var selQty = trimmedSel && selRow.cumQty != null ? selRow.cumQty : pv.qty;
    var selAvg = trimmedSel && selRow.cumAvgPrice != null ? selRow.cumAvgPrice : pv.avgPrice;
    var selCost = trimmedSel && selRow.cumCostQuote != null ? selRow.cumCostQuote : pv.costQuote;
    var selArb = trimmedSel && selRow.cumArbPct != null ? selRow.cumArbPct : pv.arbPct;
    var selLimit = trimmedSel ? selRow.price : pv.limitPrice;
    var selWorst = trimmedSel ? selRow.price : pv.worstPrice;
    // vs-Binance for the selection. cumArbPct is (gap vs walked Binance) minus
    // fees, and vsBinancePct is the same gap with the sign flipped and no
    // fees, so for a trimmed selection: vb = −(arb + fees). Exact, not a fit.
    var selVb = vb, selVbHigh = !!pv.vsBinanceHigh;
    if (trimmedSel) {
      selVb = (selArb != null && pv.feePct != null)
        ? +(-(Number(selArb) + Number(pv.feePct))).toFixed(3) : null;
      selVbHigh = selVb != null && selVb >= (pv.slipWarnPct || 1);
    }
    // Slippage for the selection: the cumulative average vs the top of book.
    var selSlipPct = pv.slipPct, selSlipHigh = !!pv.slipHigh;
    if (trimmedSel && pv.topPrice > 0 && selAvg != null) {
      selSlipPct = +(((isBuy ? selAvg - pv.topPrice : pv.topPrice - selAvg) / pv.topPrice) * 100).toFixed(3);
      selSlipHigh = selSlipPct >= (pv.slipWarnPct || 1);
    }
    var apos = selArb != null && Number(selArb) > 0;
    var head = mkHead(selArb);   // now that the selection's arbitrage is known
    var money = selCost != null ? cur + num(selCost, 2) + (mkt === 'USDT' ? ' USDT' : '') : '—';

    // ================= 1. THE DECISION STRIP =================
    // Five numbers, no paragraphs, never folded: is there an arbitrage, what
    // will I actually pay, how far is that from the global market, how many
    // tokens and how much money. Everything else is detail and lives in a fold.
    var strip = '';
    // THE TOTAL ARBITRAGE — the one number that decides whether a BUY is even
    // offered. Positive and green, or the PROCEED button is not there at all.
    if (selArb != null) {
      strip += '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:' +
        (apos ? '#eef7f1' : '#fdecec') + ';border:1.5px solid ' + (apos ? '#bfe0cd' : '#e08a8a') + ';">' +
        '<span style="font-size:12.5px;font-weight:800;color:#3a4653;">Total arbitrage</span>' +
        '<span style="font-size:22px;font-weight:900;letter-spacing:-.01em;color:' + (apos ? '#177a4c' : '#c31d1d') + ';">' +
          (apos ? '+' : '') + Number(selArb).toFixed(2) + '%</span></div>';
    } else if (unpriced) {
      // The honest version of the number: unknown, and WHY it is unknown, in the
      // same slot the arbitrage would have occupied. Reading "—" there would
      // have told him nothing; a locked button told him less.
      strip += '<div style="padding:11px 14px;border-radius:12px;background:#fff7e6;border:1.5px solid #ecd79f;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">' +
          '<span style="font-size:12.5px;font-weight:800;color:#3a4653;">Total arbitrage</span>' +
          '<span style="font-size:14px;font-weight:900;color:#8a5a00;">NOT MEASURABLE</span></div>' +
        '<div style="font-size:11px;font-weight:600;color:#8a5a00;line-height:1.5;margin-top:5px;">' +
          // The server now names the exact state — no perp, warming, frozen, or
          // no USDT/INR rate — so the page states its reason instead of guessing
          // one. Only the permanently-unpriceable case reaches this card at all;
          // the temporary ones are held on the waiting card and never arm PROCEED.
          (pv.unpricedReason
            ? (String(pv.unpricedReason).charAt(0).toUpperCase() + String(pv.unpricedReason).slice(1) + '.')
            : pv.noPerp
            ? 'There is no ' + C + 'USDT perpetual on Binance, so the trader streams no Binance ' + C + ' book and there is no price to measure this against.'
            : 'There is no live Binance ' + C + ' book right now, so there is no price to measure this against.') +
          ' This ' + (isBuy ? 'buy' : 'sell') + ' is on WazirX alone — judge the ' + px8(selAvg) + ' average on its own merits.</div></div>';
    }
    // The average is THE COTI number: the card said ₹1.483, the sweep averaged
    // ₹1.852. It is on screen before anything else can be tapped.
    strip += ftTwoUp(
      // Green means "checked and fine". With no Binance reference nothing has
      // been checked, so the tile is grey — it states the number without
      // blessing it.
      unpriced ? ftStatPlain('Average you ' + (isBuy ? 'PAY' : 'GET'), px8(selAvg))
        : ftStat('Average you ' + (isBuy ? 'PAY' : 'GET'), px8(selAvg) + (selSlipHigh ? ' ⚠' : ''), !!selSlipHigh),
      pv.binSpotQuote != null
        ? ftStat('vs Binance, your size', (selVb == null ? '—' : (selVb > 0 ? '+' : '') + Number(selVb).toFixed(2) + '%') + (selVbHigh ? ' ⚠' : ''), !!selVbHigh)
        : ftStatPlain('Top of book', px8(pv.topPrice)));
    strip += ftTwoUp(
      ftStatPlain('Tokens to ' + (isBuy ? 'buy' : 'sell'), num(selQty) + ' ' + C),
      ftStatPlain(isBuy ? 'Total cost' : 'Total received', money));
    if (trimmedSel) {
      strip += '<div style="font-size:11px;font-weight:700;color:#5b6472;margin-top:6px;line-height:1.5;">' +
        'Restated for the <b>' + keepN + ' of ' + lad.length + '</b> orders you left switched on — ' +
        num(pv.qty - selQty) + ' ' + C + ' will not be ordered.</div>';
    }

    // ================= 2. ANYTHING WRONG — also never folded =================
    // Every one of these is a reason to stop. None of them is ever allowed
    // inside a <details>, because a fold he does not open is a fold he does not
    // read, and these are exactly the lines the COTI sweep needed him to read.
    // They are now ROWS OF ONE PANEL rather than a stack of separate boxes —
    // his "attractive and simple". Nothing is dropped and nothing is folded;
    // the words are identical, the frame is one.
    var al = [];
    if (qtyShort) {
      al.push({ tone: 'bad', html: 'You asked for <b>' + num(pv.requestedQty) + ' ' + C + '</b>, but only <b>' + num(pv.qty) +
        '</b> can fill at a price worth taking — ' + num(pv.requestedQty - pv.qty) + ' ' + C + ' will NOT go out.' });
    }
    if (selSlipHigh) {
      al.push({ tone: 'bad', html: 'This size sweeps ' + (trimmedSel ? keepN : (pv.levelsUsed || '?')) + ' levels — ' +
        (selSlipPct != null ? Number(selSlipPct).toFixed(2) + '% ' : '') + 'worse than the top of the book, reaching ' +
        px8(selWorst) + '. That is above your ' + (pv.slipWarnPct || 1) + '% mark.' });
    }
    if (selVbHigh && selVb != null) {
      al.push({ tone: 'bad', html: 'You are ' + (isBuy ? 'BUYING above' : 'SELLING below') + ' the global market by ' +
        Math.abs(Number(selVb)).toFixed(2) + '% — a hedge opened against this starts that far under water.' });
    }
    // Levels the server refused to include because the running arbitrage had
    // already turned negative. COTI's ₹1.999 tail would have lived here.
    if (pv.droppedLevels && pv.droppedLevels.length) {
      var dq = 0;
      for (var di = 0; di < pv.droppedLevels.length; di++) dq += Number(pv.droppedLevels[di].qty) || 0;
      al.push({ tone: 'warn', html: 'Stopped after ' + lad.length + ' level(s). The next ' + pv.droppedLevels.length +
        ' would take the arbitrage negative, so ' + num(dq) + ' ' + C +
        ' of the size is left on the table rather than traded at a loss.' });
    }
    // TRIM — how much fits inside the 1% mark, one tap away.
    if (selSlipHigh && pv.capQty > 0 && pv.capQty < selQty * 0.999) {
      al.push({ tone: 'warn', html: 'Only <b>' + num(pv.capQty) + ' ' + C + '</b> fits inside ' + (pv.slipWarnPct || 1) + '% of the top of the book' +
        (pv.capCost != null ? ' (' + cur + num(pv.capCost, 2) + ')' : '') + '.' +
        '<button onclick="__ftWzxTrim()" style="width:100%;font:inherit;font-weight:800;font-size:12px;padding:9px;border-radius:8px;border:1px solid #d9c48a;background:#fff;color:#8a5a00;cursor:pointer;margin-top:8px;">✂ Trim to ' +
        num(pv.capQty) + ' ' + C + ' and re-check</button>' });
    }
    if (pv.keysReady === false) al.unshift({ tone: 'bad', html: 'WazirX keys are not set on the server — nothing can be placed until they are.' });
    if (pv.canExecute === false && !pv.blocker) {
      // FIRST, not sixth. This is the reason there is no button; everything else
      // on the panel is detail about a trade that is not going out anyway.
      al.unshift({ tone: 'bad', html: '<b>' + (isBuy ? 'Buying' : 'Selling') + ' is switched off</b> — there is no total positive arbitrage on ' + C +
        ' right now. It re-arms by itself the moment the book offers one.' +
        (isBuy ? '' : ' Nothing is sold into whatever the book has left; if you want out regardless, transfer the coins to Binance and sell there.') });
    }
    // The server's own warnings. The two that describe the missing Binance
    // reference are dropped HERE and only here, because the amber band in the
    // strip above already says both things in fewer words and printing them
    // twice is exactly the wall of red he asked to be rid of. Everything else
    // the server says is kept verbatim.
    var ws = (pv.warnings || []).filter(function (w) {
      if (!unpriced) return true;
      return !/NOT arbitrage-checked|no reference price to measure this against|can never be hedged on Binance futures/.test(w.text || '');
    });
    if (unpriced && pv.noPerp) {
      al.push({ tone: 'warn', html: '<b>' + C + ' cannot be hedged on Binance futures</b> — there is no ' + C +
        'USDT perpetual. Whatever ' + (isBuy ? 'you buy' : 'is left') + ' has to be moved and closed by hand, so treat this as an outright position, not a hedged leg.' });
    }
    al = al.concat(ftWarnItems(ws));
    var alerts = ftAlerts(al, canGo ? 'READ THIS BEFORE YOU TAP PROCEED' : 'WHY THIS IS NOT OFFERED');

    // ================= 3. THE FOLDS — detail, on tap =================
    var folds = '';

    // 3a. THE ORDER LADDER. Every row here becomes its OWN limit order at its
    //     OWN price: ₹1.483 × 5,000 and ₹1.51 × 3,500 go out as two separate
    //     orders. If the ₹1.483 level has gone by the time it lands, that order
    //     simply rests, finds nobody, and is cancelled — while ₹1.51 fills and
    //     the whole thing settles as a partial. Nothing can ever sweep past its
    //     own price. Folded open when levels were dropped, so the short size is
    //     explained on sight.
    if (lad.length) {
      var tbl = '<div style="border:1.5px solid #cfd8e3;border-radius:10px;overflow:hidden;background:#fff;">' +
        '<div style="display:flex;gap:8px;padding:7px 10px;background:#eef2f7;font-size:10.5px;font-weight:800;color:#5b6472;">' +
        (lad.length > 1 ? '<span style="flex:0.6;">ON</span>' : '') +
        '<span style="flex:1.2;">PRICE</span><span style="flex:1.1;text-align:right;">SIZE</span>' +
        '<span style="flex:1.1;text-align:right;">' + (isBuy ? 'COST' : 'GET') + '</span>' +
        '<span style="flex:0.8;text-align:right;">ARB</span></div>';
      for (var li = 0; li < lad.length; li++) {
        var L = lad[li];
        var la = L.arbPct;
        var on = li < keepN;
        // The toggle: a tap on an ON row switches it and everything deeper
        // off; a tap on an OFF row switches everything up through it back on.
        var tog = lad.length > 1
          ? '<span onclick="__ftWzxKeep(' + li + ')" role="switch" aria-checked="' + on + '" style="flex:0.6;cursor:pointer;">' +
              '<span style="display:inline-block;width:30px;height:17px;border-radius:9px;position:relative;vertical-align:middle;background:' +
              (on ? '#177a4c' : '#c6cfda') + ';transition:background .12s;">' +
              '<span style="position:absolute;top:2px;' + (on ? 'right:2px;' : 'left:2px;') +
              'width:13px;height:13px;border-radius:50%;background:#fff;"></span></span></span>'
          : '';
        tbl += '<div style="display:flex;gap:8px;align-items:center;padding:9px 10px;font-size:12px;font-weight:700;color:#1c2733;' +
          (li ? 'border-top:1px solid #e6ebf1;' : '') + (on ? '' : 'opacity:.45;') + '">' + tog +
          '<span style="flex:1.2;' + (on ? '' : 'text-decoration:line-through;') + '">' + cur + num(L.price, 8) + '</span>' +
          '<span style="flex:1.1;text-align:right;">' + num(L.qty) + '</span>' +
          '<span style="flex:1.1;text-align:right;color:#5b6472;">' + cur + num(L.costQuote != null ? L.costQuote : L.price * L.qty, 2) + '</span>' +
          '<span style="flex:0.8;text-align:right;color:' + (la == null ? '#5b6472' : la > 0 ? '#177a4c' : '#c31d1d') + ';">' +
            (la == null ? '—' : (la > 0 ? '+' : '') + Number(la).toFixed(2) + '%') + '</span></div>';
      }
      tbl += '</div>' +
        '<div style="font-size:11px;font-weight:600;color:#5b6472;margin:8px 0 0;line-height:1.5;">' +
        (lad.length === 1
          ? 'One limit order at exactly this price. If the book has moved away from it by the time it lands, it rests, finds no counterparty and is cancelled — it is never chased to a worse price.'
          : 'Each row is placed as its own limit order at its own price — never one blended limit that sweeps everything in between. A row whose level has gone by the time it lands simply does not fill and is cancelled; the rest fill, and the total comes back as a partial.' +
            ' Use the toggles to place fewer orders: switching a row off drops it and every deeper (worse-priced) row, and the whole page restates for what stays on.') +
        '</div>';
      if (trimmedSel) {
        tbl += '<div style="font-size:11px;font-weight:700;color:#8a5a00;margin:6px 0 0;line-height:1.5;">' +
          'You switched off ' + (lad.length - keepN) + ' deeper level(s) — ' +
          num(pv.qty - selQty) + ' ' + C + ' stays unordered.</div>';
      }
      folds += ftFold(
        lad.length === 1 ? 'The order that will go out'
          : trimmedSel ? 'Placing ' + keepN + ' of ' + lad.length + ' orders'
          : 'The ' + lad.length + ' orders that will go out',
        (trimmedSel ? keepN + ' of ' : '') + lad.length + (lad.length === 1 ? ' price' : ' prices'),
        tbl,
        !!(pv.droppedLevels && pv.droppedLevels.length) || trimmedSel || !!(ftPend && ftPend.ladTouched));
    }

    // 3b. THE PRICES. Top, worst, and the ceiling that goes to WazirX — the
    //     three numbers COTI only ever showed one of. Opens by itself whenever
    //     the sweep is wide enough to matter.
    var prices = ftRow('Top of book', px8(pv.topPrice));
    // WHERE THIS BOOK CAME FROM. Normally the 100ms websocket; but a coin tapped
    // straight off the scanner is not in the trader's stream set yet, and the
    // first frame can take seconds on a market as thin as BAND/USDT — which is
    // how "no live WazirX BAND/USDT ask book" appeared while the scanner card
    // behind it was showing that very book. The backend now reads WazirX's depth
    // endpoint directly in that case, and says so here rather than passing a
    // snapshot off as a live feed.
    if (pv.bookSource === 'rest') {
      prices += ftRow('Book source', '<span style="color:#8a5a00;font-weight:800;">WazirX depth snapshot (not the live stream)</span>');
    }
    prices += ftRow('Average you ' + (isBuy ? 'PAY' : 'GET'), px8(selAvg));
    prices += ftRow('Worst price reached', px8(selWorst));
    prices += ftRow('Nothing goes out ' + (isBuy ? 'above' : 'below'), px8(selLimit));
    prices += '<div style="font-size:11px;font-weight:600;color:#5b6472;margin:8px 0 0;line-height:1.5;">' +
      'The ceiling is the deepest price on the ladder — every order goes out at exactly its own row price, and anything the market will not meet is cancelled rather than chased. ' +
      (selSlipPct != null
        ? Number(selSlipPct).toFixed(2) + '% off the top of the book across ' + (trimmedSel ? keepN : (pv.levelsUsed || 1)) + ' level(s), against your ' + (pv.slipWarnPct || 1) + '% mark.'
        : 'The average is walked level by level, not taken from the top.') + '</div>';
    folds += ftFold('Prices in detail', px8(pv.topPrice) + ' → ' + px8(selWorst), prices, !!selSlipHigh);

    // 3c. THE BINANCE SANITY CHECK. COTI bought 23% above the global market and
    //     the hedge locked that in. The headline % is already in the strip; this
    //     fold carries where the number came from.
    if (pv.binSpotQuote != null) {
      // BOTH Binance numbers, always, and the gap between them named.
      //
      // Nikhil, 29 Jul: "why total arbitrage showing different values". The
      // scanner card said 1.10% on the CFX first level and this page said
      // 1.83% for the same 7,596 CFX. Neither was wrong; they compared against
      // different prices. The card walked Binance's book for the whole size,
      // this page used Binance's single best price — which exists for a few
      // tokens and then is gone. That was 0.43% of the 0.73% gap. (The rest was
      // the loop card valuing the mid-loop USDT at the WazirX USDT/INR mid
      // instead of the ask that was paid — bookkeeping inside the loop split,
      // and it does not change the loop total at all.)
      //
      // The page now uses the walked price, like the scanner, and prints the
      // best price next to it so the difference is never a mystery again.
      var exitWord = pv.binExitSide === 'asks' ? 'buy it back at' : 'pay for it';
      // For a trimmed selection, back out the walked Binance price for the
      // smaller size from the server's own cumArbPct — exact algebra on the
      // same formula the server used, not an estimate.
      var binForSize = pv.binSpotQuote;
      if (trimmedSel && selVb != null && selAvg != null) {
        binForSize = +(selAvg / (isBuy ? 1 + selVb / 100 : 1 - selVb / 100)).toFixed(8);
      }
      var bin = ftRow('Binance best price', px8(pv.binTopQuote != null ? pv.binTopQuote : pv.binSpotQuote));
      bin += ftRow('For YOUR size, Binance would ' + exitWord, px8(binForSize));
      if (!trimmedSel && pv.binDepthCostPct != null && Number(pv.binDepthCostPct) > 0.001) {
        bin += ftRow('Difference — Binance depth', Number(pv.binDepthCostPct).toFixed(2) + '%');
      }
      if (pv.usdtInrRate) bin += ftRow('…converted at', '₹' + num(pv.usdtInrRate, 2) + ' per USDT');
      bin += ftRow('Your average is', (selVb == null ? '—' : (selVb > 0 ? '+' : '') + Number(selVb).toFixed(2) + '%') + ' vs that');
      if (pv.feePct != null) bin += ftRow('Fees counted in', Number(pv.feePct).toFixed(2) + '%');
      bin += '<div style="font-size:11px;font-weight:600;color:#5b6472;margin:8px 0 0;line-height:1.5;">' +
        'The total arbitrage at the top of this page is measured across the whole ladder against the second price — what Binance would really ' +
        exitWord + ' this many tokens, not its best price for a handful. That is the same basis the scanner card uses, so the two agree. ' +
        (selVbHigh ? '' : 'This order is in line with the global market.') + '</div>';
      folds += ftFold('vs Binance', (selVb == null ? '' : (selVb > 0 ? '+' : '') + Number(selVb).toFixed(2) + '%'), bin, !!selVbHigh);
    }

    // 3d. THE MONEY and what the account actually holds.
    var acct = '';
    if (selCost != null) acct += ftRow(isBuy ? 'Total cost' : 'Total received', cur + num(selCost, 2) + (mkt === 'USDT' ? ' USDT' : ''));
    if (pv.costInr != null && mkt === 'USDT' && pv.costQuote > 0) {
      // Rupee restatement scales with the selection (same USDT/INR rate).
      acct += ftRow('…in rupees', '≈ ₹' + num(pv.costInr * (selCost != null ? selCost / pv.costQuote : 1), 2));
    }
    if (pv.freeQuote != null) acct += ftRow('You have', cur + num(pv.freeQuote, 2) + (mkt === 'USDT' ? ' USDT' : ''));
    if (pv.heldQty != null) acct += ftRow('WazirX shows', num(pv.heldQty) + ' ' + C +
      (pv.balanceSettled === false ? ' <span style="color:#b7791f;">· still settling</span>' : ''));
    if (pv.requestedQty != null) acct += ftRow('Size you asked for', num(pv.requestedQty) + ' ' + C);
    if (acct) folds += ftFold('Money and balances', money, acct, false);

    var danger = selSlipHigh || selVbHigh;
    var btns = canGo
      ? '<button onclick="__ftWzxGo()" style="width:100%;font:inherit;font-weight:900;font-size:14px;padding:14px;border-radius:10px;border:none;background:' +
          (danger ? '#c31d1d' : '#177a4c') + ';color:#fff;cursor:pointer;margin-top:14px;">PROCEED · ' +
          (isBuy ? 'BUY' : 'SELL') + ' ' + num(selQty) + ' ' + C +
          (keepN > 1 ? ' · ' + keepN + ' orders' : ' @ ' + px8(selLimit)) + '</button>' +
        '<button onclick="__ftCloseResult()" style="width:100%;font:inherit;font-weight:800;font-size:13px;padding:11px;border-radius:9px;border:1px solid #d7dde6;background:#fff;color:#1c2733;cursor:pointer;margin-top:8px;">Cancel — place nothing</button>'
      : '<div style="display:flex;gap:8px;margin-top:14px;"><button onclick="__ftCloseResult()" style="flex:1;font:inherit;font-weight:800;font-size:13px;padding:12px;border-radius:9px;border:1px solid #d7dde6;background:#fff;color:#1c2733;cursor:pointer;">Close</button></div>';

    return head + strip + alerts + folds + btns;
  }

  // WAITING IS NOT REFUSING, AND IT SHOULD NOT LOOK LIKE IT.
  //
  // When the Binance reference has not landed yet the server now says so with
  // arbPending instead of quietly dropping the positive-arb gate. That is the
  // right answer, but showing him a red BLOCKED card for a coin that will price
  // in a second and a half would just move the confusion. So this page waits for
  // it — visibly, with a count — and paints the real numbers the moment they
  // exist. He taps once; the page does the reopening he was doing by hand.
  var ARB_WAIT_TRIES = 4;
  var ARB_WAIT_MS = 1200;
  function ftWzxWaitCard(o, n, of) {
    var C = String(o.coin).toUpperCase();
    return '<div style="font-size:34px;text-align:center;">◐</div>' +
      '<div style="font-size:15px;font-weight:800;text-align:center;margin:6px 0 3px;">Waiting for the Binance ' + C + ' book…</div>' +
      '<div style="font-size:12px;font-weight:600;color:#5b6472;text-align:center;line-height:1.6;">' +
        C + ' was subscribed the moment you opened it, and the arbitrage cannot be measured until that book arrives. ' +
        'Nothing is placed and nothing is being refused — this page arms itself as soon as there is a price to check against.' +
      '</div>' +
      '<div style="font-size:11px;font-weight:800;color:#b7791f;text-align:center;margin-top:9px;">attempt ' + n + ' of ' + of + '</div>' +
      '<div style="display:flex;gap:8px;margin-top:14px;"><button onclick="__ftCloseResult()" style="flex:1;font:inherit;font-weight:800;font-size:13px;padding:12px;border-radius:9px;border:1px solid #d7dde6;background:#fff;color:#1c2733;cursor:pointer;">Cancel</button></div>';
  }

  // o = { coin, side, market, qty, pct, lvl }
  async function ftWzxConfirm(o) {
    var seq = ++ftConfirmSeq;
    ftOverlay().innerHTML = ftCard(
      '<div style="font-size:34px;text-align:center;">◌</div>' +
      '<div style="font-size:15px;font-weight:800;text-align:center;margin:6px 0 3px;">Walking the live book…</div>' +
      '<div style="font-size:12px;font-weight:600;color:#5b6472;text-align:center;">the price you will actually ' +
        (o.side === 'sell' ? 'get' : 'pay') + ' for ' + String(o.coin).toUpperCase() + '</div>');
    var body = { coin: o.coin, action: o.side === 'sell' ? 'sell_wazirx' : 'buy_wazirx', mode: ft.mode, pct: o.pct || 25 };
    if (o.qty) body.qty = o.qty;
    if (o.lvl != null) body.lvl = o.lvl;
    if (o.market) body.market = o.market;
    var pv, tries = 0;
    for (;;) {
      try { pv = await ftPost('/api/trader/manual/preview', body); }
      catch (e) { pv = { blocker: e.message, warnings: [], qty: null }; }
      if (seq !== ftConfirmSeq) return;              // he closed it, or opened another
      if (!pv || !pv.arbPending || tries >= ARB_WAIT_TRIES) break;
      tries++;
      ftOverlay().innerHTML = ftCard(ftWzxWaitCard(o, tries, ARB_WAIT_TRIES));
      await new Promise(function (r) { setTimeout(r, ARB_WAIT_MS); });
      if (seq !== ftConfirmSeq) return;
    }
    ftPend = { o: o, pv: pv, wzx: true };
    ftOverlay().innerHTML = ftCard(ftWzxCard(pv, o));
  }

  // The manual half of the same self-heal: reopens the SAME request, so it
  // cannot quietly change size or side while he was reading it.
  window.__ftWzxRetry = function () {
    if (!ftPend || !ftPend.wzx || !ftPend.o) return;
    ftWzxConfirm(ftPend.o);
  };

  // "Trim to what fits inside 1%" — re-opens the page on the smaller size, so
  // he approves the trimmed numbers rather than assuming them.
  window.__ftWzxTrim = function () {
    if (!ftPend || !ftPend.wzx || !(ftPend.pv.capQty > 0)) return;
    var o = ftPend.o;
    return ftWzxConfirm({ coin: o.coin, side: o.side, market: o.market, qty: ftPend.pv.capQty, pct: o.pct, lvl: null });
  };

  // The order-count toggle. Tapping row i when it is ON keeps only the rows
  // above it (never fewer than one order); tapping it when OFF switches
  // everything up through row i back on. The card re-renders from the SAME
  // frozen preview — no refetch, so the prices he read cannot shift under the
  // toggle — with every number restated for the new selection.
  window.__ftWzxKeep = function (i) {
    if (!ftPend || !ftPend.wzx) return;
    var lad = ftPend.pv.levels || [];
    var cur = ftPend.keepN != null ? Math.max(1, Math.min(lad.length, ftPend.keepN)) : lad.length;
    ftPend.keepN = (i < cur) ? Math.max(1, i) : Math.min(lad.length, i + 1);
    ftPend.ladTouched = true; // keep the ladder fold open across re-renders
    ftOverlay().innerHTML = ftCard(ftWzxCard(ftPend.pv, ftPend.o));
  };

  // The only path from the WazirX confirmation page to a real order. It sends
  // the approved qty AND the approved limit as maxPrice — the server will not
  // pay past it, so a book that moved gives a partial fill, not a COTI sweep.
  window.__ftWzxGo = async function () {
    if (!ftPend || !ftPend.wzx) return;
    var o = ftPend.o, pv = ftPend.pv;
    var C = String(o.coin).toUpperCase();
    var isBuy = (pv.side || o.side) !== 'sell';
    var label = (isBuy ? 'BUY ' : 'SELL ') + C + ' @WazirX' + (pv.market === 'usdt' ? '·USDT mkt' : '');
    // Honor the order-count toggles: only the first keepN rows go out, and the
    // totals/ceiling sent are the SERVER'S cumulative figures for that row.
    var allRows = pv.levels || [];
    var keepN = ftPend.keepN != null ? Math.max(1, Math.min(allRows.length, ftPend.keepN)) : allRows.length;
    var selRows = allRows.slice(0, keepN);

    // ---- indicator math (series in, series out; standard formulas) ----
    function rsEma(v, n) {
      var k = 2 / (n + 1), out = [], prev = null;
      for (var i = 0; i < v.length; i++) {
        prev = prev == null ? v[i] : v[i] * k + prev * (1 - k);
        out.push(prev);
      }
      return out;
    }
    function rsSma(v, n) {
      var out = [], s = 0;
      for (var i = 0; i < v.length; i++) {
        s += v[i]; if (i >= n) s -= v[i - n];
        out.push(i >= n - 1 ? s / n : null);
      }
      return out;
    }
    function rsRsi(c, n) { // Wilder
      var out = [null], g = 0, l = 0, i;
      for (i = 1; i < c.length; i++) {
        var d = c[i] - c[i - 1], up = d > 0 ? d : 0, dn = d < 0 ? -d : 0;
        if (i <= n) { g += up / n; l += dn / n; out.push(i === n ? 100 - 100 / (1 + (l === 0 ? 1e9 : g / l)) : null); }
        else {
          g = (g * (n - 1) + up) / n; l = (l * (n - 1) + dn) / n;
          out.push(100 - 100 / (1 + (l === 0 ? 1e9 : g / l)));
        }
      }
      return out;
    }
    function rsAtr(h, l, c, n) { // Wilder
      var out = [null], prev = null, i;
      for (i = 1; i < c.length; i++) {
        var tr = Math.max(h[i] - l[i], Math.abs(h[i] - c[i - 1]), Math.abs(l[i] - c[i - 1]));
        prev = prev == null ? tr : (prev * (n - 1) + tr) / n;
        out.push(i >= n ? prev : null);
      }
      return out;
    }
    function rsStochK(h, l, c, n) {
      var out = [];
      for (var i = 0; i < c.length; i++) {
        if (i < n - 1) { out.push(null); continue; }
        var hh = -Infinity, ll = Infinity;
        for (var j = i - n + 1; j <= i; j++) { if (h[j] > hh) hh = h[j]; if (l[j] < ll) ll = l[j]; }
        out.push(hh === ll ? 50 : (c[i] - ll) / (hh - ll) * 100);
      }
      return out;
    }
    function rsStd(v, n, i) {
      if (i < n - 1) return null;
      var m = 0, j; for (j = i - n + 1; j <= i; j++) m += v[j]; m /= n;
      var s = 0; for (j = i - n + 1; j <= i; j++) s += (v[j] - m) * (v[j] - m);

    // swing levels: fractal highs/lows (2 neighbours each side), most recent first
    function rsSwings(h, l) {

    }

    // votes at index i from precomputed series; returns {score, notes[]}
    function rsVotes(S, i) {
      var v = 0, notes = [];
      var c = S.c[i];
      if (S.rsi[i] != null) {
        if (S.rsi[i] < 30) { v += 1; notes.push(['RSI ' + S.rsi[i].toFixed(1), 'oversold', 1]); }
        else if (S.rsi[i] > 70) { v -= 1; notes.push(['RSI ' + S.rsi[i].toFixed(1), 'overbought', -1]); }
        else notes.push(['RSI ' + S.rsi[i].toFixed(1), 'neutral zone', 0]);
      }
      // Trend carries MORE weight than the oscillators, deliberately. In a
      // strong uptrend RSI and Stochastic sit "overbought" for days — if they
      // could outvote the trend, this table would say SELL all the way up.
      // Trend decides the direction; oscillators only fine-tune the timing.
      var e20 = S.e20[i], e50 = S.e50[i], e200 = S.e200[i];
      if (c > e20 && e20 > e50) { v += 1.5; notes.push(['EMA stack', 'price > EMA20 > EMA50 — uptrend', 1]); }
      else if (c < e20 && e20 < e50) { v -= 1.5; notes.push(['EMA stack', 'price < EMA20 < EMA50 — downtrend', -1]); }
      else if (e20 > e50) { v += 0.75; notes.push(['EMA stack', 'uptrend structure, price pulling back', 1]); }
      else if (e20 < e50) { v -= 0.75; notes.push(['EMA stack', 'downtrend structure, price bouncing', -1]); }

            out.cgId = hit.id;
            return rsJson('https://api.coingecko.com/api/v3/coins/' + hit.id + '?localization=false&tickers=false&market_data=true&community_data=false&developer_data=false')

      }).then(function () {

        if (!any) { rsErr = 'No Binance USDT-M perpetual found for ' + coin + (out.klErr ? ' (' + out.klErr + ')' : ''); }
        else rsReport = out;
      }).catch(function (e) { rsErr = e.message; })
        .then(function () { rsBusy = false; rsRender(); });
    };

    function rsNum(v, d) { return (typeof fmtAdaptive === 'function' && d == null) ? fmtAdaptive(v) : Number(v).toFixed(d == null ? 4 : d); }
    function rsPct(v, d) { var n = Number(v); return (n >= 0 ? '+' : '') + n.toFixed(d == null ? 2 : d) + '%'; }

    function rsPlanFor(S, T, dirUp) {
      var i = S.c.length - 1, px = S.c[i], atr = S.atr[i];
      if (!atr) return null;
      var sw = rsSwings(S.h, S.l);
      var sup = sw.sup.filter(function (x) { return x < px; }).sort(function (a, b) { return b - a; })[0];
      var res = sw.res.filter(function (x) { return x > px; }).sort(function (a, b) { return a - b; })[0];
      var entryA, entryB, stop, t1, t2;
      if (dirUp) {
        entryB = Math.min(px, S.e20[i]);                       // pullback to EMA20…
        entryA = sup != null ? Math.max(sup, entryB - atr) : entryB - atr; // …or toward support
        stop = (sup != null ? Math.min(sup, entryA) : entryA) - 1.5 * atr;
        var r = ((entryA + entryB) / 2) - stop;
        t1 = (entryA + entryB) / 2 + 1.5 * r;
        t2 = res != null ? Math.max(res, t1) : (entryA + entryB) / 2 + 2.5 * r;
      } else {
        entryB = Math.max(px, S.e20[i]);
        entryA = res != null ? Math.min(res, entryB + atr) : entryB + atr;
        stop = (res != null ? Math.max(res, entryA) : entryA) + 1.5 * atr;
        var r2 = stop - ((entryA + entryB) / 2);
        t1 = (entryA + entryB) / 2 - 1.5 * r2;
        t2 = sup != null ? Math.min(sup, t1) : (entryA + entryB) / 2 - 2.5 * r2;
      }
      var horizMin = T.horizon * T.mins;
      var horiz = horizMin >= 2880 ? Math.round(horizMin / 1440) + ' days' : horizMin >= 120 ? Math.round(horizMin / 60) + ' hours' : horizMin + ' min';
      return { entryLo: Math.min(entryA, entryB), entryHi: Math.max(entryA, entryB), stop: stop, t1: t1, t2: t2, sup: sup, res: res, horiz: horiz };
    }

    // ---- WHO is driving the move — derivatives forensics. Price alone
    // can't tell a real rally from a squeeze; price + open interest +
    // taker flow + funding CAN, because every driver leaves a different
    // fingerprint, and each fingerprint has a known typical ending. This
    // is the closest honest thing to "why is it pumping". ----
    function rsPearson(a, b) {
      var n = Math.min(a.length, b.length);
      if (n < 30) return null;
      var ra = [], rb = [];
      for (var i = 1; i < n; i++) { ra.push(a[i] / a[i - 1] - 1); rb.push(b[i] / b[i - 1] - 1); }
      var ma = 0, mb = 0, i2;
      for (i2 = 0; i2 < ra.length; i2++) { ma += ra[i2]; mb += rb[i2]; }
      ma /= ra.length; mb /= rb.length;
      var num = 0, da = 0, db = 0;
      for (i2 = 0; i2 < ra.length; i2++) { num += (ra[i2] - ma) * (rb[i2] - mb); da += (ra[i2] - ma) * (ra[i2] - ma); db += (rb[i2] - mb) * (rb[i2] - mb); }
      return (da && db) ? num / Math.sqrt(da * db) : null;
    }
    function rsPumpRead(R) {
      var S = R.tfs['15m']; if (!S || S.c.length < 100) return null;
      var i = S.c.length - 1;
      var mv4 = (S.c[i] / S.c[i - 16] - 1) * 100;          // last 4h move
      var mv24 = (S.c[i] / S.c[Math.max(0, i - 96)] - 1) * 100;
      // volume z-score of the last 2h vs the day before it
      var base = S.vol.slice(Math.max(0, i - 96), i - 8), rec = S.vol.slice(i - 8);
      var m = 0, j; for (j = 0; j < base.length; j++) m += base[j]; m /= (base.length || 1);
      var sd = 0; for (j = 0; j < base.length; j++) sd += (base[j] - m) * (base[j] - m);
      sd = Math.sqrt(sd / (base.length || 1)) || 1;
      var recAvg = 0; for (j = 0; j < rec.length; j++) recAvg += rec[j]; recAvg /= (rec.length || 1);
      var volZ = (recAvg - m) / sd;
      var oiCh4 = null;
      if (R.oi && R.oi.length > 20) {
        var oe = +R.oi[R.oi.length - 1].sumOpenInterestValue, os = +R.oi[R.oi.length - 17].sumOpenInterestValue;
        if (os) oiCh4 = (oe - os) / os * 100;
      }
      var taker = (R.taker && R.taker.length) ? +R.taker[R.taker.length - 1].buySellRatio : null;
      var fund = (R.perp && R.perp.prem) ? +R.perp.prem.lastFundingRate * 100 : null;
      var active = Math.abs(mv4) >= 2 || volZ >= 2;
      var up = mv4 >= 0;
      var driver = 'quiet — no unusual flow right now', ending = '';
      if (active && oiCh4 != null) {
        if (up && oiCh4 > 2)  { driver = 'NEW LEVERAGED LONGS are driving it (price up + open interest up' + (taker > 1.05 ? ' + aggressive market buying' : '') + ')';
                                ending = fund != null && fund > 0.05 ? 'funding is already expensive — late longs are paying the early ones; these moves end when the last chaser is in' : 'sustainable while funding stays cheap; watch funding for the top'; }
        else if (up && oiCh4 < -2) { driver = 'a SHORT SQUEEZE (price up while open interest FALLS — shorts closing, not buyers arriving)';
                                ending = 'squeezes end abruptly when the trapped shorts are done: do not chase, the fuel is finite'; }
        else if (up)          { driver = 'mostly SPOT BUYING (price up, leverage flat)'; ending = 'the healthiest kind of rally — pullbacks are buyable while it lasts'; }
        else if (oiCh4 > 2)   { driver = 'NEW SHORTS pressing it down (price down + open interest up)';
                                ending = fund != null && fund < -0.05 ? 'shorts are paying heavy funding to stay — squeeze fuel is building under this' : 'trend-shorting; bounces get sold until OI stops rising'; }
        else if (oiCh4 < -2)  { driver = 'a LONG LIQUIDATION FLUSH (price down + open interest collapsing — leveraged longs being force-closed)';
                                ending = 'flushes overshoot and often V-bottom once the cascade ends — the reversal candle comes on the biggest volume'; }
        else                  { driver = up ? 'steady buying, no leverage signature' : 'steady selling, no leverage signature'; }
      }
      // distribution check: big upper wicks on heavy volume = selling into strength
      var wick = 0, body = 0;
      for (j = i - 7; j <= i; j++) { wick += Math.max(0, S.h[j] - Math.max(S.c[j], S.c[j - 1])); body += Math.abs(S.c[j] - S.c[j - 1]); }
      var distrib = up && volZ > 1.5 && wick > body * 0.9;
      var S1 = R.tfs['1h']; var ext = null;
      if (S1) { var k1 = S1.c.length - 1; if (S1.atr[k1]) ext = (S1.c[k1] - S1.e20[k1]) / S1.atr[k1]; }
      return { active: active, up: up, mv4: mv4, mv24: mv24, volZ: volZ, oiCh4: oiCh4,
               driver: driver, ending: ending, distrib: distrib, ext: ext };
    }
    // ---- the crowd's state of mind, read from what they are PAYING, not
    // what they are saying. Funding is the price of conviction; the ratio
    // tells you which side is crowded; crowded + extended = squeeze fuel. ----
    function rsPsych(R) {
      var lines = [];
      var fund = (R.perp && R.perp.prem) ? +R.perp.prem.lastFundingRate * 100 : null;
      var ls = (R.ls && R.ls.length) ? +R.ls[R.ls.length - 1].longShortRatio : null;
      var taker = (R.taker && R.taker.length) ? +R.taker[R.taker.length - 1].buySellRatio : null;
      var fng = (R.fng && R.fng[0]) ? +R.fng[0].value : null;
      var S15 = R.tfs['15m']; var rsi15 = S15 ? S15.rsi[S15.rsi.length - 1] : null;
      if (fund != null) lines.push(fund > 0.05 ? 'Longs are paying ' + fund.toFixed(3) + '%/interval to stay in — that is GREED with a bill attached; crowded longs are squeeze-down fuel.'
        : fund < -0.05 ? 'Shorts are paying ' + Math.abs(fund).toFixed(3) + '%/interval — FEAR is crowded; that is squeeze-up fuel.'
        : 'Funding near flat — no side is desperate; moves here are more honest.');
      if (ls != null) lines.push(ls > 2 ? 'Retail accounts ' + ls.toFixed(1) + ':1 long — the boat is tilted; markets punish the crowded side first.'
        : ls < 0.7 ? 'Accounts crowded short (' + ls.toFixed(2) + ') — bounces will be violent.' : 'Long/short balance is unremarkable (' + ls.toFixed(2) + ').');
      if (taker != null && (taker > 1.15 || taker < 0.87)) lines.push(taker > 1.15 ? 'Market orders are hitting the ask (' + taker.toFixed(2) + ') — urgency, FOMO phase.' : 'Market orders smashing the bid (' + taker.toFixed(2) + ') — urgency to exit, capitulation behaviour.');
      if (rsi15 != null && (rsi15 > 80 || rsi15 < 20)) lines.push(rsi15 > 80 ? '15m RSI ' + rsi15.toFixed(0) + ': euphoria zone — the crowd that buys HERE is the crowd that gets trapped.' : '15m RSI ' + rsi15.toFixed(0) + ': panic zone — the crowd that sells here usually sells the low.');
      if (fng != null) lines.push('Whole-market mood: ' + fng + '/100 (' + (R.fng[0].value_classification || '') + ')' + (fng >= 75 ? ' — extreme greed markets forgive nothing.' : fng <= 25 ? ' — extreme fear is where bottoms are built, slowly.' : '.'));
      return lines;
    }
    function rsBtcCtx(R) {
      var o = { lines: [] };

        o.dom = R.global.market_cap_percentage.btc;

      }

        }

      return o;
    }

    // ================================================================
    // VISUAL KIT — inline SVG, zero dependencies. Dark trading-terminal

    var RSC = { bg:'#0e1725', bg2:'#0a111d', line:'#22314a', ink:'#e8eef7', sub:'#8ba0bd', mut:'#5f7391',

    function rsConfCol(p){ return p>=65?RSC.up:p>=40?RSC.amb:RSC.dn; }

    // fear/greed semicircle dial with needle
    function rsDial(v, label){
      v=Math.max(0,Math.min(100,v));
      var W=196,H=116,cx=98,cy=100,r=78;
      function pt(val){ var a=Math.PI*(1-val/100); return [cx+r*Math.cos(a), cy-r*Math.sin(a)]; }
      function arc(a0,a1,col){ var a=pt(a0),b=pt(a1); return '<path d="M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+' A'+r+' '+r+' 0 0 1 '+b[0].toFixed(1)+' '+b[1].toFixed(1)+'" fill="none" stroke="'+col+'" stroke-width="13"/>'; }

        + arc(0,25,RSC.dn)+arc(25,45,RSC.org)+arc(45,55,RSC.amb)+arc(55,75,'#4ade80')+arc(75,100,RSC.up)
        + '<line x1="'+cx+'" y1="'+cy+'" x2="'+n[0].toFixed(1)+'" y2="'+n[1].toFixed(1)+'" stroke="'+RSC.ink+'" stroke-width="3" stroke-linecap="round"/>'
        + '<circle cx="'+cx+'" cy="'+cy+'" r="5.5" fill="'+RSC.ink+'"/>'
        + '<text x="'+cx+'" y="'+(cy-16)+'" text-anchor="middle" fill="'+col+'" font-size="24" font-weight="800">'+Math.round(v)+'</text>'
        + '<text x="'+cx+'" y="'+(H-2)+'" text-anchor="middle" fill="'+RSC.sub+'" font-size="10" font-weight="700">'+(label||'')+'</text>'
        + '</svg>';

    // signed tug-of-war bar (bear left / bull right), frac in -1..1
    function rsTug(frac, leftLbl, rightLbl, valTxt, valCol){

      return '<div style="margin:8px 0;">'
        +'<div style="display:flex;justify-content:space-between;font-size:10px;color:'+RSC.sub+';margin-bottom:3px;"><span>'+leftLbl+'</span><span style="color:'+(valCol||RSC.ink)+';font-weight:800;">'+valTxt+'</span><span>'+rightLbl+'</span></div>'
        +'<div style="position:relative;height:10px;background:'+RSC.bg2+';border-radius:5px;overflow:hidden;">'
        +'<div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:'+RSC.mut+';z-index:2;"></div>'
        + (bull ? '<div style="position:absolute;left:50%;top:0;bottom:0;width:'+half+'%;background:'+RSC.up+';box-shadow:0 0 8px '+RSC.up+'88;"></div>'
                : '<div style="position:absolute;right:50%;top:0;bottom:0;width:'+half+'%;background:'+RSC.dn+';box-shadow:0 0 8px '+RSC.dn+'88;"></div>')

    }
    // candlestick chart with entry-zone / stop / T1 / T2 overlays
    function rsChart(S, plan, dirUp){
      var W=340,H=176,padL=4,padR=56,padT=8,padB=6, n=56, start=Math.max(1,S.c.length-n);
      var C=S.c.slice(start),Hh=S.h.slice(start),L=S.l.slice(start),O=[];
      for(var i=0;i<C.length;i++) O.push(S.c[start+i-1]);
      var lo=Math.min.apply(null,L), hi=Math.max.apply(null,Hh);
      if(plan){ lo=Math.min(lo,plan.stop,plan.entryLo,plan.t1,plan.t2); hi=Math.max(hi,plan.stop,plan.entryHi,plan.t1,plan.t2); }
      var pad=(hi-lo)*0.06||hi*0.01; lo-=pad; hi+=pad;
      var plotW=W-padL-padR, plotH=H-padT-padB, cw=plotW/C.length, bw=Math.max(1.4,cw*0.62);
      function y(p){ return padT+(hi-p)/(hi-lo)*plotH; }
      var s='';
      for(var i=0;i<C.length;i++){
        var x=padL+i*cw+cw/2, up=C[i]>=O[i], col=up?RSC.up:RSC.dn;
        s+='<line x1="'+x.toFixed(1)+'" y1="'+y(Hh[i]).toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+y(L[i]).toFixed(1)+'" stroke="'+col+'" stroke-width="1"/>';
        var yo=y(O[i]),yc=y(C[i]),top=Math.min(yo,yc),h=Math.max(1,Math.abs(yc-yo));
        s+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+col+'"/>';
      }
      function hln(p,col,dash,lbl){ var yy=y(p); return '<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR).toFixed(1)+'" y2="'+yy.toFixed(1)+'" stroke="'+col+'" stroke-width="1" stroke-dasharray="'+dash+'"/><text x="'+(W-padR+3)+'" y="'+(yy+3).toFixed(1)+'" fill="'+col+'" font-size="9" font-weight="800">'+lbl+'</text>'; }
      var ov='';
      if(plan){
        var ya=y(plan.entryHi),yb=y(plan.entryLo), ec=dirUp?RSC.up:RSC.dn;
        ov+='<rect x="'+padL+'" y="'+Math.min(ya,yb).toFixed(1)+'" width="'+plotW.toFixed(1)+'" height="'+Math.max(2,Math.abs(yb-ya)).toFixed(1)+'" fill="'+ec+'" opacity="0.14"/>';
        ov+=hln((plan.entryHi+plan.entryLo)/2,ec,'1 0','entry')+hln(plan.stop,RSC.dn,'3 2','stop')+hln(plan.t1,RSC.up,'3 2','T1')+hln(plan.t2,RSC.cyn,'3 2','T2');
      }
      var last=C[C.length-1],yl=y(last);
      ov+='<line x1="'+padL+'" y1="'+yl.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yl.toFixed(1)+'" stroke="'+RSC.sub+'" stroke-width="0.6" stroke-dasharray="1 3"/>';
      return '<svg width="100%" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="display:block;background:'+RSC.bg2+';border-radius:10px;">'+s+ov+'</svg>';
    }

    function rsCard(inner, accent){ return '<div style="grid-column:1/-1;background:'+RSC.bg+';border:1px solid '+RSC.line+';border-left:3px solid '+(accent||RSC.line)+';border-radius:14px;padding:14px 16px;color:'+RSC.ink+';">'+inner+'</div>'; }
    function rsTitle(txt, col){ return '<div style="display:flex;align-items:center;gap:7px;font-weight:800;font-size:12.5px;letter-spacing:.4px;text-transform:uppercase;margin-bottom:9px;color:'+RSC.sub+';"><span style="width:8px;height:8px;border-radius:50%;background:'+(col||RSC.cyn)+';box-shadow:0 0 8px '+(col||RSC.cyn)+';"></span>'+txt+'</div>'; }
    function rsBadge(txt,col){ return '<span style="display:inline-block;padding:5px 16px;border-radius:9px;font-weight:800;font-size:16px;color:#06101c;background:'+col+';box-shadow:0 0 18px '+col+'99;">'+txt+'</span>'; }

    // ================================================================
    // PREDICTION ENGINE v2 — regime-aware, trigger-based, contrarian-
    // adjusted. What actually changed vs the naive vote-sum:
    //
    //  1. REGIME FIRST. A market is TRENDING, RANGING, or in a SQUEEZE
    //     (volatility compression), and the correct trade is different
    //     in each: pullbacks in trends, edges in ranges, breakout
    //     retests out of squeezes. Trend tools in a range are how
    //     entries die; the engine now refuses to mix them.
    //  2. TRIGGERS, not hopes. Entries come with the condition that
    //     must PRINT first — "1h close back above EMA20 ($x)" — so a
    //     falling knife is never caught mid-air.
    //  3. THE CROWD AS A CONTRARIAN INPUT. Funding stretched in your
    //     direction and a tilted long/short boat SUBTRACT conviction;
    //     flow (OI + taker) that agrees adds it. BTC opposing a
    //     passenger coin is close to a veto.
    //  4. CONSISTENCY BY CONSTRUCTION. One evidence score produces
    //     both the call and its conviction; under 52% the call IS
    //     WAIT. No more "LONG, 43".
    //  (My Coins verdicts and the server watcher keep their own proven
    //   logic — this engine is the Research page's brain only.)
    // ================================================================
    function rsRegime(S) {
      var i = S.c.length - 1, atr = S.atr[i] || (S.c[i] * 0.01);
      var back = Math.min(10, i - 1);
      var slope10 = (S.e20[i] - S.e20[i - back]) / atr;          // EMA20 travel in ATRs
      var bws = [];                                               // Bollinger bandwidth history
      for (var j = Math.max(20, i - 120); j <= i; j++) {
        var sd = rsStd(S.c, 20, j), m = S.s20[j];
        if (sd != null && m) bws.push(4 * sd / m);
      }
      var bw = bws.length ? bws[bws.length - 1] : 0;
      var below = 0; for (var k = 0; k < bws.length; k++) if (bws[k] <= bw) below++;
      var bwPct = bws.length ? below / bws.length : 0.5;          // percentile of current bandwidth
      // Kaufman efficiency ratio: NET progress over 40 bars divided by the
      // PATH walked to get there. A trend goes somewhere (high ER); a range
      // walks miles to end up where it started (low ER). An EMA slope alone
      // mistakes one leg of a big slow swing for a trend — which is exactly
      // how range edges get bought as "breakouts".
      var w = Math.min(40, i - 1), path = 0;
      for (var q = i - w + 1; q <= i; q++) path += Math.abs(S.c[q] - S.c[q - 1]);
      var er = path > 0 ? Math.abs(S.c[i] - S.c[i - w]) / path : 0;
      var trending = er >= 0.30 && Math.abs(slope10) >= 0.6;
      var squeeze = !trending && bwPct <= 0.28 && er < 0.25;
      return { mode: squeeze ? 'squeeze' : trending ? 'trend' : 'range', slope10: slope10, bwPct: bwPct, er: er };
    }
    // Evidence score for one timeframe, -100..+100, with the receipts.
    function rsScoreTF(S) {
      var i = S.c.length - 1, c = S.c[i], atr = S.atr[i] || c * 0.01, ev = [];
      // trend block (max |40|)
      var T = 0;
      if (c > S.e20[i] && S.e20[i] > S.e50[i]) { T = 30; ev.push(['trend', 'full bull stack', 30]); }
      else if (c < S.e20[i] && S.e20[i] < S.e50[i]) { T = -30; ev.push(['trend', 'full bear stack', -30]); }
      else if (S.e20[i] > S.e50[i]) { T = 18; ev.push(['trend', 'up structure, price pulling back', 18]); }
      else if (S.e20[i] < S.e50[i]) { T = -18; ev.push(['trend', 'down structure, price bouncing', -18]); }
      if (i >= 200) { var t2 = c > S.e200[i] ? 8 : -8; T += t2; ev.push(['trend', c > S.e200[i] ? 'above 200-EMA' : 'below 200-EMA', t2]); }
      var rg = rsRegime(S);
      var sl = Math.max(-10, Math.min(10, rg.slope10 * 8));
      if (Math.abs(sl) >= 3) { T += sl; ev.push(['trend', 'slope ' + (sl > 0 ? 'up' : 'down'), Math.round(sl)]); }

      // momentum block (max |25|)
